中，我看到了很多种不同的声音。\n有些人喜欢复杂的杀人诡计，沉迷于密室推理与不可能犯罪，觉得这才是推理小说的真正内涵；\n也有人看重小说中纷乱的人物关系与跌宕起伏的故事情节，遵循着基本演绎法，讲求动机背后隐藏的秘密；\n还有人将推理小说视为作者与读者的对决，在追求线索公平性的同时，享受抽丝剥茧的快感。\n在不同时期的我看来，或许因为阅历不同，这些都有一定道理，是我在某个时间点所追寻的目标。\n但在我生命的最后，在经历了那样的人生之后，作为我的谢幕之作，我却想尝试一种全新的形式。\n我希望这是一篇由我与诸君共同完成的作品。\n我希望这是一篇跨越虚拟与现实，绝对公平的作品。","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794224129316,"updatedAt":1794225816013,"reviews":[{"id":"559be7e8-19df-4345-952f-be2c8b44be17","scriptId":"792d922c-4ada-4f00-9073-142f20d8b46d","name":"网络玩家2","rating":0,"content":"对于喜欢推理解谜的玩家而言，这部作品无疑是一场精彩的推理盛宴。剧本杀《推理作家的谋杀艺术》不仅提供了紧张刺激的剧情，还有丰富的角色设定，适合不同水平的玩家。无论是喜欢推理还是情感体验，都能在这个剧本中找到乐趣。","source":"network","createdAt":1794224069318},{"id":"1ad5dbc8-df39-4cd7-8102-f9163b115698","scriptId":"792d922c-4ada-4f00-9073-142f20d8b46d","name":"网络玩家1","rating":0,"content":"整体来看，《推理作家的谋杀艺术》不仅在剧情设计上丰富多彩，还通过结构紧凑和推理逻辑的丝滑展示，为玩家提供了一场充满挑战和惊喜的推理之旅","source":"network","createdAt":1794224009318}],"rating":{"avg":0,"count":0,"total":2}},{"id":"7732ebe2-52fb-45d2-8b63-7525457a0156","title":"猫岛2犬山谋杀循环","cover":"uploads/1794224125207-31050799.jpg","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":3,"female":3,"duration":8.5,"difficulty":"进阶","price":68,"memberPrice":0,"author":"","publisher":"","intro":"猫岛续作来袭！！？洋葱与甜甜圈再度携手炫技。\n薛定谔的魔盒被打破，小猫岛的真相伴随着犬山的血腥屠杀即将浮出水面。\n上头的疯批人设x缜密的逻辑推理，这一次，让我们快乐加倍，再次走进疯批的内心世界。\n“曾经，我因为自己不够变态而和大家格格不入。” “现在？现在只有我一个人了呢。”\n愿犬神保佑幸福。","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794224125208,"updatedAt":1794224312680,"reviews":[{"id":"3edc7652-4115-4d55-8dfd-676f8f580792","scriptId":"7732ebe2-52fb-45d2-8b63-7525457a0156","name":"网络玩家6","rating":0,"content":"在此之后，在进入人物关系的还原后，就是案件，案件难度相较猫岛1有所上升，但是却有着非常多的巧思以及有些案件保留着猫岛1同样的变态点。","source":"network","createdAt":1794224065209},{"id":"371fa3ce-cdf1-497d-ad6a-071b65af1f89","scriptId":"7732ebe2-52fb-45d2-8b63-7525457a0156","name":"网络玩家5","rating":0,"content":"但是，在犬山的故事中，整体故事的分享在游戏的开始就已经基本全部给出。","source":"network","createdAt":1794224005209},{"id":"ffb082d4-5e18-4672-9db1-349e7cb36cea","scriptId":"7732ebe2-52fb-45d2-8b63-7525457a0156","name":"网络玩家4","rating":0,"content":"首先，犬山的推理中包含密室和还原，其中密室的占比在剧本中为3，剩下的7中均为还原。","source":"network","createdAt":1794223945209},{"id":"994725da-4b65-4f98-b478-7b02f096d5ed","scriptId":"7732ebe2-52fb-45d2-8b63-7525457a0156","name":"网络玩家3","rating":0,"content":"作为9分神作的猫岛续作，相信无论是作者还是工作室都有着非常的压力，而犬山无疑是非常成功的满分答卷。","source":"network","createdAt":1794223885209},{"id":"c164b516-803c-47ce-b858-6ddf2f26bcd9","scriptId":"7732ebe2-52fb-45d2-8b63-7525457a0156","name":"网络玩家2","rating":0,"content":"时长7-8，纵享变态人生。","source":"network","createdAt":1794223825209},{"id":"94f2c409-8812-4a40-9a9a-b03906418dfd","scriptId":"7732ebe2-52fb-45d2-8b63-7525457a0156","name":"网络玩家1","rating":0,"content":"比猫岛更加猫岛的犬山，还原的内容让人有更强的兴趣与欲望，曾经的我们如果只是变态，那么这一次，就是变态中的变态。","source":"network","createdAt":1794223765209}],"rating":{"avg":0,"count":0,"total":6}},{"id":"49d653f1-38bf-4a80-b2c1-3e9bf5e10a45","title":"猫岛谋杀循环","cover":"uploads/1794224108818-e3c0067f.png","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":0,"female":0,"duration":6.5,"difficulty":"进阶","price":68,"memberPrice":0,"author":"","publisher":"","intro":"孤僻少年桃山优离奇自杀，为了追寻真相，心理教授将记载当年事件的六本日记启封，邀请了六位看似无关的客人来参加这场推理的饕餮晚宴。\n血缸中溺亡的人彘;铁架上残破的肢体暴雨时离奇的断首;悬崖下模糊的头皮密室内蒸发的人影。熔炉里碳化的骨架;\n无人生还的诅咒，是开启谋杀循环的源头。\n丧心病狂的凶手，享受着变态颤栗的动机。\n也许，只有足够了解变态的人，才能看破隐藏在猫岛的绝望真相。\n又或许，只有真正的变态才能理解变态的真谛。\n那么，各位远道而来参与推理的客人们，你们又到底是哪种人呢?","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794224108819,"updatedAt":1794224303517,"reviews":[{"id":"6aa9cf19-95e9-4105-b77f-c5ab9929948a","scriptId":"49d653f1-38bf-4a80-b2c1-3e9bf5e10a45","name":"网络玩家","rating":0,"content":"感觉这两天所有好友都在打猫岛！对于猫岛，从一开始的期待变态，理解变态，超越变态，到最后嗑我们星川家只是简简单单的双向奔赴的纯爱而已啦！三对夫妻每一对都有点东西，我们这一车4女2男，结果阴差阳错两个男生拿到麻衣和树简直是两个搞笑担当，散拼车快乐值都拉满了！“B向山直人：我挂个joker招牌算了！”“D水原树：原来真正的小丑一直都是我！”“E酒户麻衣：我怎么和这么多人…”“F和歌橘：我可是纯爱！”“C水原薰、A宫崎泉：吃孩子们的瓜吃的真快乐啊，摁着树薅啊” 纯本格密室加日记格式，有点设定也是非常人话超级好理解！虽然也叫循环但是比那个天书循环对我真的友好了一百万倍！！！五个密室很简单，脑洞推理我的最爱，第一案灵机一动就会秒破系列！后面的还原占比很大，每一重推理都是独立存在的，不存在伪解答，所有逻辑闭环全都能盘通，人设贯穿全场！全程高能，我也是全程在线！真的yyds！9个小时有点久了，但好玩的本线下慢慢推我很有耐心，听dm再给没跟上的解释一遍也没什么，全员在线不需要回头去解释其实会更快！","source":"network","createdAt":1794224048820}],"rating":{"avg":0,"count":0,"total":1}},{"id":"59a144a0-1432-4894-9cdf-1b32c30ac90e","title":"尘世奇案录通幽","cover":"uploads/1794299607678-d04c64cc.jpg","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":5,"female":1,"duration":8,"difficulty":"进阶","price":68,"memberPrice":0,"author":"","publisher":"","intro":"案件中，我们用时最久的是第四案【孤岛别墅】，虽然它在所有案件中“动线推理”最为简洁，但其核心的破局点完全“剑走偏锋”，像是开辟了一种全新的推理思路，反常规的逻辑设计“灵气十足”，让人感慨离谱的同时又感觉思路“茅塞顿开”，其次是我个人很喜欢的第一案【双人循环】，极为巧妙的只用一道弹痕延展出一长段的演绎推理，并且将动线与动机的完美契合!\n再就是第二案【雪地毒杀】，这一案的推理其实最为复杂，虽然推出“凶手诡计”很简单，但却仍需要对所有人的动线进行还原，找出吻合手法的“唯一凶手”，这一案虽然诡计不难，但由于“凶手可能性”众多，所以反倒是容易陷进繁琐的信息中，从而忽视掉“锁凶”的关键逻辑点，最后是第三案【仓库密室】，此案的线索乍一看会觉得非常繁琐冗杂，但其实在“理清谜面”后解答异常简单，所以算是四案中质量最垫底的一案!","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794224092031,"updatedAt":1794299618081,"reviews":[{"id":"6df7d73b-236a-4214-8116-8e7440b26342","scriptId":"59a144a0-1432-4894-9cdf-1b32c30ac90e","name":"网络玩家6","rating":0,"content":"还原比重小但同样精彩。叙了你，但不会让你难受，反而回去夸它的丝滑。最后的情感part也不会喧宾夺主，反而锦上添花，难得!","source":"network","createdAt":1794224032033},{"id":"09eded19-9b7f-4e3c-b11c-752e0d12e53f","scriptId":"59a144a0-1432-4894-9cdf-1b32c30ac90e","name":"网络玩家5","rating":0,"content":"人物视角区别不大，无边c，案件线索统一，案件是主菜是重点但手法不用重盘，就很舒服。","source":"network","createdAt":1794223972033},{"id":"c04e41c2-0e6b-4e24-b0ec-680cb4480006","scriptId":"59a144a0-1432-4894-9cdf-1b32c30ac90e","name":"网络玩家4","rating":0,"content":"不要放过不起眼的线索，也不要忽略任何一个细节。恍然回首，“我草”，居然是这个?好久没有这种推理到爽的推理本，不是为了难而去为难玩家，它设计的每一个细节都很简单，你可能都见过，但综合起来，组成一盘复杂的大棋。","source":"network","createdAt":1794223912033},{"id":"98c11973-d86a-4bd4-a361-db458ad8e925","scriptId":"59a144a0-1432-4894-9cdf-1b32c30ac90e","name":"网络玩家3","rating":0,"content":"微设定，案件手法纯本格。就问，现在推理本是不是遍地还原本，到处都是大设定?!反观通幽的设定不多，案件基本不用管设定，就纯盘，人物行动线、时间线、手法，光是这三点就少有本能做到，做到好玩就更难啦。","source":"network","createdAt":1794223852033},{"id":"0f880178-6d99-4d81-8798-509b77c1e508","scriptId":"59a144a0-1432-4894-9cdf-1b32c30ac90e","name":"网络玩家2","rating":0,"content":"每个案件体量均大于1小时，我打的是纯放盘版，有的案子超过2小时，时长难以掩盖我对案件的喜欢。","source":"network","createdAt":1794223792033},{"id":"83b721d5-376d-43a8-a715-1bb7dd124364","scriptId":"59a144a0-1432-4894-9cdf-1b32c30ac90e","name":"网络玩家1","rating":0,"content":"区区4个案件，但超级耐盘，绝不能掉线，毫无尿点，甚至要求中场休息三分钟。(但实际没人敢休息，嘎嘎盘)","source":"network","createdAt":1794223732033}],"rating":{"avg":0,"count":0,"total":6}},{"id":"94cd9c63-58f8-4e6f-9dd3-17acd396dc80","title":"天启诡案","cover":"uploads/1794224090197-9900e23a.jpg","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":4,"female":2,"duration":7,"difficulty":"进阶","price":78,"memberPrice":0,"author":"","publisher":"","intro":"《天启诡案》故事始于明朝天启年间一场离奇的王恭厂大爆炸，六位身份各异的失忆者在废墟中醒来，被迫卷入一场涉及机关术与朝堂隐秘的“代天巡狩”仪式。玩家将扮演陈义、龙渊等角色，在仅有的三个剧本中，理解“领域”与“守卫”等核心设定，直面三重案件矩阵。核心任务为：运用高复用率的设定破解“3×3”案件谜题，识破层层嵌套的红鲱鱼诡计，通过长逻辑链推理梳理谋杀循环、绝对密室等复合型谜面，并在最终的思维盲区中亲手构筑“第十案”，完成对整个“天启诡案”真相的终极收束。全程需8小时以上的高强度专注协作，体验纯粹的逻辑与诡计交锋。","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794224090198,"updatedAt":1794224329017,"reviews":[{"id":"1e9cc9a7-91dd-4aed-b51c-c395f1ab2fc1","scriptId":"94cd9c63-58f8-4e6f-9dd3-17acd396dc80","name":"网络玩家4","rating":0,"content":"整体就是一场非常纯粹的脑力马拉松，故事基本是送的，为案件服务。设定理解不难，但用起来千变万化，逻辑链很长很结实，几乎没有软逻辑。适合那种能坐得住、就爱啃硬骨头、享受在设定框架下找唯一解的玩家，打完十二小时脑袋是木的，但心里是爽的。","source":"network","createdAt":1794224030199},{"id":"f2507741-b5aa-4b1c-9999-df0c18e01203","scriptId":"94cd9c63-58f8-4e6f-9dd3-17acd396dc80","name":"网络玩家3","rating":0,"content":"最后那一下是真的没想到。以为九个案子盘完总该结束了吧，结果DM笑眯眯地看着我们，说还有一个谜面没出来。我们愣是没找到新线索，后来才反应过来，谜面得靠我们自己从前面盘的结论里“造”出来。那个瞬间鸡皮疙瘩都起来了，感觉之前八个小时全是在给这一刻铺路。","source":"network","createdAt":1794223970199},{"id":"516ac433-cbfd-4d98-843d-5c73ac7fcb6e","scriptId":"94cd9c63-58f8-4e6f-9dd3-17acd396dc80","name":"网络玩家2","rating":0,"content":"最绝的是盘第二重的时候，明明地方还是那个地方，人还是那些人，就因为某个条件变了，整个手法和逻辑全得推倒重来。之前觉得铁板钉钉的解答，突然就成了最大的漏洞，脑子里的齿轮咔咔响，有点像自己亲手把搭好的积木拆了，还得用同一堆积木搭个更难的。中间好几次感觉摸到门路了，结果一脚踩进作者挖的红鲱鱼坑里，全车人一起“哎哟”一声。","source":"network","createdAt":1794223910199},{"id":"cec51309-e954-4616-8523-4b511c20a5a4","scriptId":"94cd9c63-58f8-4e6f-9dd3-17acd396dc80","name":"网络玩家1","rating":0,"content":"开场听完设定直接发案件本，一点缓冲都没有。本以为要读很久，结果就几页纸，但信息量跟压缩饼干似的，嚼一口能撑半天。第一案那个杀人循环上来就把我们干懵了，感觉谁都是凶手谁又都不该是凶手，盘了俩小时才把第一个逻辑扣子解开，结果发现后面还拴着一串儿。","source":"network","createdAt":1794223850199}],"rating":{"avg":0,"count":0,"total":4}},{"id":"1a0837be-1e7b-42b5-8961-b08f69976d97","title":"撕裂2愚者的无冕之作","cover":"uploads/1794299650941-7cbc04cb.jpg","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":3,"female":3,"duration":8,"difficulty":"进阶","price":68,"memberPrice":0,"author":"","publisher":"","intro":"《撕裂2愚者的无冕之作》以架空乐园中愚者的献祭之舞为引，六位玩家作为羔羊踏入三间诡阁，卷入交织的九起血案，在死者、时间、真理与神明构成的审判庭中，用推理执行最终裁决。核心任务为：在近乎无故事的纯推理框架下，破解3起本格与6起设定系案件，从网状谜面中运用逻辑链寻找唯一线性解答，体验建筑诡计、空间动线与多重反转，经历由浅入深的推演后，在仅有的情感收束里直面愚者以爱为名的终极救赎","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794224086623,"updatedAt":1794299660317,"reviews":[{"id":"33c07961-124e-4d14-8f79-5f9846703c4a","scriptId":"1a0837be-1e7b-42b5-8961-b08f69976d97","name":"网络玩家3","rating":0,"content":"整体就是纯度很高的推理套餐，几乎没故事掺水。案件质量挺扎实，逻辑封堵做得严实，虽然有点后置线索但没觉得膈应。适合那种喜欢埋头做题、琢磨空间关系的玩家，新手跟着破冰案也能蹭上车。","source":"network","createdAt":1794224026630},{"id":"d682599a-6c0a-4e56-a7e3-3bc432d96a31","scriptId":"1a0837be-1e7b-42b5-8961-b08f69976d97","name":"网络玩家2","rating":0,"content":"核诡前那段悖论梳理，感觉在解一团打结的耳机线。车友黑板写得密密麻麻，每次以为找到线头，拉出来又是死结。反转后逻辑链像多米诺一样接连推倒重来，撞墙三四回才摸到门，但诡异的是越盘越精神，后半夜反而来劲了。","source":"network","createdAt":1794223966630},{"id":"022899d0-5ddd-4560-99d6-52412f46472f","scriptId":"1a0837be-1e7b-42b5-8961-b08f69976d97","name":"网络玩家1","rating":0,"content":"开局两分钟就被按进案件里，一点缓冲都不给。九起案子哐哐砸过来，从本格小屋钥匙到设定系高塔，像在自助餐厅挨个试菜，每个盘子底下都藏着小钩子。盘的时候基本不用费脑记名字，全场就盯着动线和设定啃，建筑诡计部分靠裸眼3D救了命，不然我脑子里的立体图大概会塌成二维。","source":"network","createdAt":1794223906630}],"rating":{"avg":0,"count":0,"total":3}},{"id":"aecf590f-7a3c-43b2-bba9-19a4e9d5fe51","title":"撕裂神之诡面","cover":"uploads/1794224083439-8b4bea61.png","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":3,"female":3,"duration":7,"difficulty":"进阶","price":68,"memberPrice":0,"author":"","publisher":"","intro":"从很久以前，因特拉肯城中便流传着一则关于“弑乐园“的传说。\n相传只要在“弑乐园”中完成献给神明的死亡表演，便能向无所不能的神明许愿，达成心底的愿望，万事皆可。届时神明会降下红云，此为兑现诺言的凭证。\n岁月轮转，日月如楼，在漫长的历史变迁中，无数的高楼大厦在因特拉肯平地而起，钢铁组成的机器也在其中运转。\n而这则古老的传说也成了茶余饭后的笑谈。直到今日，一个佝偻着背的老人再一次来到了神面前。\n这是近百年之中，扣响门扉的第二位访客。而神明也在此等待了男人许久了.…","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794224083486,"updatedAt":1794224362624,"reviews":[{"id":"6125934e-2c1f-42dd-a34c-8c23c16d4edb","scriptId":"aecf590f-7a3c-43b2-bba9-19a4e9d5fe51","name":"网络玩家","rating":0,"content":"非常有幸在大连展最后一天抽中了公车位，避免成为\n一篇毫无卵用的乱吹的测评，今天还是客观的来讲一 讲体验。也希望帮助到店家和玩家进行选择。\n#前言\n之前就有益达味梅子酒的《虚明系列》的作品，且个 人是非常喜欢这个系列的，虽然有些玩家会觉得整个 剧本会有些微割裂感，但瑕不掩瑜，益达的手法和建 筑诡计的设计，一直是我认为设计的非常优秀的，合 理且让人舒适的，而这一次的《撕裂神之诡面》，毫 不夸张的说，对比前列作品，不但保留了优秀的手法 和建诡写的设计，而且在整体性和连贯性上有巨大的 突破！这个写在最后~\n剧评：\n推理：满天星\n难度：没有dm可能有点难\n剧本成分：推理：还原（93%：7%）\n剧本时长：6-8h-今天体验时长6h\n剧本结构与节奏：高-休息-中-高-高-高（不能写太明）\n剧本特点：高纯度推理（全程无尿点-真）\n发行汉堡说：高纯度推理是啥？就是一杯美式不加冰，\n第一口和最后一口的味道，都是香醇的，都是一样 的。\n展开说说：\n感受一非常满，全程无尿点\n机制本，情感本没尿点我听过，一个推理本没尿点？ 这还是第一次！上个厕所，抽个烟，还是边抽烟边在 盘（完全没有摆烂）的情况下，回到座位上就","source":"network","createdAt":1794224023520}],"rating":{"avg":0,"count":0,"total":1}},{"id":"7693e24f-b431-4741-a0ca-bc7c18bda827","title":"安美纳斯de死亡推想","cover":"uploads/1794224076630-aa759ab9.jpg","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":4,"female":2,"duration":8,"difficulty":"进阶","price":68,"memberPrice":0,"author":"","publisher":"","intro":"记忆，像是从另一个世界倾倒而来的海水，等到风平浪静，“我 们”便看到了水面中浮现着的“我们”的模样。这便是安美纳斯， 这便是“我们”，一切的始源。\n雾霭深处潜藏的杀意，四季轮转构建的难题——季之馆中，如 果不知身处何地，请勿继续向下探寻；\n纵然拥有天大的力气，无法逃过精密的仪器——矩形馆中，来 者何人声东击西，死亡如约一泻千里；\n不可沾染厄运的气息，跨越整个世界的诡计——阴阳馆中，逻 辑是坚硬的墙壁，答案是新鲜的尸体。\n绝对真实的口供，绝无差错的设定，为何，凶手可以一次次， 一次次，一次次，去“创造”，不，是去“实现”那一场场既定的 死亡。\n“其实，一些时候，真相，不过是人们真正愿意相信的事情罢 了。可每个人都有自己认知的局限，那句话怎么说的来着？夏 虫不可语冰，夏天的虫子不可能去探讨冬天的冰块，这就是你 们犯下的最为致命的错误。改正的方法很简单，那就是——用 你们狂热的逻辑和推想去融化那刻印在头脑之中名为“常识”，又 或者说，名为“偏见”的坚冰。”\n男人一边说着话，一边摊开手掌，刚刚那颗方正的冰块已经变 成了一小撮水。水顺着男人的指缝滴落到地面上。\n“这便是——最好的隐喻。”","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794224076631,"updatedAt":1794224374024,"reviews":[{"id":"ede3e4eb-5a28-45d3-95a7-4b9c06750ce9","scriptId":"7693e24f-b431-4741-a0ca-bc7c18bda827","name":"网络玩家5","rating":0,"content":"🚫 吐槽：虽然剧本整体出色，但某些操作略显重复，希望作者在后续作品中能更加精炼。","source":"network","createdAt":1794224016634},{"id":"e290d984-9372-49cd-a052-db8ec9783635","scriptId":"7693e24f-b431-4741-a0ca-bc7c18bda827","name":"网络玩家4","rating":0,"content":"🎉 推荐：无论是从推理还是情感体验上，安美纳斯的死亡推想都值得一试。它没有明显的杠点，让人玩得尽兴。","source":"network","createdAt":1794223956634},{"id":"f57852d4-dbe9-41e5-acb8-ce258b1d8dea","scriptId":"7693e24f-b431-4741-a0ca-bc7c18bda827","name":"网络玩家3","rating":0,"content":"🌟 元素：剧本中融合了多种元素，但作者处理得当，没有炫技感，反而让人感到舒适。最后的立意环节更是点睛之笔，让整个故事在还原后得以升华。","source":"network","createdAt":1794223896634},{"id":"e589994b-076f-4138-95ee-de225603cb2d","scriptId":"7693e24f-b431-4741-a0ca-bc7c18bda827","name":"网络玩家2","rating":0,"content":"🎯 流程：多轮翻转的盘，第一轮就让人眼前一亮，后面的细节盘查也丝毫不减热度。案子设计巧妙，没有废话，每一次翻转都让人更加投入。","source":"network","createdAt":1794223836634},{"id":"9fb4cba8-440b-401e-8d1f-bd875a44b2ea","scriptId":"7693e24f-b431-4741-a0ca-bc7c18bda827","name":"网络玩家1","rating":0,"content":"安美纳斯的死亡推想，真是一场智力与情感的盛宴！相比其他剧本，它的推理部分更为出色，还原度极高（9:1，甚至9.5:0.5）。设定推理丰富，虽然初看有些复杂，但一旦理解透彻，盘起来就如同行云流水。","source":"network","createdAt":1794223776634}],"rating":{"avg":0,"count":0,"total":5}},{"id":"f6fb155a-2963-488d-b872-896f4ffe0845","title":"死亡回响","cover":"uploads/1794224069358-cfbc0c92.jpg","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":3,"female":3,"duration":10,"difficulty":"进阶","price":78,"memberPrice":0,"author":"","publisher":"","intro":"大山的深处，有一座名为怨鬼村的隐世山村。\n传说村子里有着被神明封印的妖邪——怨鬼。\n怨鬼的存在，会让亡者的灵魂无法安息，成为徘徊在世间的 怨灵，破坏生与死的平衡。\n在神明的庇佑下，人们将怨鬼封印，获得了安宁的生活。\n然而，村中唯一的阴阳师山背家族的灭亡，让封印出现了问 题，导致原本用于看管封印的神社，成为了怨灵徘徊的鬼 蜮。\n为了安抚神社中的怨灵，村民们开始了每年一次的赎罪仪 式。\n在赎罪的仪式上，此前死亡的某位亡者之魂将被唤回。\n在死者那残存于世间的回响中，真相将被揭开，凶手将在死 亡符咒所引导的神罚中被处决。","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794224069360,"updatedAt":1794224390337,"reviews":[{"id":"73f15133-9730-4ba7-a7e3-2882ecb46704","scriptId":"f6fb155a-2963-488d-b872-896f4ffe0845","name":"网络玩家3","rating":0,"content":"当然一个好的dm是这个本成功最关键的地方，重楼的xxl开的很顺，板书也 写得很清楚，打下来完全没有什么杠点地方，重楼关于这个本的恐搜演绎也 做的超级好。","source":"network","createdAt":1794224009362},{"id":"4bf512d0-dd7c-49ad-b0d6-35aa66e82352","scriptId":"f6fb155a-2963-488d-b872-896f4ffe0845","name":"网络玩家2","rating":0,"content":"但是这部确实惊艳，首先没有任何后置设定，所以和我一样有这个雷点的玩 家也可以放心体验。虽然说前期有一些反转是完全可以猜到的，但是并不影 响推理过程。案件本身不难，推理的话主要是长逻辑链的整理，所以比较喜 欢挂机或者说不喜欢理解设定的玩家，估计玩起来就会觉得很难或者很久。 因为我们都是比较喜欢长逻辑链也一直打了很多长逻辑链本的车友，所以我 个人体感还好，没有什么很多很难，很卡的地方。不过破壁做的还不错，虽 然有点抄芥子，但没关系，抄到的是好东西就是好的，总比有的本自己写点 垃圾东西要好很多。总的来说，在时间线上，死亡回响是这个系列的第一部 时间，也是我觉得这个系列的第一名，不得不说，罗莱特在这个本上，让我 觉得他进步太多了。","source":"network","createdAt":1794223949362},{"id":"afcd84e7-9e1d-4b28-908e-b6ffd1a90e75","scriptId":"f6fb155a-2963-488d-b872-896f4ffe0845","name":"网络玩家1","rating":0,"content":"其实本身来说不是很喜欢罗莱特因为比较讨厌他一贯的后置设定和为了反转 而反转，所以一开始没报很大希望。","source":"network","createdAt":1794223889362}],"rating":{"avg":0,"count":0,"total":3}},{"id":"49f00b1c-8910-41ba-a6fd-f43b0e2efd3b","title":"众念成形","cover":"uploads/1794299695534-2fb59c7e.jpg","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":4,"female":2,"duration":6,"difficulty":"新手","price":68,"memberPrice":0,"author":"","publisher":"","intro":"《众念成形》以偏远怀村为舞台，围绕山魈、水鬼等民俗怪谈展开，六名回乡者（孙丽/王阳等）需揭开一连串离奇命案背后的真相。随着调查深入，他们发现所有怪谈皆源于村民的“念”——一种由执念化形的存在。玩家需通过人均万余字的文本和细节，还原多起案件与人物关系，在数次反转中直面“相信即存在”的残酷逻辑，最终破解横跨三十年的集体谎言。核心任务：运用设定还原长逻辑链，从怪谈表象下拼凑出人性的贪嗔痴。","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794224059449,"updatedAt":1794299707093,"reviews":[{"id":"45c5bd85-ea27-41c2-afe5-f1083623d945","scriptId":"49f00b1c-8910-41ba-a6fd-f43b0e2efd3b","name":"网络玩家3","rating":0,"content":"整体来说是个低开高走的本，案件部分可以快过，还原部分值得细品。没有强行反转，所有伏笔都在文本里，喜欢故事还原的可以冲。dm带得顺，7小时不知不觉就过去了。","source":"network","createdAt":1794223999453},{"id":"08a3c781-df0c-48ee-b44b-255dc3ff38c1","scriptId":"49f00b1c-8910-41ba-a6fd-f43b0e2efd3b","name":"网络玩家2","rating":0,"content":"后半程长逻辑链一环扣一环，我们车从嘻嘻哈哈变成眉头紧锁，每推翻一次就惊呼一声。特别是最后那些悖论，看着离谱但细想全在设定里，闭环那刻鸡皮疙瘩起来了。同车小月直接看结局本看哭，我虽然没哭但也被刀得不轻。","source":"network","createdAt":1794223939453},{"id":"4ac2f5d9-937d-4670-ad18-96bddfea3b92","scriptId":"49f00b1c-8910-41ba-a6fd-f43b0e2efd3b","name":"网络玩家1","rating":0,"content":"开本前以为就是个普通中式恐怖，结果越盘越上头。前期几个案子确实有点干，尤其是电梯案绕得我脑壳疼，但熬到“念”的设定出来之后直接起飞。作为李让，本以为就是个回乡医生，没想到自己爹的故事比怪谈还怪谈，盘到后面整个人麻了。","source":"network","createdAt":1794223879453}],"rating":{"avg":0,"count":0,"total":3}},{"id":"6b58b917-f641-4cc3-a880-0697154af533","title":"不良少女与独眼Kitty猫","cover":"uploads/1794224056695-d158b034.jpg","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":0,"female":0,"duration":7,"difficulty":"进阶","price":68,"memberPrice":0,"author":"","publisher":"","intro":"“今天来这，没有别的目的，就是弄死在座的诸位，也弄死自己。”凶手如此说道，脸上挂着一抹自信的微笑。\n听闻此言，侦探们像筛子一样发起抖来。\n“可是，为什么要杀死我们呢?“其中一人像是才反应过来，突然问了句。\n凶手挠了挠头，一脸为难的样子，因为关于这点，作者好像并没有写。\n“没有原因，哈哈哈!“凶手说道，“可怕吧，我杀人不需要原因!”\n但他还没动手，就先被杀了。因为这里的侦探，都是比他还要恐怖百倍的杀人魔。确实，如果连人都不会杀，又该怎么去破解杀人现场的谜题呢?","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794224056697,"updatedAt":1794224297394,"reviews":[{"id":"ab20b3f6-8d14-4036-a57f-9635b988db6d","scriptId":"6b58b917-f641-4cc3-a880-0697154af533","name":"网络玩家2","rating":0,"content":"总之，《不良少女与独眼Kitty猫》以其精彩的剧情、独特的角色、巧妙的线索设置以及出色的氛围营造，成为了一款备受玩家喜爱的剧本杀。无论是对于剧本杀新手还是资深玩家来说，它都有着足够的吸引力和挑战性，值得大家去深入体验和探索。在这个充满悬念与惊喜的游戏世界里，每一次的推理与互动都是一次难忘的旅程，而《不良少女与独眼Kitty猫》无疑为玩家们打开了一扇通往神秘悬疑世界的大门，让大家在其中尽情地享受剧本杀的独特魅力。","source":"network","createdAt":1794223996698},{"id":"ad1e56cd-d33d-4487-b9b1-b32b6fb688c6","scriptId":"6b58b917-f641-4cc3-a880-0697154af533","name":"网络玩家1","rating":0,"content":"从玩家感受而言，参与《不良少女与独眼Kitty猫》的过程就像是一场惊心动魄的冒险。在游戏中，玩家们需要全身心地投入到角色之中，与其他玩家进行激烈的互动和思维碰撞。当成功推理出凶手时，那种成就感和满足感是难以言表的；而即使最终未能找出真相，在游戏过程中所体验到的紧张刺激和对剧情的深入探索，也足以让人回味无穷。同时，游戏中的氛围营造也相当出色，无论是场景的布置还是背景音乐的选择，都能恰到好处地烘托出剧情的氛围，让玩家仿佛置身于一个真实的悬疑世界之中。","source":"network","createdAt":1794223936698}],"rating":{"avg":0,"count":0,"total":2}},{"id":"7b635d7c-7f55-4cd4-a825-441cf33cfd55","title":"观身不净","cover":"uploads/1794222306400-53b25583.jpg","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":4,"female":2,"duration":7.5,"difficulty":"进阶","price":68,"memberPrice":0,"author":"","publisher":"","intro":"","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794222306401,"updatedAt":1794222339845,"reviews":[{"id":"cd9c81b9-a8eb-4ac1-9342-c93685792778","scriptId":"7b635d7c-7f55-4cd4-a825-441cf33cfd55","name":"网络玩家3","rating":0,"content":"整体来说是个下班解压神本，时长友好，不坐牢，但一定要找熟人开，心测必须做。道德感高的朋友建议绕道，这车全员恶人不是吹的，放下素质才能玩得尽兴。喜欢啃长逻辑的可能会觉得软逻辑偏多，但胜在欢乐氛围浓，适合想放肆笑一场的局。","source":"network","createdAt":1794222246403},{"id":"ff0fe8fd-0d18-41ca-8513-492cb42a403d","scriptId":"7b635d7c-7f55-4cd4-a825-441cf33cfd55","name":"网络玩家2","rating":0,"content":"选的宫廷副本，辛甘这角色脸皮必须得厚，什么妃子play全往上凑，笑得我腹肌疼。流程设计确实有一手，一幕一本不拖沓，副本二选一的机制让不同车体验完全不一样，我们车抽象到直接幻视甄嬛传，车友们嗓子都喊哑了。文本不算厚重，但细节复用率挺高，没那种硬塞的后置线索，喜欢互动多的玩家会爽到。","source":"network","createdAt":1794222186403},{"id":"8dfa42c0-fb4d-4b47-b805-c4abf3f3c73e","scriptId":"7b635d7c-7f55-4cd4-a825-441cf33cfd55","name":"网络玩家1","rating":0,"content":"开场就被按在霸凌位，曲晴愿和我像两根苦瓜绑一块儿，谁都能来踩一脚。本里那些校园霸凌和原生家庭的描写，皮下要是经历过估计得当场裂开，我硬扛着没碎，但确实闷得慌。好在无限流这个壳子救了大命，刚被上一幕搞得心里发毛，下一幕直接切副本，瞬间抽离出来，根本没空持续emo。","source":"network","createdAt":1794222126403}],"rating":{"avg":0,"count":0,"total":3}},{"id":"3b7cab13-28d3-4986-89c6-9a9b34b6f8eb","title":"如是我观","cover":"uploads/1794222305343-bb785f3a.png","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":0,"female":0,"duration":7,"difficulty":"进阶","price":68,"memberPrice":0,"author":"","publisher":"","intro":"在无名中起势又覆灭于无名的隐秘\n在生死间窥探又被生死愚弄的悲欢\n那绝地逢生又隐于众人眼前的祸世之子\n那绝非自杀又找不到他杀可能的世弃之人\n我见过喜丧之际的玄妙\n却又被这阴阳、生死迷了双眼\n“哒、哒、哒”\n不知名姓的瞎眼老丈拄着竹杖踱步而至\n几页油纸诡异的从其背后探出了身子","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794222305344,"updatedAt":1794222349588,"reviews":[{"id":"1b98f27a-c64d-448b-bbe9-834a6f4f96f4","scriptId":"3b7cab13-28d3-4986-89c6-9a9b34b6f8eb","name":"网络玩家6","rating":0,"content":"剧本巧妙地结合了推理和恐怖元素，让玩家在游戏中不断面对内心的恐惧和黑暗，尤其是“追逐大逃杀”环节，提供了极具沉浸感的恐怖体验。","source":"network","createdAt":1794222245345},{"id":"7fcf1277-e78d-475e-92d6-0f5c95ef9a7a","scriptId":"3b7cab13-28d3-4986-89c6-9a9b34b6f8eb","name":"网络玩家5","rating":0,"content":"游戏过程中，玩家将面对多次单人任务和恐怖搜索，体验到紧张和恐怖的氛围。","source":"network","createdAt":1794222185345},{"id":"a2e52f31-a0c6-4c04-960f-3d3de905daa4","scriptId":"3b7cab13-28d3-4986-89c6-9a9b34b6f8eb","name":"网络玩家4","rating":0,"content":"同时，剧本中还包含了一桩看似既非自杀也非他杀的离奇死亡案件，玩家将在游戏中体验到喜丧交织的复杂情感，并被阴阳、生死的谜团所困扰。","source":"network","createdAt":1794222125345},{"id":"7bfa5f27-6172-4ad3-a569-80972fe05bd1","scriptId":"3b7cab13-28d3-4986-89c6-9a9b34b6f8eb","name":"网络玩家3","rating":0,"content":"故事背景设定在民国时期，以一位在生死边缘挣扎的祸世之子的传奇经历为主线，讲述了他如何在绝境中逢生，却又选择隐姓埋名的生活。","source":"network","createdAt":1794222065345},{"id":"248e340d-d0f7-4c74-8c7f-23f38593cc55","scriptId":"3b7cab13-28d3-4986-89c6-9a9b34b6f8eb","name":"网络玩家2","rating":0,"content":"剧本融合了悬疑、硬核推理以及豪门还原等多种风格，带领玩家深入探索那些在无名中崛起又在无声中消逝的秘密往事。","source":"network","createdAt":1794222005345},{"id":"6b8b1690-6314-4de5-8374-add328daaf83","scriptId":"3b7cab13-28d3-4986-89c6-9a9b34b6f8eb","name":"网络玩家1","rating":0,"content":"《如是我观》是一款针对18岁以上玩家设计的国风城限剧本杀游戏，适合4男2女共6人参与，游戏时长大约为8小时，也允许角色反串。","source":"network","createdAt":1794221945345}],"rating":{"avg":0,"count":0,"total":6}},{"id":"74d6ef6e-90f9-468e-9698-7f1a1e9b89ca","title":"谎谎而终","cover":"uploads/1794222304200-25c22240.jpg","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":0,"female":0,"duration":6,"difficulty":"进阶","price":68,"memberPrice":0,"author":"","publisher":"","intro":"六位阴阳师踏入了这个神秘的村落，在这里的村民一生只能说一次谎言，如果不小心触犯了这条规则说了两次谎言的话，就会变成烟花爆炸。\n这个村如今落荒无人烟，据说当年发生了一起事件名为“烟花雨案”，所有村民都四于一日之间。\n在这里他们遇到了六起棘手的命案一\n“无法蓄水的水密室”\n“诡异的瞬间分尸密室’\n“相守之地的诡谲命案\n“四方阁的命案”\n“无法突破的火密室”\n“完全悖论的双重密室”\n本以为破解完命案后就已经结束，没想到仅仅只是开始。\n一场针对六位阴阳师展开的杀戮，才刚刚开始。","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794222304201,"updatedAt":1794222366213,"reviews":[{"id":"2277e406-fc32-486c-9721-6eabbca64b26","scriptId":"74d6ef6e-90f9-468e-9698-7f1a1e9b89ca","name":"网络玩家3","rating":0,"content":"《谎谎而终》剧本杀测评我觉得这是我最近打过最舒适的案子了，前期的五个案子的文本量极小，而且全是以本格解收尾的密室。前期没有用到设定的任何缝隙，所以玩家可以直接进行推理。文本量极小意味着每句话都很重要，以及案件的难度不会很大。但是每个案件的解法都很巧妙，我在打的途中甚至一度回光返照，以为自己在打“雾鸦馆”。真的是太有早期剧本杀推理密室那味道了。我打完后评价五个密室没有一个密室拉垮，都是很有意思的突破口。而且案子并不只是很多剧本用一次后面就不再管它了，所有案子的细节在后面还有有大用处，即使是你从来没有觉得它重要的地方。","source":"network","createdAt":1794222244202},{"id":"09bc10c3-a75d-4eba-bcdf-9ead1f611e52","scriptId":"74d6ef6e-90f9-468e-9698-7f1a1e9b89ca","name":"网络玩家2","rating":0,"content":"《谎谎而终》剧本杀测评因为这几个密室是玩起来有种不吃浪费又不好吃的个人主观体验（也肯定会有玩家喜欢，只是我个人不吃…盘起来读了很多解答起来没有太有趣&车友灵光一闪就结束了)接下来就是对这个本的喜爱啦！破冰游戏真的非常扣题和体验起来是有趣的，能带动气氛也能让大家去有兴趣继续玩下去！","source":"network","createdAt":1794222184202},{"id":"485a68fd-77ff-4d01-961e-784a2d8198e9","scriptId":"74d6ef6e-90f9-468e-9698-7f1a1e9b89ca","name":"网络玩家1","rating":0,"content":"《谎谎而终》剧本杀测评再再再感谢dm小甜心，带的太好玩咯谎谎打完体验下来第一感觉，不愧是玄机监制的本子，个人风格体验在这里面是非常明显的，不经意之间就留下诡计，喜欢这种诡计流细节控的玩家会很喜欢~","source":"network","createdAt":1794222124202}],"rating":{"avg":0,"count":0,"total":3}},{"id":"2bee1c6c-d70f-4310-8929-c578661ce0bc","title":"北宋奇案汴京","cover":"uploads/1794222303091-41e13334.jpg","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":0,"female":0,"duration":7.5,"difficulty":"进阶","price":68,"memberPrice":0,"author":"","publisher":"","intro":"一段北宋时期耻辱的历史，\n两个南宋同朝为官的叔侄，\n三位曾经纠葛种种的帝王，\n竟与那四起未曾结案的密室斩首案，深深牵扯。\n而那尘封于汴京城下的秘密，亦随着它的陨落，\n或被深埋，或欲出土。","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794222303092,"updatedAt":1794222379420,"reviews":[{"id":"820fc820-03d3-4ada-b98d-2c2ad2cde511","scriptId":"2bee1c6c-d70f-4310-8929-c578661ce0bc","name":"网络玩家6","rating":0,"content":"四起案件的共同点都是死亡现场不仅是密室，死者还都被斩首。侧重点却各不相同。动线密室，监视密室，逻辑密室，诡计已经完成，只等我们抽丝剥茧。","source":"network","createdAt":1794222243093},{"id":"dd5500cb-34e8-4b14-bec4-d2eb7b4a75d9","scriptId":"2bee1c6c-d70f-4310-8929-c578661ce0bc","name":"网络玩家5","rating":0,"content":"没有丝毫喘息空间，匠铺案，天牢案，地牢案，童府案，四个口味各异却同样精彩的密室接踵而来，天知道我看线索册看得有多认真。","source":"network","createdAt":1794222183093},{"id":"68076a15-47d1-4a12-8c7c-531c1207c8b9","scriptId":"2bee1c6c-d70f-4310-8929-c578661ce0bc","name":"网络玩家4","rating":0,"content":"当我拿到剧本时，熟悉的感觉再次袭来，那是对本格密室的渴望。熟悉角色故事，简单分享，以一个监视密室作为开胃菜，迈出了今天烧脑的第一步。","source":"network","createdAt":1794222123093},{"id":"81384dde-9dda-491c-a500-511b23b7b7af","scriptId":"2bee1c6c-d70f-4310-8929-c578661ce0bc","name":"网络玩家3","rating":0,"content":"在还原本大行其道的市场下，依旧有人坚持以出众的诡计和最本格的基础来创作剧本，光是这一点就让我肃然起敬。","source":"network","createdAt":1794222063093},{"id":"51c99c41-a8fd-413f-a9ac-29fd4901daf3","scriptId":"2bee1c6c-d70f-4310-8929-c578661ce0bc","name":"网络玩家2","rating":0,"content":"打这个本之前和望哥还有店家朋友都聊过很多次，所以大家期待值拉得非常高，经过9小时的脑力战，只能说一—不负期待！","source":"network","createdAt":1794222003093},{"id":"0737b46a-25be-43a7-aef0-cfa43fd9b321","scriptId":"2bee1c6c-d70f-4310-8929-c578661ce0bc","name":"网络玩家1","rating":0,"content":"作为《浮世奇案簿·长安》和《天衣无缝》系列作的第三部作品《北宋奇案·汴京》，在我们的无限盼望下，终于由作者望哥完美地呈现在我们面前！","source":"network","createdAt":1794221943093}],"rating":{"avg":0,"count":0,"total":6}},{"id":"c8a8e786-8059-4eef-9bda-d20a86b6348d","title":"怪谈事务所诡楼","cover":"uploads/1794222301900-78a5aeed.jpg","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":0,"female":0,"duration":9,"difficulty":"进阶","price":78,"memberPrice":0,"author":"","publisher":"","intro":"繁忙的事务所日本区，接到了一个来自平元的电话。\n万万没想到，不可一世的东和电器财团，竟然会主动寻求事务所的帮助。\n平元口中呢喃着一个已经被封印的楼盘：晴香公寓。\n这个名字的由来也是绝高的机密，但是平元诚恳的态度，加上松本总警视厅长的推荐信，让主管云落，不得不百忙之中调派人手，前去探查。\n有自告奋勇的小区保安，神乐町的芳芳小姐和赌圣柳志，以及川子降服后专门留下的雇员裂口女，为了以防万一，云落派遣自己的甲级式神之一，骷髅锁月，一同前往。\n但是这件事的背后，远没有云落想的那么简单，因为编外顾问，读心者音无，也悄然的一同前往。\n欢迎入住晴香公寓，祝你一路平安，好去好回。","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794222301900,"updatedAt":1794222396819,"reviews":[{"id":"91b4630a-8abe-48af-b917-41c4c7f66c10","scriptId":"c8a8e786-8059-4eef-9bda-d20a86b6348d","name":"网络玩家6","rating":0,"content":"前期避免了屯卡的情况，规则很符合大众接受，机制环节受众群体真的太大了，无论是什么级别的机制本玩家都有很好的体验，新手玩家简单上手。","source":"network","createdAt":1794222241902},{"id":"ea19c920-7cef-4455-9904-1be1cd47b287","scriptId":"c8a8e786-8059-4eef-9bda-d20a86b6348d","name":"网络玩家5","rating":0,"content":"而且没有角色的技能差距很大的情况，极大的增加了全车人的体验，技能的分配选择永远在自己决策，每个人都有自己所属的角色，不会有细碎的随从聚堆，","source":"network","createdAt":1794222181902},{"id":"08f6d3a8-0f77-4252-bbd4-2615fcf1979e","scriptId":"c8a8e786-8059-4eef-9bda-d20a86b6348d","name":"网络玩家4","rating":0,"content":"让全车的人都不会掉线，而且爽点全程都在，中间窜插故事问题选择，不会让故事脱离游戏，窜插信任游戏，让你感受世界的阴暗，团队，背刺该选择什么永远不知道。","source":"network","createdAt":1794222121902},{"id":"46093f4a-d8a4-483d-9f15-1e3adef5ce44","scriptId":"c8a8e786-8059-4eef-9bda-d20a86b6348d","name":"网络玩家3","rating":0,"content":"延续了破界的卡牌机制与打斗规则，但是还是对部分机制和规则进行了强有力的更新，不仅有破界的优秀卡组，还有在新故事的强力随从。","source":"network","createdAt":1794222061902},{"id":"1daaa883-141e-47ac-8b50-81344c836ba7","scriptId":"c8a8e786-8059-4eef-9bda-d20a86b6348d","name":"网络玩家2","rating":0,"content":"2、关于机制重中之重！！！","source":"network","createdAt":1794222001902},{"id":"6f0254a7-50b3-4465-b248-d960e7c356a7","scriptId":"c8a8e786-8059-4eef-9bda-d20a86b6348d","name":"网络玩家1","rating":0,"content":"作为破界的续作，不仅局限于破界的观念，还原性穿插机制和跑团，环环相扣，避免了出现机制大于故事而忽略故事的情况出现，整体故事和阵营完全处于平衡状态。","source":"network","createdAt":1794221941902}],"rating":{"avg":0,"count":0,"total":6}},{"id":"bab70b35-bc66-4d54-8738-abd894e3c536","title":"出逃连体村","cover":"uploads/1794222300592-8f7f5a14.jpg","genre":[],"type":"盒装","playersMin":5,"playersMax":5,"male":1,"female":4,"duration":4.5,"difficulty":"新手","price":58,"memberPrice":0,"author":"","publisher":"","intro":"《出逃连体村》以与世隔绝的林槑村为舞台，近半村民生来连体，两名外乡人误入禁地，失踪五年的归乡者重返故土。解惑会当夜，通晓前尘的半仙遭人斩首，神谕逐一应验，血案背后藏着更大的死局。玩家扮演五名村内角色，通过文本细节和搜证环节，破解连体村的秘密与连环命案。核心任务为：运用本格推理还原半仙案、刘莹案、王芜莲案三起事件，经历多重伪解答与真解的反转，从线索中拼凑连体人的宿命与真相，最终在颠覆性结局中直面人性的挣扎。","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794222300593,"updatedAt":1794222412565,"reviews":[{"id":"fd25189b-76fb-4c91-86c0-b970cd914b61","scriptId":"bab70b35-bc66-4d54-8738-abd894e3c536","name":"网络玩家3","rating":0,"content":"整体来说体量不大但内容扎实，诡计丝滑，反转合理，没有边缘位，每个人都有自己的高光时刻。喜欢民间怪谈和猎奇设定的玩家可以冲，新手友好，短小精致不拖沓。","source":"network","createdAt":1794222240614},{"id":"68d89db1-927a-4eba-8a6c-bb28bbbe1ad6","scriptId":"bab70b35-bc66-4d54-8738-abd894e3c536","name":"网络玩家2","rating":0,"content":"案件有三起，第一遍过的时候比较简单，后面多重解答的论破环节挺有意思，像弹丸论破那样一重一重推翻伪解答。核诡部分不算很难想，但细节埋得很深，找到那个点的瞬间真的会起鸡皮疙瘩。还有个小搜证环节，不恐怖，氛围感拉满。","source":"network","createdAt":1794222180614},{"id":"737aa44f-6223-464a-be90-7806ba7743cd","scriptId":"bab70b35-bc66-4d54-8738-abd894e3c536","name":"网络玩家1","rating":0,"content":"拿到外乡人这个角色还挺忐忑的，怕没有村内视角会坐牢，结果戏份一点不少，前面的小破冰环节直接笑出声。阅读量适中，不用啃大段废话，全程跟着故事走，时不时蹦出来的梗让一桌子人其乐融融，下班打这个本真的太友好了。","source":"network","createdAt":1794222120614}],"rating":{"avg":0,"count":0,"total":3}},{"id":"c8b7626e-e094-44e1-bce3-619bd7dee103","title":"无限调查局","cover":"uploads/1794219360976-2e336741.png","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":0,"female":0,"duration":7.5,"difficulty":"进阶","price":68,"memberPrice":0,"author":"","publisher":"","intro":"新丰科技研发的新款推理解谜VR游戏《无限调查局》，正式开启内测，现面向全社会开放内测报名。在内测中通过层层副本考验，成为最终胜者的玩家将获得巨额奖金\n你们是在千万报名者中被抽中的幸运儿，将于今天开始你们的推理之旅","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794219360979,"updatedAt":1794219377355,"reviews":[{"id":"695aaf0a-4459-4ac3-af42-2968e932586f","scriptId":"c8b7626e-e094-44e1-bce3-619bd7dee103","name":"网络玩家6","rating":0,"content":"然后前面几个案件，盘时间线，设定了明凶~","source":"network","createdAt":1794219300985},{"id":"14edc4ed-c4d5-4bd6-b299-405a406491ff","scriptId":"c8b7626e-e094-44e1-bce3-619bd7dee103","name":"网络玩家5","rating":0,"content":"吃透了的话也就是拿个闹钟记个时儿～带起来不费劲~","source":"network","createdAt":1794219240985},{"id":"a85ce635-2aea-4cda-b849-6ab9a2299baf","scriptId":"c8b7626e-e094-44e1-bce3-619bd7dee103","name":"网络玩家4","rating":0,"content":"开场的几个破冰案件只要dm抓时间，打节奏~其实也就只考验一个吃透的问题~","source":"network","createdAt":1794219180985},{"id":"bd094c17-a74b-456c-8a70-4c5abb382e7d","scriptId":"c8b7626e-e094-44e1-bce3-619bd7dee103","name":"网络玩家3","rating":0,"content":"在质量上绝对是属于拔尖的作品～","source":"network","createdAt":1794219120985},{"id":"0be244ce-d9b2-4de4-a9f0-fde6012a9464","scriptId":"c8b7626e-e094-44e1-bce3-619bd7dee103","name":"网络玩家2","rating":0,"content":"这是一家用心在做剧本的发行，所以真的在分数上他们没有很在意~","source":"network","createdAt":1794219060985},{"id":"c5e299b1-54fb-4650-b233-9ce91770f1a3","scriptId":"c8b7626e-e094-44e1-bce3-619bd7dee103","name":"网络玩家1","rating":0,"content":"这是一个设定系无限流的硬核本，可以理解成新本格吧，你想要的东西它都有～次元壁，小叙诡，精湛的核诡，密室，还原，故事分享，竞速～","source":"network","createdAt":1794219000985}],"rating":{"avg":0,"count":0,"total":6}},{"id":"51d527a7-ee22-4dcd-b066-e490ab9025f0","title":"奇妙万事屋","cover":"uploads/1794219292075-e3be8bfe.png","genre":[],"type":"城限","playersMin":7,"playersMax":7,"male":0,"female":0,"duration":7,"difficulty":"进阶","price":58,"memberPrice":0,"author":"","publisher":"","intro":"“青蛙男”怪谈，麻藤火灾，彩灯彻夜不熄的奇妙万事屋，横空出世的面具少女歌手………\n来自鸟取县的8名“少年侦探”从小就被谜团围绕，而他们的青春，于当年盛夏一场演唱会的大火戛然而止。\n时隔多年，奇妙万事屋重新开张。\n“欢迎来到奇妙万事屋，这里有你想知道的一切答案。”","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794219292075,"updatedAt":1794219292075,"reviews":[{"id":"2f966274-6c3c-4f49-bccb-fd0c23762beb","scriptId":"51d527a7-ee22-4dcd-b066-e490ab9025f0","name":"网络玩家2","rating":0,"content":"凶案和还原各个都可圈可点，手法超级硬核，和之后的故事还原也有呼应，最后更是有小彩蛋让人大吃一惊！","source":"network","createdAt":1794219232078},{"id":"f43ee959-a659-40d5-a24c-5d65be4ce137","scriptId":"51d527a7-ee22-4dcd-b066-e490ab9025f0","name":"网络玩家1","rating":0,"content":"一开始的破冰就把人吸引住了，题材及其有意思，6个小时左右的酣畅淋漓绝对没有掉线的困扰，盘的时候一点都不干涩哦，还非常的丝滑~","source":"network","createdAt":1794219172078}],"rating":{"avg":0,"count":0,"total":2}},{"id":"0bb2e9f0-bc56-4534-89c4-f1b3e360d2d9","title":"幻想诸因","cover":"uploads/1794219252439-b5ab3bf9.jpg","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":3,"female":3,"duration":8,"difficulty":"进阶","price":68,"memberPrice":0,"author":"","publisher":"","intro":"《幻想诸因》以“曼彻斯特俱乐部”的侦探生死挑战为舞台，六名失去记忆的玩家被困异国建筑，在笑声与悬念交织的氛围中，必须破解风格迥异的连环谜案——从涂鸦画作中的骇人秘密，到emoji暗藏的逻辑迷阵，再到颠覆想象的“狼人杀”式对决。核心任务为：在7小时左右的协作中，通过四大趣味案件收集伏线，抽丝剥茧还原跨越数代的扭曲羁绊，并区分真实与“幻想”的边界，最终揪出潜伏在众人之间的幕后主谋，直面地狱级反转背后的人性寓言。","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794219252442,"updatedAt":1794219252442,"reviews":[{"id":"be7d07b4-4ef3-448f-8c33-d5978ee4c0e0","scriptId":"0bb2e9f0-bc56-4534-89c4-f1b3e360d2d9","name":"网络玩家3","rating":0,"content":"阅读量不大但信息密度超高，没有堆设定和做题感，每个环节都在玩新花样。难度进阶但过程丝滑，推理还原五五开，喜欢欢乐+变态+逻辑闭环的可以直接冲。火舞猫老师确实有点东西，这应该是今年让我玩得最爽的进阶本。","source":"network","createdAt":1794219192447},{"id":"65a45568-076f-432a-8b79-6bb72c3e1932","scriptId":"0bb2e9f0-bc56-4534-89c4-f1b3e360d2d9","name":"网络玩家2","rating":0,"content":"本以为案件结束就轻松了，结果还原阶段吃瓜吃到自己角色身上……那些欢乐的幻觉搜证，最后全变成扎心的刀。反转那刻整车安静了十秒，然后集体爆发出“卧槽”。7个半小时咻一下就没了，我嗓子都喊哑了。","source":"network","createdAt":1794219132447},{"id":"f128ab93-e722-4d6b-aba7-b4f89c93d1e1","scriptId":"0bb2e9f0-bc56-4534-89c4-f1b3e360d2d9","name":"网络玩家1","rating":0,"content":"开本前以为是普通侦探游戏，结果第一案涂鸦推理直接把我CPU干烧了——三张小孩画里藏凶案，这种玩法真没见过！emoji推理那趴我们整车笑到拍桌，对着🐸🐝🐍解码解出杀人路线，dm说对的时候全车起立鼓掌。狼人杀环节更是绝了，盘着盘着突然反转，我直接从椅子上弹起来：“还能这样？！”","source":"network","createdAt":1794219072447}],"rating":{"avg":0,"count":0,"total":3}},{"id":"76d6cb4e-cab3-45b2-ae26-8d944f396e0d","title":"幻方馆谋杀奇境","cover":"uploads/1794219216328-f2538928.jpg","genre":[],"type":"盒装","playersMin":6,"playersMax":6,"male":0,"female":0,"duration":5.5,"difficulty":"进阶","price":58,"memberPrice":0,"author":"","publisher":"","intro":"👨红谷拓也\n👨武藤孝太\n👨竹间英助\n👩红谷雅美\n👩武藤枫\n👩竹间明日香","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794219216329,"updatedAt":1794219216329,"reviews":[{"id":"53836433-024b-466d-8924-b2729161ab9c","scriptId":"76d6cb4e-cab3-45b2-ae26-8d944f396e0d","name":"网络玩家3","rating":0,"content":"🎉推荐程度：\n整体游戏时长约5.5-6.5小时，适合硬核玩家。对于DM来说，需要深入理解所有设定和案件，以确保玩家能够更顺畅地推理。此剧本预计将在7月中下旬发货，预计开分会有8.5以上，绝对值得期待！","source":"network","createdAt":1794219156330},{"id":"55abf79c-bc2d-49ba-bf0a-2d688e28a396","scriptId":"76d6cb4e-cab3-45b2-ae26-8d944f396e0d","name":"网络玩家2","rating":0,"content":"📖阅读体验：\n虽然阅读量不大，但案件的设定和推理过程相当烧脑。每个案件都有独特的背景设定，且剧情紧凑，保证玩家全程投入。","source":"network","createdAt":1794219096330},{"id":"ca28618c-9f64-4754-acc8-427b7815c40d","scriptId":"76d6cb4e-cab3-45b2-ae26-8d944f396e0d","name":"网络玩家1","rating":0,"content":"🔐推理难度：\n此剧本推理难度极高，达到9.5分。案件设置巧妙，动线密室和强设定让玩家欲罢不能。首个案件就耗时两小时，且存在唯一解，考验玩家的逻辑思维。","source":"network","createdAt":1794219036330}],"rating":{"avg":0,"count":0,"total":3}},{"id":"22991d9c-577d-482a-beaf-95f907fa30a6","title":"立方馆谋杀始末","cover":"uploads/1794219191128-926bd9a6.png","genre":[],"type":"盒装","playersMin":6,"playersMax":6,"male":0,"female":0,"duration":5.5,"difficulty":"进阶","price":58,"memberPrice":0,"author":"","publisher":"","intro":"近日，警方在位于无人区的著名建筑「立方馆」中发现六具尸体，据调查均为前段时间一同前往立方馆的三男三女，全部遇难，无人生还。\n与此同时，天国之上，一位喜欢看推理小说的大天使，将这场无人生还的惨案，做成了推理游戏，祂呈现了六名死者的当时回忆，作为一次天国的考核。六名小天使们接到考核，要通过回忆帮助人类寻找难以找到的真相，而在推理的过程中，小天使们发现除了接二连三的杀人事件之外，在这些文字内容之中，竟藏有大天使绞尽脑汁设置的谜题.","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794219191129,"updatedAt":1794219191129,"reviews":[{"id":"da782cf7-dcea-4b69-9c48-1c490578cb18","scriptId":"22991d9c-577d-482a-beaf-95f907fa30a6","name":"网络玩家4","rating":0,"content":"在这神秘建筑中，一切都变幻莫测，推理需要遵循强设定，挑战玩家的空间想象力。","source":"network","createdAt":1794219131129},{"id":"751099a0-8edc-4e00-a54f-bb69906ba430","scriptId":"22991d9c-577d-482a-beaf-95f907fa30a6","name":"网络玩家3","rating":0,"content":"故事以在无人区的“立方馆”中发现六具尸体为引子，参与者需要从死者回忆中找寻线索，破解一个个谜题。","source":"network","createdAt":1794219071129},{"id":"bd00f759-7655-4431-92a8-c0d02a25b20c","scriptId":"22991d9c-577d-482a-beaf-95f907fa30a6","name":"网络玩家2","rating":0,"content":"适合6人参与，时长为6-8小时。这场剧本杀将玩家带入立方馆，展开一场令人惊叹的多重解谜之旅。","source":"network","createdAt":1794219011129},{"id":"40c096c5-9a3e-4117-91c7-b075ac5f3046","scriptId":"22991d9c-577d-482a-beaf-95f907fa30a6","name":"网络玩家1","rating":0,"content":"由隐匿角色发行的《立方馆谋杀始末》剧本杀，以日式硬核、双核诡、多重解答、情感、新本格为主题。","source":"network","createdAt":1794218951129}],"rating":{"avg":0,"count":0,"total":4}},{"id":"759deea0-c0b8-467c-9941-b7214fcb4390","title":"红黑馆事件","cover":"uploads/1794219171788-28ad3319.jpg","genre":["剧本简介","三个密室","九个手法"],"type":"盒装","playersMin":6,"playersMax":6,"male":3,"female":3,"duration":6.5,"difficulty":"硬核","price":58,"memberPrice":0,"author":"","publisher":"","intro":"菠萝头的盛宴，推理玩家的狂欢，三个密室，九个手法，四重解答。\n2001年11月，警方接到望渔村的一名女性报警，到达现场时发现红黑馆已被大火烧毁，只剩下了一片废墟，废墟中有3具焦尸。随后，警方在红黑馆外的悬崖下挖出另外5具尸体，死因都是坠崖而亡。不久后报案人病逝，这起案件几经调查也没有结果，便成了悬案，被知情人称作“红黑馆事件”。\n2021年，渔民在海里发现6个系在一起的漂流瓶，里面竟是当年红黑馆最后活着的6人写下的手记，20年前那埋藏已久的真相即将被揭开……","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794219171790,"updatedAt":1794219171790,"reviews":[],"rating":{"avg":0,"count":0,"total":0}},{"id":"9c192483-9f0e-4f0d-bf2b-c914889caeab","title":"壬辰倭乱","cover":"uploads/1794219058595-03524ab6.jpg","genre":["机制","阵营","激战数月"],"type":"城限","playersMin":7,"playersMax":7,"male":3,"female":4,"duration":7,"difficulty":"进阶","price":68,"memberPrice":0,"author":"","publisher":"","intro":"1592年，丰臣秀吉以武力统一日本后，悍然发兵十四万入侵朝鲜，在两个月内便占领了朝鲜全境。之后，丰臣秀吉将朝鲜切成八份，分给了魔下八个军团的首领。\n在朝鲜国王的再三乞求之下，身为宗主国的明朝决定出兵援助朝鲜复国。明军跨过鸭绿江，激战数月，先后收复了平壤和汉城。与此同时，朝鲜境内起义军四起，日军诸将无心再战，纷纷从自己的领地撤出，准备返日。只有一支日军部队，非但没有撤军，反而在长白山脚下建起了一座名为小谷城的日式城堡，负隅顽抗。于是，明军主力和朝鲜起义军将这座小谷城团团围住，决战一触即发……","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794219058596,"updatedAt":1794219058596,"reviews":[],"rating":{"avg":0,"count":0,"total":0}},{"id":"358f7584-7368-46e6-9f41-f238ee09077a","title":"官渡","cover":"uploads/1794219043444-0d5ce7ea.jpg","genre":[],"type":"盒装","playersMin":8,"playersMax":8,"male":0,"female":0,"duration":5,"difficulty":"进阶","price":48,"memberPrice":0,"author":"","publisher":"","intro":"皇帝昏聩无能，宦官专权，\n朝廷腐败，百姓苦不堪言，\n爆发了黄巾起义，\n在镇压起义过程中，各地军阀趁机扩张势力，\n纷起争雄，乱世之中，英雄人物竞相涌现。\n经过一系列大战之后，曹操一统中原，定都许昌，挟天子以令诸侯。\n袁绍则手握黄河以北青幽并翼四州，与曹操隔河相望。\n公元199年，相互制衡之势维持了五年之后，战争终于打响。\n双方大军在官渡对峙，一时剑拔弩张。\n此时一队袁军使臣却来到了许昌曹府，故事便发生在这里……","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794219043444,"updatedAt":1794219043444,"reviews":[],"rating":{"avg":0,"count":0,"total":0}},{"id":"cb2456d6-c13c-402e-913c-62592f3937e6","title":"白衣倾城2青山云海","cover":"uploads/1794218894343-3166c714.jpg","genre":["武侠","情感","机制","推荐人群","进阶玩家","推土机"],"type":"城限","playersMin":7,"playersMax":7,"male":4,"female":3,"duration":7,"difficulty":"进阶","price":68,"memberPrice":0,"author":"","publisher":"","intro":"","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794218894343,"updatedAt":1794218894343,"reviews":[],"rating":{"avg":0,"count":0,"total":0}},{"id":"1a36b3a3-ea60-4c83-9e4a-946bcc270727","title":"白衣倾城","cover":"uploads/1794218875611-a13bc6e3.jpg","genre":["武侠","情感","机制","本格"],"type":"城限","playersMin":8,"playersMax":8,"male":0,"female":0,"duration":7,"difficulty":"进阶","price":68,"memberPrice":0,"author":"","publisher":"","intro":"","note":"","featured":false,"pinned":false,"heat":5,"createdAt":1794218875612,"updatedAt":1794218875612,"reviews":[{"id":"4921e5cc-623b-4b29-9264-16b60fbe6476","scriptId":"1a36b3a3-ea60-4c83-9e4a-946bcc270727","name":"网络玩家2","rating":0,"content":"玩家还原整个故事难度很大，前期人为会刻意隐藏，信息变得难以还原，而还原对于整个剧本来说却不重要。最让人感觉惊奇的是玩家剧本竟然是有目录的，很便于玩家寻找自己的线索。游戏体验会因拿到的角色而不同，但不存在非常边缘的角色，剧本机制是非常有指向性的，会刺激玩家去还原剧本，不会让你觉得没事干，最后的决战机制也让人感到非常的爽快。","source":"network","createdAt":1794218815613},{"id":"48e4a3e7-0357-4b1b-8dba-70e2480f23bd","scriptId":"1a36b3a3-ea60-4c83-9e4a-946bcc270727","name":"网络玩家1","rating":0,"content":"在《白衣倾城》的中间过程中，不会感受到无聊，整个故事的信息量巨大。八个人物，每个人物背后都有着庞大的支线和反转。作者还在剧本中时不时地给玩家反转和刺激，让你在想走神时又能瞬间提起兴趣。","source":"network","createdAt":1794218755613}],"rating":{"avg":0,"count":0,"total":2}},{"id":"9473891a-a045-414f-8f1b-40b4e1539006","title":"怪谈事务所破界","cover":"uploads/1794217620422-4fd410d0.jpg","genre":["悬疑","机制","怪诞","养成","打斗阵营","剧本简介"],"type":"城限","playersMin":6,"playersMax":6,"male":3,"female":3,"duration":10,"difficulty":"进阶","price":78,"memberPrice":0,"author":"","publisher":"","intro":"千余年间，一直流传着这样一个传说，有一个不存在的组织，在掌控着这个世界所有的异常，只要某种现象超出了人类现有知识体系的认知，就会被这个组织抹除。但遗憾的是，这个组织并没有在任何史书中留有痕迹，只是坊间被称为诡居，英文则更加隐晦，称其为“The Place”。\n这个神秘的组织在全球各地都有自己的分部，而到了如今的世代，更多人将其称为事务所。事务所的成员全是分部事务所主管亲自挑选的，没有特定的标准，理由，甚至条件，总部对于各个分部人员挑选，也没有干预的权力。\n日本地区事务所的主管悠斗先生，面临着巨大的挑战。二十年前，他临危接任，事务所的全体成员和前任主管，竟然在一个事件的解决中集体失踪，他必须尽快补充成员，重新支撑日本地区的异常事件管控工作。\n但是他的选人，却充满了争议，甚至直接接到了总部的警告和罚单，然而他置若罔闻，二十年间，经过不懈努力，依然将这六个充满争议的危险人物招入麾下，而我们的故事就从这里开始。","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794217620423,"updatedAt":1794217620423,"reviews":[],"rating":{"avg":0,"count":0,"total":0}},{"id":"3ca61fdb-7786-4504-9226-ad457c20779a","title":"第7号嫌疑人","cover":"uploads/1794217569505-d1392181.png","genre":[],"type":"盒装","playersMin":6,"playersMax":6,"male":0,"female":0,"duration":5,"difficulty":"新手","price":48,"memberPrice":0,"author":"","publisher":"","intro":"","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794217569506,"updatedAt":1794217569506,"reviews":[{"id":"2412c6cc-3384-482f-97d2-f57d932d83fc","scriptId":"3ca61fdb-7786-4504-9226-ad457c20779a","name":"网络玩家","rating":0,"content":"第7号嫌疑人这个剧本刚一面试， 就成为了硬核本格推理剧本的教科书式代表。对于喜欢在蛛丝马迹中窥见真相的硬核推理玩家，绝对是再合适不过了。福尔摩斯们，快来约起吧！","source":"network","createdAt":1794217509507}],"rating":{"avg":0,"count":0,"total":1}},{"id":"5eefe3cc-917e-4b23-8a32-b1edb75c4426","title":"六角馆の谋杀鉴赏","cover":"uploads/1794217545402-9d3857cf.jpg","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":4,"female":2,"duration":8,"difficulty":"进阶","price":68,"memberPrice":0,"author":"","publisher":"","intro":"《六角馆谋杀鉴赏》设定为纯推理新本格剧本杀游戏，基于太平洋私人岛屿上的六角馆，包含六个环形连接主题房间（金、木、水、火、土、光）。玩家扮演收到匿名邀请函的犯罪爱好者，暴雨夜登岛后被困馆内。游戏开局通过管家身份测试（6个问答验证初始设定），核心聚焦火之间密室谋杀案——凌晨三点尸体心脏插有本应存放水之间的青铜匕首，广播宣布进入暴风雪山庄模式。玩家需依据机械条件（如路程固定10分钟）还原元素闭环诡计，过程禁止假设额外尸体或道具，时长约8小时。","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794217545403,"updatedAt":1794217545403,"reviews":[{"id":"a4bf7107-cf7d-4640-8f29-12d6687c3dc0","scriptId":"5eefe3cc-917e-4b23-8a32-b1edb75c4426","name":"网络玩家3","rating":0,"content":"最后阶段DM突然关闭所有照明，仅用紫外线手电照射我们整理的线索墙。原本杂乱无章的便签在蓝光下显现出隐藏的数字矩阵，这个设计巧妙到让人忍不住鼓掌。虽然最终还原时我的大脑已经过载，但看着新井直人玩家颤抖着拼完最后块拼图时，突然理解了什么叫”献给满分的名侦探”。","source":"network","createdAt":1794217485404},{"id":"bd5eb843-b73d-4c40-bd86-3def12341fb1","scriptId":"5eefe3cc-917e-4b23-8a32-b1edb75c4426","name":"网络玩家2","rating":0,"content":"中期北山诚一提出的”第七房间”假说堪称神来之笔。我们围着实木模型反复拆解，突然发现所有死亡位置连成的虚线，恰好是建筑图纸上被刻意模糊的接缝走向。那种头皮发麻的顿悟感，让原本昏昏欲睡的深夜车瞬间清醒。","source":"network","createdAt":1794217425404},{"id":"0561fab4-59bc-4cea-b273-1ffc1701a16e","scriptId":"5eefe3cc-917e-4b23-8a32-b1edb75c4426","name":"网络玩家1","rating":0,"content":"作为相泽翡翠的扮演者，我至今记得DM递来那份烫金邀请函时指尖的颤栗。开场破冰案里那个会”呼吸”的建筑模型，让我们车瞬间进入状态——当小岛浩一突然发现模型底座暗格里的齿轮组，全车人同时倒吸冷气的场面至今难忘。","source":"network","createdAt":1794217365404}],"rating":{"avg":0,"count":0,"total":3}},{"id":"15172baf-f4ad-46c4-b8e3-9264d0a9a4d1","title":"玻璃屋","cover":"uploads/1794217519582-d0665a50.png","genre":["推理","现代","本格"],"type":"盒装","playersMin":7,"playersMax":7,"male":0,"female":0,"duration":5,"difficulty":"新手","price":48,"memberPrice":0,"author":"","publisher":"","intro":"二十一世纪中叶，人类科技文明飞跃，然而全球人口数量极速膨胀使得全球资源再次面临分配不均等重大难题，世界各国都在寻求可以解决这一矛盾的方法…… 这一天，位于香山之巅的乌洛山庄门口，早早等候在此的管家迎接着盛装出席的宾客们，山庄别墅内装饰有大量统一规格，绘有精美画作的玻璃，因此也得名“玻璃屋”，一年一度的感恩节宴会即将在此举办。精致的面容下，众人各自心怀叵测的眼神交错，却道出一丝气氛诡谲。 狰狞的佛像、帘后的女人、破碎的镜子，讲述着怎样血腥绝望的故事。 血字留言、残暴分尸、密室杀人，真相在燃烧的别墅里灰飞烟灭……","note":"","featured":false,"pinned":false,"heat":5,"createdAt":1794217519583,"updatedAt":1794217519583,"reviews":[{"id":"86a7d155-9134-47fe-8786-24aa86e8be06","scriptId":"15172baf-f4ad-46c4-b8e3-9264d0a9a4d1","name":"网络玩家","rating":0,"content":"整个故事是以一个奇奇怪怪的剧情开始的，翻开第一幕的你，可能是一头雾水。大部分玩家一开始肯定都是一脸疑惑小心翼翼，不敢多说话，至少我当时作为玩家的时候就是这种感觉，生怕说错话而暴露了什么不该说的事情。 前半部分剧情基本以小剧场的形式呈现给大家，创意很新颖，让所有的玩家很快的带入人物人设和作者所创作的剧本故事里面。作者的对每一个人的描写都很细腻，7个人物没有边缘角色，每个玩家的剧本的信息量分配比较平均，不会出现几个玩家挂机还能继续盘的情况。","source":"network","createdAt":1794217459584}],"rating":{"avg":0,"count":0,"total":1}},{"id":"e1394242-1427-4660-8280-42abe3cd4eb7","title":"猎人笔记雪夜","cover":"uploads/1794217387648-e6a171c6.jpg","genre":[],"type":"城限","playersMin":7,"playersMax":7,"male":0,"female":0,"duration":6,"difficulty":"进阶","price":78,"memberPrice":0,"author":"","publisher":"","intro":"红石镇，位于得克萨斯州旁的新墨西哥州，坐落于绵延的落基山脉脚下。\n小镇的名字源自于印第安部落。\n此处诸多山脉高耸入云，白雪覆顶。\n覆压百里，隔天断世。\n秃鹫在山顶盘旋，薄雾中都是水汽的味道，落在鼻尖上也有淡淡的凉意。\n入夜，整个红石镇街道上空无一人，镇民们早早封锁了自家的屋子，像是约定好一般足不出户。\n风滚草在地上发出淡淡的“沙沙”声。这一切都静的异常。\n今天注定是个载入史册的日子。\n迎着月色，小镇外多方人马由远及近。\n马蹄声如野兽奔腾，飞沙走石。\n人群，黑影，踢踏声。\n枪火，硝烟，碎片声。\n充斥着镇里的每一个角落。\n酒馆老板躲在吧台后望着拨动的怀表喃喃自语:“浸漫长夜，我看不清灯，也看不见人。”\n“看到的，只有无尽黑暗和一抹白雪。’\n“雪夜将至，当心小命。”","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794217387648,"updatedAt":1794217387648,"reviews":[],"rating":{"avg":0,"count":0,"total":0}},{"id":"3f61e872-a221-4556-9f10-9926e16b3b83","title":"天命难违","cover":"uploads/1794217341786-1387a619.jpg","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":3,"female":3,"duration":10,"difficulty":"进阶","price":78,"memberPrice":0,"author":"","publisher":"","intro":"《天命难违》以东极村南边码头六座神庙为舞台，六颗黄金头骨同时降临六座大殿，“见证人”无死角全程监控，村民陷入“天罚”恐慌。玩家扮演天门侦学堂六名学子（桐遥/侧翎等），需破解六个以简单设定为基础的高密度密室案件，经历三重逻辑反转，从精密动线与时间线中剔除红鲱鱼，还原连环诡计背后的合作真相。核心任务为：运用头骨技能与核心设定，理清每一次伪解答的漏洞，抽丝剥茧找出唯一真解，最终揭示东极村破除天命诅咒的完整过程。","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794217341787,"updatedAt":1794217341787,"reviews":[{"id":"554a6845-e869-4266-aaa0-5b2579d2fa2d","scriptId":"3f61e872-a221-4556-9f10-9926e16b3b83","name":"网络玩家3","rating":0,"content":"纯硬核细糠，体量真的大，我们打了近十一个小时但没觉得拖沓。设定就两页纸，复用率极高，没有废设定。适合愿意耐心啃动线、不怕反复推翻的长逻辑玩家。新手、还原党、受不了红鲱鱼的慎入。找个靠谱dm很重要，不然容易卡死在误导里。打完只有一个念头：灰烬，确实回来了。","source":"network","createdAt":1794217281788},{"id":"f51a8a71-9497-4270-8a0f-4758713f8001","scriptId":"3f61e872-a221-4556-9f10-9926e16b3b83","name":"网络玩家2","rating":0,"content":"反转来得猝不及防，前半场觉得盘明白了，后置线索一出来全变假象。最崩溃的是腾蛇第二重，十分钟绝对监控，我们借技能、算移动、画轨迹，卡了快两小时，最后还是靠dm扶了一把——但借贷那个思路出来后，集体起鸡皮疙瘩。第三重把所有案子串联成一张大网，之前的矛盾全变成伏笔，结局那段故事读得眼眶发酸。","source":"network","createdAt":1794217221788},{"id":"8b84297a-8ed4-4bca-9abd-e03e2c943db5","scriptId":"3f61e872-a221-4556-9f10-9926e16b3b83","name":"网络玩家1","rating":0,"content":"开篇就被按头画时间线，六个案子堆过来，第一遍看口供差点瞎了。朱雀案那个一分钟诡计，我们盯着庙宇地图反复比划，发现真相时整车拍桌。黄龙案真的吐了，光找谜面就花了四十分钟，望哥你是魔鬼吗？","source":"network","createdAt":1794217161788}],"rating":{"avg":0,"count":0,"total":3}},{"id":"83da30cd-538d-43ab-8692-9648ecfde7e4","title":"王不见王","cover":"uploads/1794217320559-cf4ecf1f.jpg","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":3,"female":3,"duration":10,"difficulty":"进阶","price":78,"memberPrice":0,"author":"","publisher":"","intro":"","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794217320560,"updatedAt":1794217320560,"reviews":[{"id":"63217eda-7c18-49fe-8ebf-19828719f6d2","scriptId":"83da30cd-538d-43ab-8692-9648ecfde7e4","name":"网络玩家4","rating":0,"content":"整个剧本像一部结构精巧的群像剧，十个角色个个都有心眼，剧情和推理结合得很紧密，不会觉得是在干巴巴做题。最后关于“王”的定义和循环真相的反转，把整个故事的立意又拔高了一层。不过很吃主持人对节奏和逻辑链的引导，如果带得好，体验能直接封神。","source":"network","createdAt":1794217260563},{"id":"d9fe6ca0-1b98-43d2-8616-ac665c0e4a4e","scriptId":"83da30cd-538d-43ab-8692-9648ecfde7e4","name":"网络玩家3","rating":0,"content":"推理部分完全是逻辑流玩家的狂欢。没有复杂的密室和手法，就是纯粹的行为逻辑链条推演。主持人会用线索和问题不断封堵掉可能性，逼着你从正反两个方向去验证，直到找到那个能满足所有条件的唯一解。盘出那个因为房间号误导导致的意外死亡点时，全场都有一种豁然开朗的快感。","source":"network","createdAt":1794217200563},{"id":"2f66e9e3-de7b-41f3-8398-9d63cd2d169c","scriptId":"83da30cd-538d-43ab-8692-9648ecfde7e4","name":"网络玩家2","rating":0,"content":"真正的博弈从分阵营开始就拉满了。你知道有两个人在暗处，但他们彼此不知道，这种设计让好人的推理和坏人的操作都充满了变数。每一轮讨论都像在下一盘大棋，不仅要算自己怎么赢，还得猜对面会怎么想，甚至要算对面觉得我会怎么想，层层递进的算计特别过瘾。","source":"network","createdAt":1794217140563},{"id":"283b6405-3075-461d-9b18-9f6742930f57","scriptId":"83da30cd-538d-43ab-8692-9648ecfde7e4","name":"网络玩家1","rating":0,"content":"开局就被抛进一个只有特征代号的世界，记忆是碎的，规则是新的，需要自己从信物和对话里把身份一点点扒出来。破冰环节就直接进入状态，盘人物关系和行为逻辑，感觉脑子还没热身就开始高速运转了。","source":"network","createdAt":1794217080563}],"rating":{"avg":0,"count":0,"total":4}},{"id":"4cf3b68d-c45d-4265-8c5c-42800be3b34e","title":"恶弈","cover":"uploads/1794217283903-ac43039d.jpg","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":6,"female":0,"duration":9.5,"difficulty":"硬核","price":78,"memberPrice":0,"author":"","publisher":"","intro":"《恶弈》以1995年东京为背景，佐仓秀治在通缉中翻开麻叶寄春遗留的小说，卷入井之头公园碎尸、八王子枪击、孕妇惨死及信息泄露等多起案件，玩家扮演佐仓秀治的六重人格，通过纯本格手法破解循环、救赎、魔警、坍缩四案，核心任务为运用逻辑排除与动线推演还原事件全貌，经历密室、叙诡与一案四解的硬核挑战，最终在思维殿堂中拼凑出恶人狩猎的真相。","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794217283904,"updatedAt":1794217283904,"reviews":[{"id":"9d737809-7e5c-4ea7-87d3-6c21d30e751c","scriptId":"4cf3b68d-c45d-4265-8c5c-42800be3b34e","name":"网络玩家3","rating":0,"content":"纯本格推理确实硬核，逻辑链环环相扣，软逻辑的地方不多，文本轻量却藏刀，细节复用率高，没拖沓的设定学习。只是末段还原稍显仓促，但整体丝滑，不堆后置线索就能自然反转，喜欢啃长逻辑的推土机会爽到。","source":"network","createdAt":1794217223905},{"id":"dd4b59e2-3e78-4eb2-b01d-ab0fbc084c08","scriptId":"4cf3b68d-c45d-4265-8c5c-42800be3b34e","name":"网络玩家2","rating":0,"content":"坍缩案阅读量炸裂，单搜演绎差点把眼珠子焊在文本上，口供和地图反复看，盘到后半夜满脑子都是死亡留言和密室手法。一案四解推出来时，全车嗷嗷喊合理，才发现开局那句“麻叶寄春纯粹是个混蛋”早埋了钩子。","source":"network","createdAt":1794217163905},{"id":"c414488a-593b-47b6-9ed5-d34a00c0d736","scriptId":"4cf3b68d-c45d-4265-8c5c-42800be3b34e","name":"网络玩家1","rating":0,"content":"开局以为是个边缘人，结果直接被按头当C位，抓小三破冰案把期待度拉满，三句话藏着五把刀，翻页都得提防被叙诡绊一跤。盘循环案时差点把黑板写成蜂窝煤，动线绕来绕去愣是盘出八百个心眼子，魔警案被车友一个点破真相时，鸡皮疙瘩窜上天灵盖。","source":"network","createdAt":1794217103905}],"rating":{"avg":0,"count":0,"total":3}},{"id":"32e15d58-5800-4fd0-ba84-26967e37a672","title":"因火成烟","cover":"uploads/1794217150989-e868bd3b.jpg","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":3,"female":3,"duration":7,"difficulty":"进阶","price":68,"memberPrice":0,"author":"","publisher":"","intro":"三个世界\n六个密室\n六十七个结果 一个原因\n火是烟的因\n烟是火的果 拨开烟雾\n寻因觅果","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794217150990,"updatedAt":1794217150990,"reviews":[{"id":"8837eef3-09cd-4e54-b36f-47d1e37a0aa0","scriptId":"32e15d58-5800-4fd0-ba84-26967e37a672","name":"网络玩家4","rating":0,"content":"整体体验：整体来说，《因火成烟》是一个非常适合放松心情、感受悬疑推理氛围的游戏。它让玩家在游戏中体验到了探索未知的刺激和角色扮演的乐趣。","source":"network","createdAt":1794217090991},{"id":"a5a579c8-33fa-40a4-9b1a-42654d8dfdf6","scriptId":"32e15d58-5800-4fd0-ba84-26967e37a672","name":"网络玩家3","rating":0,"content":"推理难度：推理难度中等，需要玩家具备一定的逻辑思维能力和观察力。游戏中的线索错综复杂，真假难辨，玩家需要通过仔细分析和推理，才能逐渐揭开火灾背后的真相。这种中等难度的推理挑战对于喜欢烧脑但又不想过于复杂的玩家来说是一种很好的体验。","source":"network","createdAt":1794217030991},{"id":"8a67beb1-353e-40eb-bc9d-a0ce458e861b","scriptId":"32e15d58-5800-4fd0-ba84-26967e37a672","name":"网络玩家2","rating":0,"content":"角色设定：角色设定鲜明生动，每个角色都有其独特的性格、背景和动机。消防员A的专业与勇敢、警察B的严谨与执着、记者C的好奇与追求、小镇居民D的朴实与恐惧、火灾幸存者E的脆弱与坚定、知情者F的神秘与莫测，这些角色设定使得游戏更加生动有趣。","source":"network","createdAt":1794216970991},{"id":"94df6aeb-4ed2-402e-a319-c6c488a0c71a","scriptId":"32e15d58-5800-4fd0-ba84-26967e37a672","name":"网络玩家1","rating":0,"content":"剧情方面：《因火成烟》的剧情紧凑且充满悬疑。从角色们开始接触这些火灾事件起，整个故事就充满了紧张和刺激。各种离奇的现象和神秘的事件接连不断，让玩家始终保持着高度的紧张和好奇。剧情的发展既有戏剧性，又有现实感，让玩家能够感同身受地体验到火灾的恐怖和调查的艰辛。","source":"network","createdAt":1794216910991}],"rating":{"avg":0,"count":0,"total":4}},{"id":"17607346-7c83-4e76-8a71-0ecce15f4af8","title":"元気少女从天而降","cover":"uploads/1794217133023-872928e6.jpg","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":2,"female":4,"duration":5,"difficulty":"新手","price":68,"memberPrice":0,"author":"","publisher":"","intro":"《元気少女从天而降》以纯爱之岛青梅岛为舞台，玩家扮演参加恋爱综艺的六名角色，通过亲吻契约开启七日魔幻恋情，却逐渐揭开泷野家族黑暗的变态秘密。核心任务为：在轻快破冰中吃瓜互动，运用单一设定推理三起猎奇案件，并通过日记还原三代人间交织的谎言与真相，经历多重反转后，揭露“纯爱”表象下的惊人核诡。全程需6-8小时专注协作，最终在逻辑严密的还原中直面人性扭曲的闭环。","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794217133024,"updatedAt":1794217133024,"reviews":[{"id":"6eeae685-7ffe-428c-b6e4-b3c7c6189a66","scriptId":"17607346-7c83-4e76-8a71-0ecce15f4af8","name":"网络玩家3","rating":0,"content":"整体逻辑硬核但节奏轻快，没有冗长设定轰炸，案件服务还原，吃瓜推动推理。新手能乐在其中，老手也能盘得爽，唯一缺点是故事太勾人，打完还想再扒点泷野家的黑料。","source":"network","createdAt":1794217073025},{"id":"b6cb48f1-b354-4f48-8bd2-84baccbf91af","scriptId":"17607346-7c83-4e76-8a71-0ecce15f4af8","name":"网络玩家2","rating":0,"content":"反转来得猝不及防，上一秒还在嗑CP，下一秒就被按头盘三代黑历史。日记覆盖那套玩法绝了，自己写的谎话还得自己圆回来，车友嗷嗷喊“这逻辑链是钢筋焊的吧”。核诡揭晓那刻，鸡皮疙瘩从脚底窜到头顶，才懂“元气少女”这名儿有多讽刺。","source":"network","createdAt":1794217013025},{"id":"87295d5f-2e8c-4050-abe3-1b6948eae32f","scriptId":"17607346-7c83-4e76-8a71-0ecce15f4af8","name":"网络玩家1","rating":0,"content":"开局还以为真是来谈恋爱的，结果吻完才发现签的是“变态契约”。日记本翻得比病历还勤，每页都像在扒马甲，谁暗恋谁、谁又坑了谁，瓜多得吃不过来。盘案件时设定简单到离谱——亲嘴就能恋爱，但死法一个比一个猎奇，脑子得在纯爱和凶案间反复横跳。","source":"network","createdAt":1794216953025}],"rating":{"avg":0,"count":0,"total":3}},{"id":"5ede4ab9-8a27-4751-bcfa-eed3dfb0bd6e","title":"莫格街的晚宴","cover":"uploads/1794217114074-9eba93ec.jpg","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":4,"female":2,"duration":8,"difficulty":"进阶","price":68,"memberPrice":0,"author":"","publisher":"","intro":"","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794217114074,"updatedAt":1794217114074,"reviews":[{"id":"5c508045-2861-4644-8fef-14b0781c16cc","scriptId":"5ede4ab9-8a27-4751-bcfa-eed3dfb0bd6e","name":"网络玩家","rating":0,"content":"《莫格街的晚宴》剧本中的每一个细节都经过精心设计，玩家需要在有限的时间内收集线索、分析情况，并与其他玩家互动，逐步揭开隐藏在晚宴背后的真相。角色之间的互动和冲突也为游戏增添了不少乐趣","source":"network","createdAt":1794217054075}],"rating":{"avg":0,"count":0,"total":1}},{"id":"5d434f41-889c-4935-8f46-522534d9c167","title":"此时彼刻之人","cover":"uploads/1794217089548-23d0e6e3.jpg","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":0,"female":0,"duration":9,"difficulty":"进阶","price":78,"memberPrice":0,"author":"","publisher":"","intro":"您好，冒昧打扰。\n鄙人【风间七树】，诚挚邀请诸位见证人，与【九十九椿】小姐共同莅临《此时彼刻之人》音乐会巡演。\n本场巡演，将以【设定】为鼓，【动机】为琴，【故事】为弦，【推理决斗】为指挥，演奏彼刻仇之因，弹响此时恨之果。\n最终，抵达名为“爱”的宿命。诸位，请有序入场，勿大声喧哗。演出，即将开始。","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794217089551,"updatedAt":1794217089551,"reviews":[{"id":"75a829ee-e842-4f69-a681-5e15fa443dc6","scriptId":"5d434f41-889c-4935-8f46-522534d9c167","name":"网络玩家6","rating":0,"content":"不断推翻重构之后，引入新的概念设定，案件又是否存在其他解答？","source":"network","createdAt":1794217029553},{"id":"9fcc4a33-7a59-4220-a391-ecc18f48d914","scriptId":"5d434f41-889c-4935-8f46-522534d9c167","name":"网络玩家5","rating":0,"content":"又是什么让我们的男主放弃了多年的侦探梦想？","source":"network","createdAt":1794216969553},{"id":"386b956b-7499-4091-9862-a0bb6eb3c6f6","scriptId":"5d434f41-889c-4935-8f46-522534d9c167","name":"网络玩家4","rating":0,"content":"这座岛是否真的存在着魔法？","source":"network","createdAt":1794216909553},{"id":"06a427da-1748-4e15-97e4-38c8c00916f9","scriptId":"5d434f41-889c-4935-8f46-522534d9c167","name":"网络玩家3","rating":0,"content":"而卷入其中的风间七树竟被指认为凶手？","source":"network","createdAt":1794216849553},{"id":"d9449965-fe50-4b44-abf2-6d4af0dedbd0","scriptId":"5d434f41-889c-4935-8f46-522534d9c167","name":"网络玩家2","rating":0,"content":"后面随着男主风间七树收到昔日白月光铃鸟来信，欣然乘船去往业莲岛赴约，碰巧遇上岛上大家族祭祀活动。而随着祭祀活动的进行，接连不断的凶案，肢解，干尸，坠亡.…….","source":"network","createdAt":1794216789553},{"id":"4cdeaf12-ac29-4e97-83b9-7ccd50928614","scriptId":"5d434f41-889c-4935-8f46-522534d9c167","name":"网络玩家1","rating":0,"content":"第一案的密室算是开胃小菜，老玩家基本10 min 左右，我一直不太喜欢密室，不过还好密室手法不太重要，这一趴可以快快过。","source":"network","createdAt":1794216729553}],"rating":{"avg":0,"count":0,"total":6}},{"id":"ed1f45d5-08af-4947-8947-9c49a131f4c7","title":"我与我诀别","cover":"uploads/1794299759149-c9e5b257.jpg","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":3,"female":3,"duration":7.5,"difficulty":"进阶","price":68,"memberPrice":0,"author":"","publisher":"","intro":"《我与我诀别》以日式背景下的时间穿越与宿命悖论为核心，玩家扮演六名角色在交织的百年时空中探索爱与诀别的真相。核心任务为：通过设定推理还原跨越世纪的动机与人物关系，经历破冰案件与多重身份转换，从青玉、雨夜等隐喻物件中拼凑集体阴谋，揭露“诀别”符号下的人性挣扎。全程需6-8小时专注协作，最终在逻辑闭环中直面宿命与情感的冲击。","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794217051619,"updatedAt":1794299765277,"reviews":[{"id":"84f6b02f-4748-4bf3-a32f-ebc195a11d01","scriptId":"ed1f45d5-08af-4947-8947-9c49a131f4c7","name":"网络玩家3","rating":0,"content":"还原部分确实硬核，逻辑链环环相扣，没有拖沓废话，细节复用率高。只是末段稍显仓促，但整体丝滑，自然反转不突兀，喜欢啃长逻辑的推土机会很过瘾。","source":"network","createdAt":1794216991621},{"id":"19f45bd9-8aa2-4511-b694-0251463b3066","scriptId":"ed1f45d5-08af-4947-8947-9c49a131f4c7","name":"网络玩家2","rating":0,"content":"单搜部分差点把脑子烧糊。npc每个动作都像在传递密码，盘到后半夜眼睛都睁不开了还在亢奋。破解核心那刻全身鸡皮疙瘩，才发现开头那场雨早就埋了伏笔。","source":"network","createdAt":1794216931621},{"id":"a09bcdb1-1b53-4dd5-af4b-7eb25dc62aae","scriptId":"ed1f45d5-08af-4947-8947-9c49a131f4c7","name":"网络玩家1","rating":0,"content":"开局以为就是个普通时间穿越本，结果直接被按头进百年宿命盘逻辑。本里每句话都像藏了钩子，翻页都得提防被叙诡绊一跤。盘关系时黑板画成蜘蛛网——就那几个人名，愣是盘出几十种可能性，车友嗷嗷喊“倒带重来”。","source":"network","createdAt":1794216871621}],"rating":{"avg":0,"count":0,"total":3}},{"id":"9cc524ce-22bc-4cc9-bcc4-8fb45c3e6c1a","title":"她未能歌颂的明日","cover":"uploads/1794217032024-ed58a106.jpg","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":3,"female":3,"duration":7,"difficulty":"进阶","price":68,"memberPrice":0,"author":"","publisher":"","intro":"","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794217032024,"updatedAt":1794217032024,"reviews":[{"id":"0100c24a-029d-4a13-b284-b181dabf2d8d","scriptId":"9cc524ce-22bc-4cc9-bcc4-8fb45c3e6c1a","name":"网络玩家4","rating":0,"content":"整体来说是个非常舒服的还原本，时长友好，过程欢乐，该有的逻辑和反转也没落下。适合想轻松一下，又不想玩得太无脑的熟人车，全程都在线，一点不累。","source":"network","createdAt":1794216972025},{"id":"f931f468-bb66-4c3a-9400-ef81141dd0b8","scriptId":"9cc524ce-22bc-4cc9-bcc4-8fb45c3e6c1a","name":"网络玩家3","rating":0,"content":"最后看到结局本有点意外，在一片嘻嘻哈哈和猎奇故事里，突然来这么一笔纯爱，后劲还挺足。不是那种按头哭，就是读完心里有点空落落的，会忍不住回想前面那些离谱事里是不是早就藏了这根线。","source":"network","createdAt":1794216912025},{"id":"3ae10d05-dbec-4fd8-977c-8acd10faab7a","scriptId":"9cc524ce-22bc-4cc9-bcc4-8fb45c3e6c1a","name":"网络玩家2","rating":0,"content":"中期那个“月下契约”的规则开始发威，直接把前面的东西都拧过来重看。一开始觉得有点绕，但跟着DM的节奏走，发现逻辑链扣得特别细，一步步推下来特别顺畅。没有那种硬要你盘到头秃的感觉，反而像在拆一个设计巧妙的连环扣，每解开一个就有新发现。","source":"network","createdAt":1794216852025},{"id":"215719a9-2996-4e69-bb46-33a4c4edbcf9","scriptId":"9cc524ce-22bc-4cc9-bcc4-8fb45c3e6c1a","name":"网络玩家1","rating":0,"content":"开局直接进案子，一点不拖沓，手法盘起来顺顺的，不用读大段设定真是福音。本来以为就是个普通吃瓜本，结果瓜的密度和炸裂程度超乎想象，分享环节跟车友们互相蛐蛐，笑得脸疼。我这角色的人生主打一个精彩纷呈，分享的时候根本刹不住车，感觉自己在演晨间剧。","source":"network","createdAt":1794216792025}],"rating":{"avg":0,"count":0,"total":4}},{"id":"6715f20f-e16e-4242-8a5c-f0a12c73e6b1","title":"诡计患者的谜题","cover":"uploads/1794216933135-69680ebe.jpg","genre":["推理"],"type":"城限","playersMin":6,"playersMax":6,"male":3,"female":3,"duration":8,"difficulty":"硬核","price":68,"memberPrice":0,"author":"","publisher":"","intro":"","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794216933135,"updatedAt":1794216933135,"reviews":[{"id":"79adb765-fac3-47a6-a76d-85653f6d17d8","scriptId":"6715f20f-e16e-4242-8a5c-f0a12c73e6b1","name":"网络玩家6","rating":0,"content":"因为在这本红色的谜题集面前，故事只是一个额外的元素，不需要投入情感，也不需要共鸣。","source":"network","createdAt":1794216873136},{"id":"00cb1667-5e77-4dfb-9d1d-41bf197dd908","scriptId":"6715f20f-e16e-4242-8a5c-f0a12c73e6b1","name":"网络玩家5","rating":0,"content":"然而，它的所有优点也正是其缺点所在，这意味着这本作品并非面向大众市场，甚至不能算作一本标准的剧本杀作品。","source":"network","createdAt":1794216813136},{"id":"89f37237-340d-40ea-a996-df0de2554072","scriptId":"6715f20f-e16e-4242-8a5c-f0a12c73e6b1","name":"网络玩家4","rating":0,"content":"任何玩过猫岛游戏的人都会明白，这是灰烬在反转设计上所能达到的最高水准，也是最精美的推理游戏作品，是洋葱这位诡计大师精心构思并雕琢的杰作。","source":"network","createdAt":1794216753136},{"id":"93dafb67-6662-4b21-a2bc-43ca1697717c","scriptId":"6715f20f-e16e-4242-8a5c-f0a12c73e6b1","name":"网络玩家3","rating":0,"content":"这本谜题集包含了所有线索和解答，提供了多样化的体验。","source":"network","createdAt":1794216693136},{"id":"0bcdbf0a-ed92-4dd0-887f-9392b7bc9b26","scriptId":"6715f20f-e16e-4242-8a5c-f0a12c73e6b1","name":"网络玩家2","rating":0,"content":"它就像是一封写给推理爱好者的情书，也是解题爱好者的最爱。","source":"network","createdAt":1794216633136},{"id":"d92fac0d-f01f-42cb-b80d-db245e112823","scriptId":"6715f20f-e16e-4242-8a5c-f0a12c73e6b1","name":"网络玩家1","rating":0,"content":"通常在评价一本作品时，我会分析其优缺点，但这次我很难从逻辑和诡计的角度找出这本作品的不足。","source":"network","createdAt":1794216573136}],"rating":{"avg":0,"count":0,"total":6}},{"id":"e4ade945-27d7-49db-8c61-48610ea6e57a","title":"诡计甜美的死去","cover":"uploads/1794216896993-95793dbc.jpg","genre":["架空","日式","推理"],"type":"城限","playersMin":6,"playersMax":6,"male":3,"female":3,"duration":6,"difficulty":"进阶","price":58,"memberPrice":0,"author":"","publisher":"","intro":"无风之境的花园中，\n为证明阿基里斯悖论而存在的落星馆仍遥遥矗立。\n无冕侦探手持裁定之枪，目光熠熠地指着面前最后的诡计狂想者。\n侦探会亲手杀死诡计，就如同众人期望的一般。\n那包含甜美的子弹终是射向面前之人的头颅。\n脸上绽放着甜美的笑意，直至眉心被锐利的子弹贯穿，身躯向后方倾去。\n诡计终于迎来了甜美的死亡。\n鲜血染红了花园中的白色铃兰，天空中亮起了繁杂神秘的符文。\n设定规则之下的审判裁定\n逝者携手共赴死亡的果决\n击穿宿命遗忘的甜美子弹\n构建铭记的第四种可能性\n名为「诡计甜美死去」的赌约，此刻正式开始","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794216896994,"updatedAt":1794216896994,"reviews":[{"id":"07a3bb95-4571-4e59-aad7-d85f758e8ce2","scriptId":"e4ade945-27d7-49db-8c61-48610ea6e57a","name":"网络玩家6","rating":0,"content":"全程公共视角，没有故事分享。硬核推理玩家狂喜的盛宴。","source":"network","createdAt":1794216836995},{"id":"4e55e2b2-12cd-4f1f-8a15-e316e2ed2f36","scriptId":"e4ade945-27d7-49db-8c61-48610ea6e57a","name":"网络玩家5","rating":0,"content":"六位侦探又带着何种甜蜜的诡计去挑战呢？","source":"network","createdAt":1794216776995},{"id":"0b8ee1c0-33c5-4983-9212-bfe9204d31d6","scriptId":"e4ade945-27d7-49db-8c61-48610ea6e57a","name":"网络玩家4","rating":0,"content":"这一次我们又要挑战神明了，这次是蓓尔嘉女神！","source":"network","createdAt":1794216716995},{"id":"4391e755-f992-4037-bb93-eb567820e733","scriptId":"e4ade945-27d7-49db-8c61-48610ea6e57a","name":"网络玩家3","rating":0,"content":"一开始喊口号还不明所以，后来发现这句口号是打破第四堵墙在对店家说，我们还喊得这么起劲。","source":"network","createdAt":1794216656995},{"id":"d00dc466-8afa-48fd-a2bc-5326fc20cf87","scriptId":"e4ade945-27d7-49db-8c61-48610ea6e57a","name":"网络玩家2","rating":0,"content":"在西安展最后一天又来看看我心心念念的诡计甜美了！","source":"network","createdAt":1794216596995},{"id":"be6baf0d-fb99-4e4f-b399-c63d5c971055","scriptId":"e4ade945-27d7-49db-8c61-48610ea6e57a","name":"网络玩家1","rating":0,"content":"“找到子弹，才能吃饭！！！”","source":"network","createdAt":1794216536995}],"rating":{"avg":0,"count":0,"total":6}},{"id":"2c4f04e8-ea6c-4242-94f0-fc72ffd2945d","title":"白色乡愁","cover":"uploads/1794216831365-4a5e7dcc.jpg","genre":[],"type":"独家","playersMin":6,"playersMax":6,"male":0,"female":0,"duration":9,"difficulty":"进阶","price":78,"memberPrice":0,"author":"","publisher":"","intro":"我的爷爷曾是一名走遍大江南北的民俗学者，可他如今患上了阿兹海默，最后的愿望竟是想要落叶归根。\n神秘的复活仪式、恐怖的蝉母信仰、离奇的密室杀人……爷爷发病前留下的这本名为《纯白色的故乡》的小说，详实记录了他1979年回老家时，在深山村落经历的一场连环血案。\n从那之后，爷爷再也没回过故乡。\n为此，在小说的指引下，我踏上了寻找爷爷故乡的旅程。\n窗外的风景中埋葬的，究竟是爷爷留下的解谜游戏，还是游子的救赎?\n当破碎的拼图被拼接完整，我才发现，那抹白色的乡愁，仍在这个时代萦绕\n就如那年的蝉鸣，始终回荡不休……","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794216831368,"updatedAt":1794216831368,"reviews":[{"id":"461a0ee4-29c9-4e9f-811e-a7cadbceb6ce","scriptId":"2c4f04e8-ea6c-4242-94f0-fc72ffd2945d","name":"网络玩家4","rating":0,"content":"爷爷的故事也在推理中被抽丝剥茧，情感的融入随还原而递进，破解完全部也达到了高潮!民族的热血也在此刻沸腾!正如苏轼所说“此心安处是吾乡”，而对于脚下这片土地是属于爷爷“白色的乡愁”。","source":"network","createdAt":1794216771370},{"id":"74c73205-ab90-42a1-95c5-4821e88768af","scriptId":"2c4f04e8-ea6c-4242-94f0-fc72ffd2945d","name":"网络玩家3","rating":0,"content":"随时剧情的逐步深入，重点来了!!!这部分我先声明没有切实的体验到(因为某些原因『密室卿』老师给我们开的口嗨版)，但是这个部分我听着就觉得已经起鸡皮疙瘩了，完美的闭环逻辑，层层递进的还原过程，让整个的游戏过程变得愈发有趣!并且也结合了中式民俗独特的魅力，再融入民族时代的破败感，真的很精彩!破解环环相扣的谜题，将谜题碎片一片片批凑出来，会发现那“神之一手”就是真相，一切的一切也都因为这片真相的碎片而发生质变!","source":"network","createdAt":1794216711370},{"id":"236e242e-c446-45cd-8234-504c4eeeb26d","scriptId":"2c4f04e8-ea6c-4242-94f0-fc72ffd2945d","name":"网络玩家2","rating":0,"content":"乡愁可以说受众面很广，而且有完整的逻辑链可以盘，并且逻辑极为严密，手法的设计没有以往的本那么难，但是所有的诡计都是为剧情服务的，真的对灰烬竖大拇哥了，永远可以跳出舒适圈，让玩家耳目一新。","source":"network","createdAt":1794216651370},{"id":"bfc1ee55-5ca5-4b9c-9cff-d90b9249bd09","scriptId":"2c4f04e8-ea6c-4242-94f0-fc72ffd2945d","name":"网络玩家1","rating":0,"content":"故事的背景以中式现代为背景，但是文笔以后很有灰烬的味道!这次的风格绝对是在推理本里是开了先河的!推理还原占比五五开，而且逻辑极为丝滑。","source":"network","createdAt":1794216591370}],"rating":{"avg":0,"count":0,"total":4}},{"id":"29e0bd2c-d2a4-4fa7-a5de-03de297aed51","title":"关于Y的奇迹","cover":"uploads/1794216793496-c8d0c4f5.jpg","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":3,"female":3,"duration":8,"difficulty":"进阶","price":78,"memberPrice":0,"author":"","publisher":"","intro":"在一个被迷雾笼罩、看似普通却暗藏玄机的小镇上，命运的红线将几位身份迥异的玩家紧紧缠绕🧵。这里有神秘的失踪案件，有古老家族的神秘传说，还有那些被岁月尘封的爱恨情仇。随着剧情的层层推进，每个人物背后隐藏的秘密如同抽丝剥茧般逐渐显露。你可能会发现，自己与身边的人有着跨越时空的羁绊，而每一个抉择，都可能改变整个故事的走向。像是在玩一场现实版的 “命运模拟器”，每一步都充满惊喜与未知。","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794216793503,"updatedAt":1794216793503,"reviews":[{"id":"c19679bc-1000-4c74-a53a-f3275384252d","scriptId":"29e0bd2c-d2a4-4fa7-a5de-03de297aed51","name":"网络玩家","rating":0,"content":"🧠推理体验：《关于Y的奇迹》的推理环节设计得相当巧妙。线索分布在各个角落，需要玩家们用心去发现、去分析。在推理过程中，你会不断遇到新的谜团，让你一刻都不敢放松。而且，它的推理并不是简单的线性推理，而是充满了各种反转和惊喜，每一次的推理突破都能给你带来极大的成就感。\n🎭情感沉浸：这绝对是该本的一大亮点！情感线丰富且细腻，无论是亲情、友情还是爱情，都刻画得入木三分。作者通过细腻的文字描述，让你很容易代入到角色中，感受角色的喜怒哀乐。有不少玩家在游戏过程中被深深打动，甚至留下了感动的泪水。在沉浸环节，配合上恰到好处的音乐和氛围营造，那种情感的共鸣会让你仿佛置身于角色的世界中，无法自拔。\n💡小提示：玩这个本的时候，一定要认真阅读剧本，注意每一个细节，包括人物的外貌描写、语言习惯等，这些都可能成为推理的关键。在讨论环节，要积极与其他玩家交流，分享自己的线索和想法，团队合作才能更快地揭开真相。","source":"network","createdAt":1794216733507}],"rating":{"avg":0,"count":0,"total":1}},{"id":"32c1d374-be98-4adf-b297-60d0b1db0c16","title":"漓川怪谈簿","cover":"uploads/1794216749864-9dbdfb60.jpg","genre":["日式","推理","本格"],"type":"盒装","playersMin":7,"playersMax":7,"male":0,"female":0,"duration":4.5,"difficulty":"新手","price":48,"memberPrice":0,"author":"","publisher":"","intro":"常世是这片土地的名字，也是土地中心那片诡异湖泊的名字。\n传说，这里的水土，不仅滋养了生活在这的百姓，也孕育出了无数怪谈故事中的精怪们。\n它们非人非鬼，是受到常世湖湖水影响而妖异化的产物。它们也不像话本里传的那样天生邪恶，大多只是生活的方式与对世界的认知与人类不同而已。\n但只要它们出现，就一定离不开各种“光怪陆离”。\n在这片湖泊的中心还有着一个叫做蜃气楼的建筑，像一艘大船，彻彻底底地悬于湖上。渔夫们曾潜入水中查看，却找不到任何一根用以支撑的柱子。\n不管水位因为天气如何变化，它都始终都会和水面保持着固定的距离。大家都对它感到好奇，却没人能够真的进去。\n所有人都知道蜃气楼是平将门大人的居所，早就下令，禁止任何人的通行。\n但今天，睁开双眼后，你们忽然发现自己居然正身处在这栋神秘的建筑里。平将门大人则惨死在了他紧锁的房间当中……","note":"","featured":false,"pinned":false,"heat":5,"createdAt":1794216749866,"updatedAt":1794216749866,"reviews":[],"rating":{"avg":0,"count":0,"total":0}},{"id":"ad961e25-6ba5-4ba2-b1a1-ac629d86bd7e","title":"X的迴旋","cover":"uploads/1794214919897-b519d951.jpg","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":0,"female":0,"duration":8.5,"difficulty":"进阶","price":78,"memberPrice":0,"author":"","publisher":"","intro":"一个个身怀守护意志的人以身作门，堵住裂隙，将黑雾与城市隔绝。他们立在那里，将自己与虚无关在一起。\n但数个日夜，饱受黑雾的折磨，即使是英雄也会疲倦迷失。必须要有人走进那扇门，赢下对决，然后告诉他们,那些已被岁月磨损、连他们自己都快要遗忘的——站在这里的理由。\n英雄拯救世界，我们拯救英雄。","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794214919898,"updatedAt":1794214919898,"reviews":[{"id":"14fcee82-5ca7-4555-89fa-d0748be0dc6d","scriptId":"ad961e25-6ba5-4ba2-b1a1-ac629d86bd7e","name":"网络玩家6","rating":0,"content":"这一段反转要打破两个不可能，逻辑有点绕，装来装去的，很难让玩家自主盘到这里，展会d也是扶了一点，必须打破前面的逻辑，顺着之前的不可能，再去圆回来。","source":"network","createdAt":1794214859899},{"id":"86a0078a-912f-4432-b59e-96aea998b53e","scriptId":"ad961e25-6ba5-4ba2-b1a1-ac629d86bd7e","name":"网络玩家5","rating":0,"content":"我认为的不足之处在于最后一案的反转逻辑，那一段dm挺难带的，基本上是顺着逻辑走走到最后，发现走不通，为什么狼必赢，因为这个点，有重新盘第一天反转，很红鲱鱼的一段。","source":"network","createdAt":1794214799899},{"id":"e15f2860-3ca7-4628-b220-2b1a55bae935","scriptId":"ad961e25-6ba5-4ba2-b1a1-ac629d86bd7e","name":"网络玩家4","rating":0,"content":"整个推理，围绕着做任务，投票票型，最后的结果进行，存在着大量果推因，但是逻辑还是挺硬的，喜欢果推因和信息差推理的可以玩。","source":"network","createdAt":1794214739899},{"id":"0e0e2bb8-0814-4a25-90ab-e8c0b1f4070a","scriptId":"ad961e25-6ba5-4ba2-b1a1-ac629d86bd7e","name":"网络玩家3","rating":0,"content":"最后一案将狼人杀的投票系统放大，平民思考量比王不见王多，王不见王里，除了冬野大我，其他npc的思考量几乎没有，完全就是人设机器，X的回旋里，每个人都有思考量，为什么这么投票，他的想法是什么。","source":"network","createdAt":1794214679899},{"id":"684bf340-265d-49ef-b00c-9e2f928b99bc","scriptId":"ad961e25-6ba5-4ba2-b1a1-ac629d86bd7e","name":"网络玩家2","rating":0,"content":"整个本的体验好坏，完全就是看最后一案能不能在线跟上，最后一案又更像是王不见王那种类型，但是，从某种程度来说，比王不见王更像狼人杀。","source":"network","createdAt":1794214619899},{"id":"f7188b23-c698-4f62-8a71-078e59d484fa","scriptId":"ad961e25-6ba5-4ba2-b1a1-ac629d86bd7e","name":"网络玩家1","rating":0,"content":"本的结构是三个破冰+一个超长案件，破冰案基本给这个案的玩法定调，依然是信息差智斗，偏向于鬼河那种模式。","source":"network","createdAt":1794214559899}],"rating":{"avg":0,"count":0,"total":6}},{"id":"3dfe52ca-cd40-4dac-a299-0957bbfdd14f","title":"鬼河怒放","cover":"uploads/1794214886141-0c984203.jpg","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":3,"female":3,"duration":9.5,"difficulty":"硬核","price":78,"memberPrice":0,"author":"","publisher":"","intro":"《鬼河怒放》以灵异存在“鬼河”溢出异界、诅咒红花镇为舞台，调查员小队为寻找失踪的第一小队深入禁区，遭遇会杀人的厉鬼与诡异的“死律”。玩家扮演六名高智谋的调查员，在无限流大逃杀中唯一信念是“活下去”。核心任务为：放弃上帝视角，完全代入局中人的思维，从NPC的对话、动作和行为逻辑中推理出真相，破解四个环环相扣的案件，在智斗与博弈中揭露鬼河背后的秘密，最终理解“怒放者”的意义。全程需8小时以上专注协作。","note":"","featured":true,"pinned":false,"heat":0,"createdAt":1794214886142,"updatedAt":1794214886142,"reviews":[{"id":"8252af21-0751-4181-8004-25f85011823e","scriptId":"3dfe52ca-cd40-4dac-a299-0957bbfdd14f","name":"网络玩家3","rating":0,"content":"纯硬核玩家的爽本，8小时全程无尿点。没有冗长的故事还原，只有纯粹的推理博弈。喜欢啃行为逻辑和细节的推土机必冲，2026年推理本的第一梯队。","source":"network","createdAt":1794214826143},{"id":"39f9d216-30b1-42e3-8ab4-af269e760454","scriptId":"3dfe52ca-cd40-4dac-a299-0957bbfdd14f","name":"网络玩家2","rating":0,"content":"到了灯塔案，脑子彻底烧干。多重假想层叠，差点以为要挂机了，结果队友一句“如果从TA的视角看”突然打通任督二脉。反转那一下全身发麻，前面埋的伏笔全都收回来了。虽然删掉了一些大核诡，但整体依然丝滑。","source":"network","createdAt":1794214766143},{"id":"5a0a4d1e-d398-44fb-aeab-7d75bdea120d","scriptId":"3dfe52ca-cd40-4dac-a299-0957bbfdd14f","name":"网络玩家1","rating":0,"content":"开局以为自己是边缘人，结果全员高智商，没人挂机。规则怪谈加大逃杀，对话里全是刀，每一句都要琢磨对方是不是在骗你。盘第一个视频案件时，我们盯着NPC抖烟灰的细节看了十分钟，结果真藏在里面。这种智斗太新鲜了，不是传统的密室和建筑诡计，而是活生生的人与人之间的博弈。","source":"network","createdAt":1794214706143}],"rating":{"avg":0,"count":0,"total":3}},{"id":"30781c9c-fed1-4bb8-8575-207bf10e257f","title":"死者在幻夜中醒来","cover":"uploads/1794214805619-7aecd131.jpg","genre":[],"type":"盒装","playersMin":7,"playersMax":7,"male":0,"female":0,"duration":6,"difficulty":"进阶","price":58,"memberPrice":0,"author":"","publisher":"","intro":"河流上，漂浮着许多载着烛光的纸船，在一片波浪中，摇曳成一片星星点点。这条看不到尽头的河流，将会流向彼岸。\n人们相信，如果烛光与船只一起到达了河流的尽头，两个世界的人就可能在幻夜之中再次相见。\n可是，扁舟一叶在浪花浮沉，许多纸船都随着波涛淹没在了河流之中。烛光熄灭，而折纸船的人，还等待着企盼之人的归来。\n我们曾无数次想要从河流溯洄，只乞求到达那一个虚无缥缈的彼岸。\n——《未见村民间故事》","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794214805620,"updatedAt":1794214805620,"reviews":[{"id":"20dbd667-d828-45dd-95d5-4f3205509b9c","scriptId":"30781c9c-fed1-4bb8-8575-207bf10e257f","name":"网络玩家2","rating":0,"content":"虽然说这个本是6-7人可开，但第七人完全可以被DM替代，体验感相对没有别的几位玩家热情高涨，最容易挂机的角色就是这个G了，不过还是更推荐7人开本，第7人让新手玩家上，对于剧情还原还是有很大作用的。","source":"network","createdAt":1794214745621},{"id":"8e257e3e-f3e8-40e4-8ff9-bb00ce357c86","scriptId":"30781c9c-fed1-4bb8-8575-207bf10e257f","name":"网络玩家1","rating":0,"content":"盒装的价格，城限的品质，诡计很硬，对叙诡有兴趣的硬核玩家冲，非常上头，开完这车队友立马吵着要组队去玩713。尽管有争议，但火是有道理的，论叙诡的应用，罗老师真的有两把刷子，这个逻辑思维和语言组织能力太厉害了，推理部分虽然比较简单，但是还原全部真相很难，从简到难，推理还原的难度层层递进。","source":"network","createdAt":1794214685621}],"rating":{"avg":0,"count":0,"total":2}},{"id":"4a1e1f94-5edc-44b2-85a8-44884e93cbc6","title":"双羽馆解体妄想","cover":"uploads/1794214672137-ebbb058e.jpg","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":3,"female":3," const coverPh=(s,big)=>{const g=GRADS[hashCode(s.id||s.title)%GRADS.length];
  return '<div class="cover-ph" style="background:linear-gradient(150deg,'+g[0]+','+g[1]+')"><div class="ph-title"'+(big?' style="font-size:22px"':'')+'>'+esc(s.title)+'</div><div class="ph-tag">'+esc((s.genre&&s.genre[0])||'剧本')+'</div></div>'};
const coverHtml=(s,big)=>s.cover?'<img src="'+esc(s.cover)+'" alt="'+esc(s.title)+'封面" loading="lazy" data-ph-title="'+esc(s.title)+'" data-ph-genre="'+esc((s.genre&&s.genre[0])||'剧本')+'">':coverPh(s,big);
document.addEventListener('error',(e)=>{const img=e.target;if(!(img instanceof HTMLImageElement)||!img.dataset.phTitle)return;
  const g=GRADS[hashCode(img.dataset.phTitle)%GRADS.length];const ph=document.createElement('div');ph.className='cover-ph';
  ph.style.background='linear-gradient(150deg,'+g[0]+','+g[1]+')';
  ph.innerHTML='<div class="ph-title">'+esc(img.dataset.phTitle)+'</div><div class="ph-tag">'+esc(img.dataset.phGenre||'剧本')+'</div>';img.replaceWith(ph);},true);

const state = { q:'', genre:'', type:'', players:'', sort:'new' };
const PF=[{key:'',label:'全部人数'},{key:'le5',label:'≤5人'},{key:'6',label:'6人'},{key:'7',label:'7人'},{key:'8',label:'8人'},{key:'ge8',label:'8人+'}];

function listScripts(){
  const kw=state.q.trim().toLowerCase();
  let l=SITE.scripts.filter(s=>{
    if(kw&&!(s.title+'\n'+(s.author||'')+'\n'+(s.publisher||'')+'\n'+(s.intro||'')).toLowerCase().includes(kw))return false;
    if(state.genre&&!s.genre.includes(state.genre))return false;
    if(state.type&&s.type!==state.type)return false;
    if(state.players==='le5'&&s.playersMax>5)return false;
    if(['6','7','8'].includes(state.players)&&!(s.playersMin<=+state.players&&s.playersMax>=+state.players))return false;
    if(state.players==='ge8'&&s.playersMin<8)return false;
    return true;});
  if(state.sort==='priceAsc')l.sort((a,b)=>a.price-b.price);
  else if(state.sort==='priceDesc')l.sort((a,b)=>b.price-a.price);
  else if(state.sort==='players')l.sort((a,b)=>b.playersMax-a.playersMax);
  else if(state.sort==='rating')l.sort((a,b)=>(b.rating.avg||0)-(a.rating.avg||0));
  else l.sort((a,b)=>(b.pinned-a.pinned)||(b.createdAt-a.createdAt));
  return l;
}
const chipRow=(items,cur)=>items.map(it=>'<button class="chip'+(cur===it.key?' on':'')+'" data-pick="'+esc(it.key)+'">'+esc(it.label)+'</button>').join('');

function renderHome(){
  const c=SITE.config, list=listScripts(), pinned=SITE.scripts.filter(s=>s.pinned);
  const cards=list.map(s=>'<a class="card'+(s.pinned?' is-pinned':'')+'" href="#/d/'+esc(s.id)+'"><div class="cover">'+coverHtml(s)+'</div><div class="info">'+
    '<div class="title-row"><span class="title">'+esc(s.title)+'</span>'+badge(s.type)+(s.pinned?'<span class="pin-flag">📌</span>':(s.featured?'<span class="fire">🔥</span>':''))+'</div>'+
    '<div class="tags">'+s.genre.map(g=>'<span class="tag">'+esc(g)+'</span>').join('')+'</div>'+
    '<div class="meta">'+fmtPlayers(s)+(fmtGender(s)?' · '+fmtGender(s):'')+' · '+fmtDuration(s)+' · '+esc(s.difficulty)+'</div>'+
    '<div class="bottom">'+fmtPrice(s)+'<span class="rate-wrap"><span class="rate">'+(s.rating.count?starsHtml(s.rating.avg,s.rating.count):'<span class="rate none">暂无评分</span>')+'</span></span></div></div></a>').join('');
  app.innerHTML='<div class="page">'+
   '<header class="topbar"><div class="brand"><div class="logo">🎭</div><div><h1>'+esc(c.storeName)+'</h1><div class="slogan">'+esc(c.slogan||'今晚，来一场好局')+'</div></div></div>'+
   '<div class="total"><span class="online-badge">线上版</span><br>共<b>'+SITE.scripts.length+'</b>本</div></header>'+
   (c.announcement?'<div class="notice"><span class="icon">📢</span><span class="txt">'+esc(c.announcement)+'</span></div>':'')+
   '<div class="search"><input id="q" type="search" placeholder="搜索剧本名 / 作者 / 发行" value="'+esc(state.q)+'"></div>'+
   '<div class="chip-row" data-group="type">'+chipRow([{key:'',label:'全部'}].concat(TYPES.map(t=>({key:t,label:t}))),state.type)+'</div>'+
   '<div class="chip-row" data-group="genre">'+chipRow([{key:'',label:'全部题材'}].concat(G.map(g=>({key:g,label:g}))),state.genre)+'</div>'+
   '<div class="chip-row" data-group="players">'+chipRow(PF,state.players)+'</div>'+
   '<div class="sort-row"><span>筛选结果：'+list.length+' 本</span><select id="sort">'+
     ['new|最新上架','rating|评分最高','priceAsc|价格从低到高','priceDesc|价格从高到低','players|人数最多'].map(o=>{const[v,n]=o.split('|');return '<option value="'+v+'"'+(state.sort===v?' selected':'')+'>'+n+'</option>'}).join('')+'</select></div>'+
   (pinned.length?'<section class="rec"><div class="sec-title">📌 店长推荐</div><div class="rec-scroll">'+pinned.map(s=>
     '<a class="rec-card" href="#/d/'+esc(s.id)+'"><div class="rec-cover">'+coverHtml(s)+'</div><div class="rec-name">'+esc(s.title)+'</div><div class="rec-sub">'+fmtPlayers(s)+' · '+esc(s.type)+'</div><div class="rec-price">¥'+esc(s.price)+'<small>/人</small></div></a>').join('')+'</div></section>':'')+
   '<div class="sec-title plain">📚 全部剧本</div><main class="list">'+(cards||'<div class="empty"><div class="big">🎭</div>没有找到符合条件的剧本</div>')+'</main>'+
   '<div class="site-foot">本页为线上浏览版 · 更新于 '+fmtDate(SITE.generatedAt)+'<br>写评价 / 组局预约请到店或 <a href="javascript:void(0)" id="foot-contact">联系店家</a></div></div>';
  $('#q').addEventListener('input',e=>{state.q=e.target.value;const p=e.target.selectionStart;renderHome();const q2=$('#q');q2.focus();q2.setSelectionRange(p,p);});
  $$('.chip').forEach(b=>b.addEventListener('click',()=>{state[b.closest('.chip-row').dataset.group]=b.dataset.pick;renderHome();}));
  $('#sort').addEventListener('change',e=>{state.sort=e.target.value;renderHome();});
  const fc=$('#foot-contact');if(fc)fc.addEventListener('click',()=>copyContact());
}

function copyContact(){
  const t=SITE.config.contact||'';
  if(!t)return toast('店家暂未填写联系方式');
  if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast('已复制：\n'+t),()=>toast(t));else toast(t);
}

function renderDetail(id){
  const s=SITE.scripts.find(x=>x.id===id);
  if(!s){location.hash='#/';return;}
  const gen=fmtGender(s);
  const cells=[{k:'人数',v:fmtPlayers(s)+(gen?'<div class="k" style="margin-top:2px">'+esc(gen)+'</div>':'')},{k:'时长',v:fmtDuration(s)},{k:'难度',v:esc(s.difficulty)},{k:'类型',v:esc(s.type)},{k:'发行',v:esc(s.publisher)||'—'},{k:'作者',v:esc(s.author)||'—'}];
  if(s.heat>0)cells.push({k:'网络热度',v:'★'.repeat(s.heat),gold:true});
  const revHtml=s.reviews.length?s.reviews.map(r=>'<div class="review"><div class="rv-avatar" style="background:'+GRADS[hashCode(r.name)%GRADS.length][1]+'">'+esc((r.name||'匿').trim()[0]||'匿')+'</div><div class="rv-main"><div class="rv-head"><span class="rv-name">'+esc(r.name)+'</span>'+(r.source==='network'?'<span class="rv-src net">网络</span>':'<span class="rv-src">玩家</span>')+(r.source==='local'?starsHtml(r.rating):'')+'<span class="rv-time">'+fmtDate(r.createdAt)+'</span></div><div class="rv-content">'+esc(r.content)+'</div></div></div>').join(''):'<div class="rv-empty">还没有评价，来店里体验后给个评价吧～</div>';
  app.innerHTML='<div class="page"><button class="back-btn" id="back">←</button>'+
   '<div class="d-hero">'+coverHtml(s,true)+'<div class="shade"></div></div>'+
   '<div class="d-head"><div class="title">'+esc(s.title)+' '+badge(s.type)+(s.pinned?'<span class="pin-flag">📌 店长推荐</span>':(s.featured?'<span class="fire">🔥 热本</span>':''))+'</div>'+
   '<div class="sub">'+s.genre.map(g=>'#'+esc(g)).join(' ')+'　·　上架于 '+fmtDate(s.createdAt)+'</div></div>'+
   '<div class="d-grid">'+cells.map(m=>'<div class="d-cell"><div class="k">'+esc(m.k)+'</div><div class="v'+(m.gold?' gold':'')+'">'+m.v+'</div></div>').join('')+'</div>'+
   '<div class="d-section"><h3>剧本简介</h3><div class="body">'+esc(s.intro||'简介暂未填写～')+(s.note?'<div class="d-note">📌 '+esc(s.note)+'</div>':'')+'</div></div>'+
   '<div class="d-section"><h3>玩家评价</h3>'+
   '<div class="rating-card"><div class="rc-left"><div class="rc-avg">'+(s.rating.count?s.rating.avg.toFixed(1):'—')+'</div><div class="rc-stars">'+starsHtml(s.rating.avg)+'</div><div class="rc-count">'+(s.rating.count?s.rating.count+' 位玩家评分':'还没有玩家评分')+(s.rating.total>s.rating.count?' · '+(s.rating.total-s.rating.count)+' 条网络评价':'')+'</div></div></div>'+
   '<div class="rv-note">线上版暂不支持写评价，到店体验后即可提交 ✍️</div>'+revHtml+'</div>'+
   '<div class="d-footer"></div>'+
   '<div class="price-bar"><div>'+fmtPrice(s)+'</div><button class="contact-btn" id="copy-contact">联系店家预约</button></div></div>';
  $('#back').addEventListener('click',()=>location.hash='#/');
  $('#copy-contact').addEventListener('click',copyContact);
}

window.addEventListener('hashchange',()=>{window.scrollTo(0,0);const h=location.hash||'#/';const m=h.match(/^#\/d\/([\w-]+)$/);m?renderDetail(m[1]):renderHome();});
renderHome();

/* ================= 线上版开屏（与店内核算一致：有图用图，无图雾气动效） ================= */
(function(){
  if(sessionStorage.getItem('splashSeen'))return;
  const c=SITE.config,ov=document.createElement('div');
  ov.className='splash'+(c.splashImage?' has-img':'');
  if(c.splashImage){const bg=document.createElement('div');bg.className='sp-bg';bg.style.backgroundImage="url('"+c.splashImage+"')";ov.appendChild(bg);}
  else ['a','b','c'].forEach(k=>{const f=document.createElement('div');f.className='sp-fog '+k;ov.appendChild(f);});
  const sh=document.createElement('div');sh.className='sp-shade';ov.appendChild(sh);
  const inner=document.createElement('div');inner.className='sp-inner';
  inner.innerHTML='<div class="sp-logo">🎭</div><h1 class="sp-title">'+esc(c.storeName)+'</h1><p class="sp-slogan">'+esc(c.slogan||'今晚，来一场好局')+'</p>';
  const en=document.createElement('div');en.className='sp-enter';en.textContent='轻触屏幕 · 进入本单';
  ov.append(inner,en);
  ov.addEventListener('click',()=>{sessionStorage.setItem('splashSeen','1');ov.classList.add('out');setTimeout(()=>ov.remove(),650);},{once:true});
  document.body.appendChild(ov);
})();
</script>
</body>
</html>
