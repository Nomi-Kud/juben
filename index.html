:"一开始的破冰就把人吸引住了，题材及其有意思，6个小时左右的酣畅淋漓绝对没有掉线的困扰，盘的时候一点都不干涩哦，还非常的丝滑~","source":"network","createdAt":1794219172078}],"rating":{"avg":0,"count":0,"total":2}},{"id":"0bb2e9f0-bc56-4534-89c4-f1b3e360d2d9","title":"幻想诸因","cover":"uploads/1794219252439-b5ab3bf9.jpg","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":3,"female":3,"duration":8,"difficulty":"进阶","price":68,"memberPrice":0,"author":"","publisher":"","intro":"《幻想诸因》以“曼彻斯特俱乐部”的侦探生死挑战为舞台，六名失去记忆的玩家被困异国建筑，在笑声与悬念交织的氛围中，必须破解风格迥异的连环谜案——从涂鸦画作中的骇人秘密，到emoji暗藏的逻辑迷阵，再到颠覆想象的“狼人杀”式对决。核心任务为：在7小时左右的协作中，通过四大趣味案件收集伏线，抽丝剥茧还原跨越数代的扭曲羁绊，并区分真实与“幻想”的边界，最终揪出潜伏在众人之间的幕后主谋，直面地狱级反转背后的人性寓言。","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794219252442,"updatedAt":1794219252442,"reviews":[{"id":"be7d07b4-4ef3-448f-8c33-d5978ee4c0e0","scriptId":"0bb2e9f0-bc56-4534-89c4-f1b3e360d2d9","name":"网络玩家3","rating":0,"content":"阅读量不大但信息密度超高，没有堆设定和做题感，每个环节都在玩新花样。难度进阶但过程丝滑，推理还原五五开，喜欢欢乐+变态+逻辑闭环的可以直接冲。火舞猫老师确实有点东西，这应该是今年让我玩得最爽的进阶本。","source":"network","createdAt":1794219192447},{"id":"65a45568-076f-432a-8b79-6bb72c3e1932","scriptId":"0bb2e9f0-bc56-4534-89c4-f1b3e360d2d9","name":"网络玩家2","rating":0,"content":"本以为案件结束就轻松了，结果还原阶段吃瓜吃到自己角色身上……那些欢乐的幻觉搜证，最后全变成扎心的刀。反转那刻整车安静了十秒，然后集体爆发出“卧槽”。7个半小时咻一下就没了，我嗓子都喊哑了。","source":"network","createdAt":1794219132447},{"id":"f128ab93-e722-4d6b-aba7-b4f89c93d1e1","scriptId":"0bb2e9f0-bc56-4534-89c4-f1b3e360d2d9","name":"网络玩家1","rating":0,"content":"开本前以为是普通侦探游戏，结果第一案涂鸦推理直接把我CPU干烧了——三张小孩画里藏凶案，这种玩法真没见过！emoji推理那趴我们整车笑到拍桌，对着🐸🐝🐍解码解出杀人路线，dm说对的时候全车起立鼓掌。狼人杀环节更是绝了，盘着盘着突然反转，我直接从椅子上弹起来：“还能这样？！”","source":"network","createdAt":1794219072447}],"rating":{"avg":0,"count":0,"total":3}},{"id":"76d6cb4e-cab3-45b2-ae26-8d944f396e0d","title":"幻方馆谋杀奇境","cover":"uploads/1794219216328-f2538928.jpg","genre":[],"type":"盒装","playersMin":6,"playersMax":6,"male":0,"female":0,"duration":5.5,"difficulty":"进阶","price":58,"memberPrice":0,"author":"","publisher":"","intro":"👨红谷拓也\n👨武藤孝太\n👨竹间英助\n👩红谷雅美\n👩武藤枫\n👩竹间明日香","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794219216329,"updatedAt":1794219216329,"reviews":[{"id":"53836433-024b-466d-8924-b2729161ab9c","scriptId":"76d6cb4e-cab3-45b2-ae26-8d944f396e0d","name":"网络玩家3","rating":0,"content":"🎉推荐程度：\n整体游戏时长约5.5-6.5小时，适合硬核玩家。对于DM来说，需要深入理解所有设定和案件，以确保玩家能够更顺畅地推理。此剧本预计将在7月中下旬发货，预计开分会有8.5以上，绝对值得期待！","source":"network","createdAt":1794219156330},{"id":"55abf79c-bc2d-49ba-bf0a-2d688e28a396","scriptId":"76d6cb4e-cab3-45b2-ae26-8d944f396e0d","name":"网络玩家2","rating":0,"content":"📖阅读体验：\n虽然阅读量不大，但案件的设定和推理过程相当烧脑。每个案件都有独特的背景设定，且剧情紧凑，保证玩家全程投入。","source":"network","createdAt":1794219096330},{"id":"ca28618c-9f64-4754-acc8-427b7815c40d","scriptId":"76d6cb4e-cab3-45b2-ae26-8d944f396e0d","name":"网络玩家1","rating":0,"content":"🔐推理难度：\n此剧本推理难度极高，达到9.5分。案件设置巧妙，动线密室和强设定让玩家欲罢不能。首个案件就耗时两小时，且存在唯一解，考验玩家的逻辑思维。","source":"network","createdAt":1794219036330}],"rating":{"avg":0,"count":0,"total":3}},{"id":"22991d9c-577d-482a-beaf-95f907fa30a6","title":"立方馆谋杀始末","cover":"uploads/1794219191128-926bd9a6.png","genre":[],"type":"盒装","playersMin":6,"playersMax":6,"male":0,"female":0,"duration":5.5,"difficulty":"进阶","price":58,"memberPrice":0,"author":"","publisher":"","intro":"近日，警方在位于无人区的著名建筑「立方馆」中发现六具尸体，据调查均为前段时间一同前往立方馆的三男三女，全部遇难，无人生还。\n与此同时，天国之上，一位喜欢看推理小说的大天使，将这场无人生还的惨案，做成了推理游戏，祂呈现了六名死者的当时回忆，作为一次天国的考核。六名小天使们接到考核，要通过回忆帮助人类寻找难以找到的真相，而在推理的过程中，小天使们发现除了接二连三的杀人事件之外，在这些文字内容之中，竟藏有大天使绞尽脑汁设置的谜题.","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794219191129,"updatedAt":1794219191129,"reviews":[{"id":"da782cf7-dcea-4b69-9c48-1c490578cb18","scriptId":"22991d9c-577d-482a-beaf-95f907fa30a6","name":"网络玩家4","rating":0,"content":"在这神秘建筑中，一切都变幻莫测，推理需要遵循强设定，挑战玩家的空间想象力。","source":"network","createdAt":1794219131129},{"id":"751099a0-8edc-4e00-a54f-bb69906ba430","scriptId":"22991d9c-577d-482a-beaf-95f907fa30a6","name":"网络玩家3","rating":0,"content":"故事以在无人区的“立方馆”中发现六具尸体为引子，参与者需要从死者回忆中找寻线索，破解一个个谜题。","source":"network","createdAt":1794219071129},{"id":"bd00f759-7655-4431-92a8-c0d02a25b20c","scriptId":"22991d9c-577d-482a-beaf-95f907fa30a6","name":"网络玩家2","rating":0,"content":"适合6人参与，时长为6-8小时。这场剧本杀将玩家带入立方馆，展开一场令人惊叹的多重解谜之旅。","source":"network","createdAt":1794219011129},{"id":"40c096c5-9a3e-4117-91c7-b075ac5f3046","scriptId":"22991d9c-577d-482a-beaf-95f907fa30a6","name":"网络玩家1","rating":0,"content":"由隐匿角色发行的《立方馆谋杀始末》剧本杀，以日式硬核、双核诡、多重解答、情感、新本格为主题。","source":"network","createdAt":1794218951129}],"rating":{"avg":0,"count":0,"total":4}},{"id":"759deea0-c0b8-467c-9941-b7214fcb4390","title":"红黑馆事件","cover":"uploads/1794219171788-28ad3319.jpg","genre":["剧本简介","三个密室","九个手法"],"type":"盒装","playersMin":6,"playersMax":6,"male":3,"female":3,"duration":6.5,"difficulty":"硬核","price":58,"memberPrice":0,"author":"","publisher":"","intro":"菠萝头的盛宴，推理玩家的狂欢，三个密室，九个手法，四重解答。\n2001年11月，警方接到望渔村的一名女性报警，到达现场时发现红黑馆已被大火烧毁，只剩下了一片废墟，废墟中有3具焦尸。随后，警方在红黑馆外的悬崖下挖出另外5具尸体，死因都是坠崖而亡。不久后报案人病逝，这起案件几经调查也没有结果，便成了悬案，被知情人称作“红黑馆事件”。\n2021年，渔民在海里发现6个系在一起的漂流瓶，里面竟是当年红黑馆最后活着的6人写下的手记，20年前那埋藏已久的真相即将被揭开……","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794219171790,"updatedAt":1794219171790,"reviews":[],"rating":{"avg":0,"count":0,"total":0}},{"id":"9c192483-9f0e-4f0d-bf2b-c914889caeab","title":"壬辰倭乱","cover":"uploads/1794219058595-03524ab6.jpg","genre":["机制","阵营","激战数月"],"type":"城限","playersMin":7,"playersMax":7,"male":3,"female":4,"duration":7,"difficulty":"进阶","price":68,"memberPrice":0,"author":"","publisher":"","intro":"1592年，丰臣秀吉以武力统一日本后，悍然发兵十四万入侵朝鲜，在两个月内便占领了朝鲜全境。之后，丰臣秀吉将朝鲜切成八份，分给了魔下八个军团的首领。\n在朝鲜国王的再三乞求之下，身为宗主国的明朝决定出兵援助朝鲜复国。明军跨过鸭绿江，激战数月，先后收复了平壤和汉城。与此同时，朝鲜境内起义军四起，日军诸将无心再战，纷纷从自己的领地撤出，准备返日。只有一支日军部队，非但没有撤军，反而在长白山脚下建起了一座名为小谷城的日式城堡，负隅顽抗。于是，明军主力和朝鲜起义军将这座小谷城团团围住，决战一触即发……","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794219058596,"updatedAt":1794219058596,"reviews":[],"rating":{"avg":0,"count":0,"total":0}},{"id":"358f7584-7368-46e6-9f41-f238ee09077a","title":"官渡","cover":"uploads/1794219043444-0d5ce7ea.jpg","genre":[],"type":"盒装","playersMin":8,"playersMax":8,"male":0,"female":0,"duration":5,"difficulty":"进阶","price":48,"memberPrice":0,"author":"","publisher":"","intro":"皇帝昏聩无能，宦官专权，\n朝廷腐败，百姓苦不堪言，\n爆发了黄巾起义，\n在镇压起义过程中，各地军阀趁机扩张势力，\n纷起争雄，乱世之中，英雄人物竞相涌现。\n经过一系列大战之后，曹操一统中原，定都许昌，挟天子以令诸侯。\n袁绍则手握黄河以北青幽并翼四州，与曹操隔河相望。\n公元199年，相互制衡之势维持了五年之后，战争终于打响。\n双方大军在官渡对峙，一时剑拔弩张。\n此时一队袁军使臣却来到了许昌曹府，故事便发生在这里……","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794219043444,"updatedAt":1794219043444,"reviews":[],"rating":{"avg":0,"count":0,"total":0}},{"id":"cb2456d6-c13c-402e-913c-62592f3937e6","title":"白衣倾城2青山云海","cover":"uploads/1794218894343-3166c714.jpg","genre":["武侠","情感","机制","推荐人群","进阶玩家","推土机"],"type":"城限","playersMin":7,"playersMax":7,"male":4,"female":3,"duration":7,"difficulty":"进阶","price":68,"memberPrice":0,"author":"","publisher":"","intro":"","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794218894343,"updatedAt":1794218894343,"reviews":[],"rating":{"avg":0,"count":0,"total":0}},{"id":"1a36b3a3-ea60-4c83-9e4a-946bcc270727","title":"白衣倾城","cover":"uploads/1794218875611-a13bc6e3.jpg","genre":["武侠","情感","机制","本格"],"type":"城限","playersMin":8,"playersMax":8,"male":0,"female":0,"duration":7,"difficulty":"进阶","price":68,"memberPrice":0,"author":"","publisher":"","intro":"","note":"","featured":false,"pinned":false,"heat":5,"createdAt":1794218875612,"updatedAt":1794218875612,"reviews":[{"id":"4921e5cc-623b-4b29-9264-16b60fbe6476","scriptId":"1a36b3a3-ea60-4c83-9e4a-946bcc270727","name":"网络玩家2","rating":0,"content":"玩家还原整个故事难度很大，前期人为会刻意隐藏，信息变得难以还原，而还原对于整个剧本来说却不重要。最让人感觉惊奇的是玩家剧本竟然是有目录的，很便于玩家寻找自己的线索。游戏体验会因拿到的角色而不同，但不存在非常边缘的角色，剧本机制是非常有指向性的，会刺激玩家去还原剧本，不会让你觉得没事干，最后的决战机制也让人感到非常的爽快。","source":"network","createdAt":1794218815613},{"id":"48e4a3e7-0357-4b1b-8dba-70e2480f23bd","scriptId":"1a36b3a3-ea60-4c83-9e4a-946bcc270727","name":"网络玩家1","rating":0,"content":"在《白衣倾城》的中间过程中，不会感受到无聊，整个故事的信息量巨大。八个人物，每个人物背后都有着庞大的支线和反转。作者还在剧本中时不时地给玩家反转和刺激，让你在想走神时又能瞬间提起兴趣。","source":"network","createdAt":1794218755613}],"rating":{"avg":0,"count":0,"total":2}},{"id":"9473891a-a045-414f-8f1b-40b4e1539006","title":"怪谈事务所破界","cover":"uploads/1794217620422-4fd410d0.jpg","genre":["悬疑","机制","怪诞","养成","打斗阵营","剧本简介"],"type":"城限","playersMin":6,"playersMax":6,"male":3,"female":3,"duration":10,"difficulty":"进阶","price":78,"memberPrice":0,"author":"","publisher":"","intro":"千余年间，一直流传着这样一个传说，有一个不存在的组织，在掌控着这个世界所有的异常，只要某种现象超出了人类现有知识体系的认知，就会被这个组织抹除。但遗憾的是，这个组织并没有在任何史书中留有痕迹，只是坊间被称为诡居，英文则更加隐晦，称其为“The Place”。\n这个神秘的组织在全球各地都有自己的分部，而到了如今的世代，更多人将其称为事务所。事务所的成员全是分部事务所主管亲自挑选的，没有特定的标准，理由，甚至条件，总部对于各个分部人员挑选，也没有干预的权力。\n日本地区事务所的主管悠斗先生，面临着巨大的挑战。二十年前，他临危接任，事务所的全体成员和前任主管，竟然在一个事件的解决中集体失踪，他必须尽快补充成员，重新支撑日本地区的异常事件管控工作。\n但是他的选人，却充满了争议，甚至直接接到了总部的警告和罚单，然而他置若罔闻，二十年间，经过不懈努力，依然将这六个充满争议的危险人物招入麾下，而我们的故事就从这里开始。","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794217620423,"updatedAt":1794217620423,"reviews":[],"rating":{"avg":0,"count":0,"total":0}},{"id":"3ca61fdb-7786-4504-9226-ad457c20779a","title":"第7号嫌疑人","cover":"uploads/1794217569505-d1392181.png","genre":[],"type":"盒装","playersMin":6,"playersMax":6,"male":0,"female":0,"duration":5,"difficulty":"新手","price":48,"memberPrice":0,"author":"","publisher":"","intro":"","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794217569506,"updatedAt":1794217569506,"reviews":[{"id":"2412c6cc-3384-482f-97d2-f57d932d83fc","scriptId":"3ca61fdb-7786-4504-9226-ad457c20779a","name":"网络玩家","rating":0,"content":"第7号嫌疑人这个剧本刚一面试， 就成为了硬核本格推理剧本的教科书式代表。对于喜欢在蛛丝马迹中窥见真相的硬核推理玩家，绝对是再合适不过了。福尔摩斯们，快来约起吧！","source":"network","createdAt":1794217509507}],"rating":{"avg":0,"count":0,"total":1}},{"id":"5eefe3cc-917e-4b23-8a32-b1edb75c4426","title":"六角馆の谋杀鉴赏","cover":"uploads/1794217545402-9d3857cf.jpg","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":4,"female":2,"duration":8,"difficulty":"进阶","price":68,"memberPrice":0,"author":"","publisher":"","intro":"《六角馆谋杀鉴赏》设定为纯推理新本格剧本杀游戏，基于太平洋私人岛屿上的六角馆，包含六个环形连接主题房间（金、木、水、火、土、光）。玩家扮演收到匿名邀请函的犯罪爱好者，暴雨夜登岛后被困馆内。游戏开局通过管家身份测试（6个问答验证初始设定），核心聚焦火之间密室谋杀案——凌晨三点尸体心脏插有本应存放水之间的青铜匕首，广播宣布进入暴风雪山庄模式。玩家需依据机械条件（如路程固定10分钟）还原元素闭环诡计，过程禁止假设额外尸体或道具，时长约8小时。","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794217545403,"updatedAt":1794217545403,"reviews":[{"id":"a4bf7107-cf7d-4640-8f29-12d6687c3dc0","scriptId":"5eefe3cc-917e-4b23-8a32-b1edb75c4426","name":"网络玩家3","rating":0,"content":"最后阶段DM突然关闭所有照明，仅用紫外线手电照射我们整理的线索墙。原本杂乱无章的便签在蓝光下显现出隐藏的数字矩阵，这个设计巧妙到让人忍不住鼓掌。虽然最终还原时我的大脑已经过载，但看着新井直人玩家颤抖着拼完最后块拼图时，突然理解了什么叫”献给满分的名侦探”。","source":"network","createdAt":1794217485404},{"id":"bd5eb843-b73d-4c40-bd86-3def12341fb1","scriptId":"5eefe3cc-917e-4b23-8a32-b1edb75c4426","name":"网络玩家2","rating":0,"content":"中期北山诚一提出的”第七房间”假说堪称神来之笔。我们围着实木模型反复拆解，突然发现所有死亡位置连成的虚线，恰好是建筑图纸上被刻意模糊的接缝走向。那种头皮发麻的顿悟感，让原本昏昏欲睡的深夜车瞬间清醒。","source":"network","createdAt":1794217425404},{"id":"0561fab4-59bc-4cea-b273-1ffc1701a16e","scriptId":"5eefe3cc-917e-4b23-8a32-b1edb75c4426","name":"网络玩家1","rating":0,"content":"作为相泽翡翠的扮演者，我至今记得DM递来那份烫金邀请函时指尖的颤栗。开场破冰案里那个会”呼吸”的建筑模型，让我们车瞬间进入状态——当小岛浩一突然发现模型底座暗格里的齿轮组，全车人同时倒吸冷气的场面至今难忘。","source":"network","createdAt":1794217365404}],"rating":{"avg":0,"count":0,"total":3}},{"id":"15172baf-f4ad-46c4-b8e3-9264d0a9a4d1","title":"玻璃屋","cover":"uploads/1794217519582-d0665a50.png","genre":["推理","现代","本格"],"type":"盒装","playersMin":7,"playersMax":7,"male":0,"female":0,"duration":5,"difficulty":"新手","price":48,"memberPrice":0,"author":"","publisher":"","intro":"二十一世纪中叶，人类科技文明飞跃，然而全球人口数量极速膨胀使得全球资源再次面临分配不均等重大难题，世界各国都在寻求可以解决这一矛盾的方法…… 这一天，位于香山之巅的乌洛山庄门口，早早等候在此的管家迎接着盛装出席的宾客们，山庄别墅内装饰有大量统一规格，绘有精美画作的玻璃，因此也得名“玻璃屋”，一年一度的感恩节宴会即将在此举办。精致的面容下，众人各自心怀叵测的眼神交错，却道出一丝气氛诡谲。 狰狞的佛像、帘后的女人、破碎的镜子，讲述着怎样血腥绝望的故事。 血字留言、残暴分尸、密室杀人，真相在燃烧的别墅里灰飞烟灭……","note":"","featured":false,"pinned":false,"heat":5,"createdAt":1794217519583,"updatedAt":1794217519583,"reviews":[{"id":"86a7d155-9134-47fe-8786-24aa86e8be06","scriptId":"15172baf-f4ad-46c4-b8e3-9264d0a9a4d1","name":"网络玩家","rating":0,"content":"整个故事是以一个奇奇怪怪的剧情开始的，翻开第一幕的你，可能是一头雾水。大部分玩家一开始肯定都是一脸疑惑小心翼翼，不敢多说话，至少我当时作为玩家的时候就是这种感觉，生怕说错话而暴露了什么不该说的事情。 前半部分剧情基本以小剧场的形式呈现给大家，创意很新颖，让所有的玩家很快的带入人物人设和作者所创作的剧本故事里面。作者的对每一个人的描写都很细腻，7个人物没有边缘角色，每个玩家的剧本的信息量分配比较平均，不会出现几个玩家挂机还能继续盘的情况。","source":"network","createdAt":1794217459584}],"rating":{"avg":0,"count":0,"total":1}},{"id":"e1394242-1427-4660-8280-42abe3cd4eb7","title":"猎人笔记雪夜","cover":"uploads/1794217387648-e6a171c6.jpg","genre":[],"type":"城限","playersMin":7,"playersMax":7,"male":0,"female":0,"duration":6,"difficulty":"进阶","price":78,"memberPrice":0,"author":"","publisher":"","intro":"红石镇，位于得克萨斯州旁的新墨西哥州，坐落于绵延的落基山脉脚下。\n小镇的名字源自于印第安部落。\n此处诸多山脉高耸入云，白雪覆顶。\n覆压百里，隔天断世。\n秃鹫在山顶盘旋，薄雾中都是水汽的味道，落在鼻尖上也有淡淡的凉意。\n入夜，整个红石镇街道上空无一人，镇民们早早封锁了自家的屋子，像是约定好一般足不出户。\n风滚草在地上发出淡淡的“沙沙”声。这一切都静的异常。\n今天注定是个载入史册的日子。\n迎着月色，小镇外多方人马由远及近。\n马蹄声如野兽奔腾，飞沙走石。\n人群，黑影，踢踏声。\n枪火，硝烟，碎片声。\n充斥着镇里的每一个角落。\n酒馆老板躲在吧台后望着拨动的怀表喃喃自语:“浸漫长夜，我看不清灯，也看不见人。”\n“看到的，只有无尽黑暗和一抹白雪。’\n“雪夜将至，当心小命。”","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794217387648,"updatedAt":1794217387648,"reviews":[],"rating":{"avg":0,"count":0,"total":0}},{"id":"3f61e872-a221-4556-9f10-9926e16b3b83","title":"天命难违","cover":"uploads/1794217341786-1387a619.jpg","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":3,"female":3,"duration":10,"difficulty":"进阶","price":78,"memberPrice":0,"author":"","publisher":"","intro":"《天命难违》以东极村南边码头六座神庙为舞台，六颗黄金头骨同时降临六座大殿，“见证人”无死角全程监控，村民陷入“天罚”恐慌。玩家扮演天门侦学堂六名学子（桐遥/侧翎等），需破解六个以简单设定为基础的高密度密室案件，经历三重逻辑反转，从精密动线与时间线中剔除红鲱鱼，还原连环诡计背后的合作真相。核心任务为：运用头骨技能与核心设定，理清每一次伪解答的漏洞，抽丝剥茧找出唯一真解，最终揭示东极村破除天命诅咒的完整过程。","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794217341787,"updatedAt":1794217341787,"reviews":[{"id":"554a6845-e869-4266-aaa0-5b2579d2fa2d","scriptId":"3f61e872-a221-4556-9f10-9926e16b3b83","name":"网络玩家3","rating":0,"content":"纯硬核细糠，体量真的大，我们打了近十一个小时但没觉得拖沓。设定就两页纸，复用率极高，没有废设定。适合愿意耐心啃动线、不怕反复推翻的长逻辑玩家。新手、还原党、受不了红鲱鱼的慎入。找个靠谱dm很重要，不然容易卡死在误导里。打完只有一个念头：灰烬，确实回来了。","source":"network","createdAt":1794217281788},{"id":"f51a8a71-9497-4270-8a0f-4758713f8001","scriptId":"3f61e872-a221-4556-9f10-9926e16b3b83","name":"网络玩家2","rating":0,"content":"反转来得猝不及防，前半场觉得盘明白了，后置线索一出来全变假象。最崩溃的是腾蛇第二重，十分钟绝对监控，我们借技能、算移动、画轨迹，卡了快两小时，最后还是靠dm扶了一把——但借贷那个思路出来后，集体起鸡皮疙瘩。第三重把所有案子串联成一张大网，之前的矛盾全变成伏笔，结局那段故事读得眼眶发酸。","source":"network","createdAt":1794217221788},{"id":"8b84297a-8ed4-4bca-9abd-e03e2c943db5","scriptId":"3f61e872-a221-4556-9f10-9926e16b3b83","name":"网络玩家1","rating":0,"content":"开篇就被按头画时间线，六个案子堆过来，第一遍看口供差点瞎了。朱雀案那个一分钟诡计，我们盯着庙宇地图反复比划，发现真相时整车拍桌。黄龙案真的吐了，光找谜面就花了四十分钟，望哥你是魔鬼吗？","source":"network","createdAt":1794217161788}],"rating":{"avg":0,"count":0,"total":3}},{"id":"83da30cd-538d-43ab-8692-9648ecfde7e4","title":"王不见王","cover":"uploads/1794217320559-cf4ecf1f.jpg","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":3,"female":3,"duration":10,"difficulty":"进阶","price":78,"memberPrice":0,"author":"","publisher":"","intro":"","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794217320560,"updatedAt":1794217320560,"reviews":[{"id":"63217eda-7c18-49fe-8ebf-19828719f6d2","scriptId":"83da30cd-538d-43ab-8692-9648ecfde7e4","name":"网络玩家4","rating":0,"content":"整个剧本像一部结构精巧的群像剧，十个角色个个都有心眼，剧情和推理结合得很紧密，不会觉得是在干巴巴做题。最后关于“王”的定义和循环真相的反转，把整个故事的立意又拔高了一层。不过很吃主持人对节奏和逻辑链的引导，如果带得好，体验能直接封神。","source":"network","createdAt":1794217260563},{"id":"d9fe6ca0-1b98-43d2-8616-ac665c0e4a4e","scriptId":"83da30cd-538d-43ab-8692-9648ecfde7e4","name":"网络玩家3","rating":0,"content":"推理部分完全是逻辑流玩家的狂欢。没有复杂的密室和手法，就是纯粹的行为逻辑链条推演。主持人会用线索和问题不断封堵掉可能性，逼着你从正反两个方向去验证，直到找到那个能满足所有条件的唯一解。盘出那个因为房间号误导导致的意外死亡点时，全场都有一种豁然开朗的快感。","source":"network","createdAt":1794217200563},{"id":"2f66e9e3-de7b-41f3-8398-9d63cd2d169c","scriptId":"83da30cd-538d-43ab-8692-9648ecfde7e4","name":"网络玩家2","rating":0,"content":"真正的博弈从分阵营开始就拉满了。你知道有两个人在暗处，但他们彼此不知道，这种设计让好人的推理和坏人的操作都充满了变数。每一轮讨论都像在下一盘大棋，不仅要算自己怎么赢，还得猜对面会怎么想，甚至要算对面觉得我会怎么想，层层递进的算计特别过瘾。","source":"network","createdAt":1794217140563},{"id":"283b6405-3075-461d-9b18-9f6742930f57","scriptId":"83da30cd-538d-43ab-8692-9648ecfde7e4","name":"网络玩家1","rating":0,"content":"开局就被抛进一个只有特征代号的世界，记忆是碎的，规则是新的，需要自己从信物和对话里把身份一点点扒出来。破冰环节就直接进入状态，盘人物关系和行为逻辑，感觉脑子还没热身就开始高速运转了。","source":"network","createdAt":1794217080563}],"rating":{"avg":0,"count":0,"total":4}},{"id":"4cf3b68d-c45d-4265-8c5c-42800be3b34e","title":"恶弈","cover":"uploads/1794217283903-ac43039d.jpg","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":6,"female":0,"duration":9.5,"difficulty":"硬核","price":78,"memberPrice":0,"author":"","publisher":"","intro":"《恶弈》以1995年东京为背景，佐仓秀治在通缉中翻开麻叶寄春遗留的小说，卷入井之头公园碎尸、八王子枪击、孕妇惨死及信息泄露等多起案件，玩家扮演佐仓秀治的六重人格，通过纯本格手法破解循环、救赎、魔警、坍缩四案，核心任务为运用逻辑排除与动线推演还原事件全貌，经历密室、叙诡与一案四解的硬核挑战，最终在思维殿堂中拼凑出恶人狩猎的真相。","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794217283904,"updatedAt":1794217283904,"reviews":[{"id":"9d737809-7e5c-4ea7-87d3-6c21d30e751c","scriptId":"4cf3b68d-c45d-4265-8c5c-42800be3b34e","name":"网络玩家3","rating":0,"content":"纯本格推理确实硬核，逻辑链环环相扣，软逻辑的地方不多，文本轻量却藏刀，细节复用率高，没拖沓的设定学习。只是末段还原稍显仓促，但整体丝滑，不堆后置线索就能自然反转，喜欢啃长逻辑的推土机会爽到。","source":"network","createdAt":1794217223905},{"id":"dd4b59e2-3e78-4eb2-b01d-ab0fbc084c08","scriptId":"4cf3b68d-c45d-4265-8c5c-42800be3b34e","name":"网络玩家2","rating":0,"content":"坍缩案阅读量炸裂，单搜演绎差点把眼珠子焊在文本上，口供和地图反复看，盘到后半夜满脑子都是死亡留言和密室手法。一案四解推出来时，全车嗷嗷喊合理，才发现开局那句“麻叶寄春纯粹是个混蛋”早埋了钩子。","source":"network","createdAt":1794217163905},{"id":"c414488a-593b-47b6-9ed5-d34a00c0d736","scriptId":"4cf3b68d-c45d-4265-8c5c-42800be3b34e","name":"网络玩家1","rating":0,"content":"开局以为是个边缘人，结果直接被按头当C位，抓小三破冰案把期待度拉满，三句话藏着五把刀，翻页都得提防被叙诡绊一跤。盘循环案时差点把黑板写成蜂窝煤，动线绕来绕去愣是盘出八百个心眼子，魔警案被车友一个点破真相时，鸡皮疙瘩窜上天灵盖。","source":"network","createdAt":1794217103905}],"rating":{"avg":0,"count":0,"total":3}},{"id":"32e15d58-5800-4fd0-ba84-26967e37a672","title":"因火成烟","cover":"uploads/1794217150989-e868bd3b.jpg","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":3,"female":3,"duration":7,"difficulty":"进阶","price":68,"memberPrice":0,"author":"","publisher":"","intro":"三个世界\n六个密室\n六十七个结果 一个原因\n火是烟的因\n烟是火的果 拨开烟雾\n寻因觅果","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794217150990,"updatedAt":1794217150990,"reviews":[{"id":"8837eef3-09cd-4e54-b36f-47d1e37a0aa0","scriptId":"32e15d58-5800-4fd0-ba84-26967e37a672","name":"网络玩家4","rating":0,"content":"整体体验：整体来说，《因火成烟》是一个非常适合放松心情、感受悬疑推理氛围的游戏。它让玩家在游戏中体验到了探索未知的刺激和角色扮演的乐趣。","source":"network","createdAt":1794217090991},{"id":"a5a579c8-33fa-40a4-9b1a-42654d8dfdf6","scriptId":"32e15d58-5800-4fd0-ba84-26967e37a672","name":"网络玩家3","rating":0,"content":"推理难度：推理难度中等，需要玩家具备一定的逻辑思维能力和观察力。游戏中的线索错综复杂，真假难辨，玩家需要通过仔细分析和推理，才能逐渐揭开火灾背后的真相。这种中等难度的推理挑战对于喜欢烧脑但又不想过于复杂的玩家来说是一种很好的体验。","source":"network","createdAt":1794217030991},{"id":"8a67beb1-353e-40eb-bc9d-a0ce458e861b","scriptId":"32e15d58-5800-4fd0-ba84-26967e37a672","name":"网络玩家2","rating":0,"content":"角色设定：角色设定鲜明生动，每个角色都有其独特的性格、背景和动机。消防员A的专业与勇敢、警察B的严谨与执着、记者C的好奇与追求、小镇居民D的朴实与恐惧、火灾幸存者E的脆弱与坚定、知情者F的神秘与莫测，这些角色设定使得游戏更加生动有趣。","source":"network","createdAt":1794216970991},{"id":"94df6aeb-4ed2-402e-a319-c6c488a0c71a","scriptId":"32e15d58-5800-4fd0-ba84-26967e37a672","name":"网络玩家1","rating":0,"content":"剧情方面：《因火成烟》的剧情紧凑且充满悬疑。从角色们开始接触这些火灾事件起，整个故事就充满了紧张和刺激。各种离奇的现象和神秘的事件接连不断，让玩家始终保持着高度的紧张和好奇。剧情的发展既有戏剧性，又有现实感，让玩家能够感同身受地体验到火灾的恐怖和调查的艰辛。","source":"network","createdAt":1794216910991}],"rating":{"avg":0,"count":0,"total":4}},{"id":"17607346-7c83-4e76-8a71-0ecce15f4af8","title":"元気少女从天而降","cover":"uploads/1794217133023-872928e6.jpg","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":2,"female":4,"duration":5,"difficulty":"新手","price":68,"memberPrice":0,"author":"","publisher":"","intro":"《元気少女从天而降》以纯爱之岛青梅岛为舞台，玩家扮演参加恋爱综艺的六名角色，通过亲吻契约开启七日魔幻恋情，却逐渐揭开泷野家族黑暗的变态秘密。核心任务为：在轻快破冰中吃瓜互动，运用单一设定推理三起猎奇案件，并通过日记还原三代人间交织的谎言与真相，经历多重反转后，揭露“纯爱”表象下的惊人核诡。全程需6-8小时专注协作，最终在逻辑严密的还原中直面人性扭曲的闭环。","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794217133024,"updatedAt":1794217133024,"reviews":[{"id":"6eeae685-7ffe-428c-b6e4-b3c7c6189a66","scriptId":"17607346-7c83-4e76-8a71-0ecce15f4af8","name":"网络玩家3","rating":0,"content":"整体逻辑硬核但节奏轻快，没有冗长设定轰炸，案件服务还原，吃瓜推动推理。新手能乐在其中，老手也能盘得爽，唯一缺点是故事太勾人，打完还想再扒点泷野家的黑料。","source":"network","createdAt":1794217073025},{"id":"b6cb48f1-b354-4f48-8bd2-84baccbf91af","scriptId":"17607346-7c83-4e76-8a71-0ecce15f4af8","name":"网络玩家2","rating":0,"content":"反转来得猝不及防，上一秒还在嗑CP，下一秒就被按头盘三代黑历史。日记覆盖那套玩法绝了，自己写的谎话还得自己圆回来，车友嗷嗷喊“这逻辑链是钢筋焊的吧”。核诡揭晓那刻，鸡皮疙瘩从脚底窜到头顶，才懂“元气少女”这名儿有多讽刺。","source":"network","createdAt":1794217013025},{"id":"87295d5f-2e8c-4050-abe3-1b6948eae32f","scriptId":"17607346-7c83-4e76-8a71-0ecce15f4af8","name":"网络玩家1","rating":0,"content":"开局还以为真是来谈恋爱的，结果吻完才发现签的是“变态契约”。日记本翻得比病历还勤，每页都像在扒马甲，谁暗恋谁、谁又坑了谁，瓜多得吃不过来。盘案件时设定简单到离谱——亲嘴就能恋爱，但死法一个比一个猎奇，脑子得在纯爱和凶案间反复横跳。","source":"network","createdAt":1794216953025}],"rating":{"avg":0,"count":0,"total":3}},{"id":"5ede4ab9-8a27-4751-bcfa-eed3dfb0bd6e","title":"莫格街的晚宴","cover":"uploads/1794217114074-9eba93ec.jpg","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":4,"female":2,"duration":8,"difficulty":"进阶","price":68,"memberPrice":0,"author":"","publisher":"","intro":"","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794217114074,"updatedAt":1794217114074,"reviews":[{"id":"5c508045-2861-4644-8fef-14b0781c16cc","scriptId":"5ede4ab9-8a27-4751-bcfa-eed3dfb0bd6e","name":"网络玩家","rating":0,"content":"《莫格街的晚宴》剧本中的每一个细节都经过精心设计，玩家需要在有限的时间内收集线索、分析情况，并与其他玩家互动，逐步揭开隐藏在晚宴背后的真相。角色之间的互动和冲突也为游戏增添了不少乐趣","source":"network","createdAt":1794217054075}],"rating":{"avg":0,"count":0,"total":1}},{"id":"5d434f41-889c-4935-8f46-522534d9c167","title":"此时彼刻之人","cover":"uploads/1794217089548-23d0e6e3.jpg","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":0,"female":0,"duration":9,"difficulty":"进阶","price":78,"memberPrice":0,"author":"","publisher":"","intro":"您好，冒昧打扰。\n鄙人【风间七树】，诚挚邀请诸位见证人，与【九十九椿】小姐共同莅临《此时彼刻之人》音乐会巡演。\n本场巡演，将以【设定】为鼓，【动机】为琴，【故事】为弦，【推理决斗】为指挥，演奏彼刻仇之因，弹响此时恨之果。\n最终，抵达名为“爱”的宿命。诸位，请有序入场，勿大声喧哗。演出，即将开始。","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794217089551,"updatedAt":1794217089551,"reviews":[{"id":"75a829ee-e842-4f69-a681-5e15fa443dc6","scriptId":"5d434f41-889c-4935-8f46-522534d9c167","name":"网络玩家6","rating":0,"content":"不断推翻重构之后，引入新的概念设定，案件又是否存在其他解答？","source":"network","createdAt":1794217029553},{"id":"9fcc4a33-7a59-4220-a391-ecc18f48d914","scriptId":"5d434f41-889c-4935-8f46-522534d9c167","name":"网络玩家5","rating":0,"content":"又是什么让我们的男主放弃了多年的侦探梦想？","source":"network","createdAt":1794216969553},{"id":"386b956b-7499-4091-9862-a0bb6eb3c6f6","scriptId":"5d434f41-889c-4935-8f46-522534d9c167","name":"网络玩家4","rating":0,"content":"这座岛是否真的存在着魔法？","source":"network","createdAt":1794216909553},{"id":"06a427da-1748-4e15-97e4-38c8c00916f9","scriptId":"5d434f41-889c-4935-8f46-522534d9c167","name":"网络玩家3","rating":0,"content":"而卷入其中的风间七树竟被指认为凶手？","source":"network","createdAt":1794216849553},{"id":"d9449965-fe50-4b44-abf2-6d4af0dedbd0","scriptId":"5d434f41-889c-4935-8f46-522534d9c167","name":"网络玩家2","rating":0,"content":"后面随着男主风间七树收到昔日白月光铃鸟来信，欣然乘船去往业莲岛赴约，碰巧遇上岛上大家族祭祀活动。而随着祭祀活动的进行，接连不断的凶案，肢解，干尸，坠亡.…….","source":"network","createdAt":1794216789553},{"id":"4cdeaf12-ac29-4e97-83b9-7ccd50928614","scriptId":"5d434f41-889c-4935-8f46-522534d9c167","name":"网络玩家1","rating":0,"content":"第一案的密室算是开胃小菜，老玩家基本10 min 左右，我一直不太喜欢密室，不过还好密室手法不太重要，这一趴可以快快过。","source":"network","createdAt":1794216729553}],"rating":{"avg":0,"count":0,"total":6}},{"id":"ed1f45d5-08af-4947-8947-9c49a131f4c7","title":"我与我诀别","cover":"https://80larpnew-1251545914.cos.ap-guangzhou.myqcloud.com/2025/12/1765527735-5df6fe3786c1ab2.png","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":3,"female":3,"duration":7.5,"difficulty":"进阶","price":68,"memberPrice":0,"author":"","publisher":"","intro":"《我与我诀别》以日式背景下的时间穿越与宿命悖论为核心，玩家扮演六名角色在交织的百年时空中探索爱与诀别的真相。核心任务为：通过设定推理还原跨越世纪的动机与人物关系，经历破冰案件与多重身份转换，从青玉、雨夜等隐喻物件中拼凑集体阴谋，揭露“诀别”符号下的人性挣扎。全程需6-8小时专注协作，最终在逻辑闭环中直面宿命与情感的冲击。","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794217051619,"updatedAt":1794217051619,"reviews":[{"id":"84f6b02f-4748-4bf3-a32f-ebc195a11d01","scriptId":"ed1f45d5-08af-4947-8947-9c49a131f4c7","name":"网络玩家3","rating":0,"content":"还原部分确实硬核，逻辑链环环相扣，没有拖沓废话，细节复用率高。只是末段稍显仓促，但整体丝滑，自然反转不突兀，喜欢啃长逻辑的推土机会很过瘾。","source":"network","createdAt":1794216991621},{"id":"19f45bd9-8aa2-4511-b694-0251463b3066","scriptId":"ed1f45d5-08af-4947-8947-9c49a131f4c7","name":"网络玩家2","rating":0,"content":"单搜部分差点把脑子烧糊。npc每个动作都像在传递密码，盘到后半夜眼睛都睁不开了还在亢奋。破解核心那刻全身鸡皮疙瘩，才发现开头那场雨早就埋了伏笔。","source":"network","createdAt":1794216931621},{"id":"a09bcdb1-1b53-4dd5-af4b-7eb25dc62aae","scriptId":"ed1f45d5-08af-4947-8947-9c49a131f4c7","name":"网络玩家1","rating":0,"content":"开局以为就是个普通时间穿越本，结果直接被按头进百年宿命盘逻辑。本里每句话都像藏了钩子，翻页都得提防被叙诡绊一跤。盘关系时黑板画成蜘蛛网——就那几个人名，愣是盘出几十种可能性，车友嗷嗷喊“倒带重来”。","source":"network","createdAt":1794216871621}],"rating":{"avg":0,"count":0,"total":3}},{"id":"9cc524ce-22bc-4cc9-bcc4-8fb45c3e6c1a","title":"她未能歌颂的明日","cover":"uploads/1794217032024-ed58a106.jpg","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":3,"female":3,"duration":7,"difficulty":"进阶","price":68,"memberPrice":0,"author":"","publisher":"","intro":"","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794217032024,"updatedAt":1794217032024,"reviews":[{"id":"0100c24a-029d-4a13-b284-b181dabf2d8d","scriptId":"9cc524ce-22bc-4cc9-bcc4-8fb45c3e6c1a","name":"网络玩家4","rating":0,"content":"整体来说是个非常舒服的还原本，时长友好，过程欢乐，该有的逻辑和反转也没落下。适合想轻松一下，又不想玩得太无脑的熟人车，全程都在线，一点不累。","source":"network","createdAt":1794216972025},{"id":"f931f468-bb66-4c3a-9400-ef81141dd0b8","scriptId":"9cc524ce-22bc-4cc9-bcc4-8fb45c3e6c1a","name":"网络玩家3","rating":0,"content":"最后看到结局本有点意外，在一片嘻嘻哈哈和猎奇故事里，突然来这么一笔纯爱，后劲还挺足。不是那种按头哭，就是读完心里有点空落落的，会忍不住回想前面那些离谱事里是不是早就藏了这根线。","source":"network","createdAt":1794216912025},{"id":"3ae10d05-dbec-4fd8-977c-8acd10faab7a","scriptId":"9cc524ce-22bc-4cc9-bcc4-8fb45c3e6c1a","name":"网络玩家2","rating":0,"content":"中期那个“月下契约”的规则开始发威，直接把前面的东西都拧过来重看。一开始觉得有点绕，但跟着DM的节奏走，发现逻辑链扣得特别细，一步步推下来特别顺畅。没有那种硬要你盘到头秃的感觉，反而像在拆一个设计巧妙的连环扣，每解开一个就有新发现。","source":"network","createdAt":1794216852025},{"id":"215719a9-2996-4e69-bb46-33a4c4edbcf9","scriptId":"9cc524ce-22bc-4cc9-bcc4-8fb45c3e6c1a","name":"网络玩家1","rating":0,"content":"开局直接进案子，一点不拖沓，手法盘起来顺顺的，不用读大段设定真是福音。本来以为就是个普通吃瓜本，结果瓜的密度和炸裂程度超乎想象，分享环节跟车友们互相蛐蛐，笑得脸疼。我这角色的人生主打一个精彩纷呈，分享的时候根本刹不住车，感觉自己在演晨间剧。","source":"network","createdAt":1794216792025}],"rating":{"avg":0,"count":0,"total":4}},{"id":"6715f20f-e16e-4242-8a5c-f0a12c73e6b1","title":"诡计患者的谜题","cover":"uploads/1794216933135-69680ebe.jpg","genre":["推理"],"type":"城限","playersMin":6,"playersMax":6,"male":3,"female":3,"duration":8,"difficulty":"硬核","price":68,"memberPrice":0,"author":"","publisher":"","intro":"","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794216933135,"updatedAt":1794216933135,"reviews":[{"id":"79adb765-fac3-47a6-a76d-85653f6d17d8","scriptId":"6715f20f-e16e-4242-8a5c-f0a12c73e6b1","name":"网络玩家6","rating":0,"content":"因为在这本红色的谜题集面前，故事只是一个额外的元素，不需要投入情感，也不需要共鸣。","source":"network","createdAt":1794216873136},{"id":"00cb1667-5e77-4dfb-9d1d-41bf197dd908","scriptId":"6715f20f-e16e-4242-8a5c-f0a12c73e6b1","name":"网络玩家5","rating":0,"content":"然而，它的所有优点也正是其缺点所在，这意味着这本作品并非面向大众市场，甚至不能算作一本标准的剧本杀作品。","source":"network","createdAt":1794216813136},{"id":"89f37237-340d-40ea-a996-df0de2554072","scriptId":"6715f20f-e16e-4242-8a5c-f0a12c73e6b1","name":"网络玩家4","rating":0,"content":"任何玩过猫岛游戏的人都会明白，这是灰烬在反转设计上所能达到的最高水准，也是最精美的推理游戏作品，是洋葱这位诡计大师精心构思并雕琢的杰作。","source":"network","createdAt":1794216753136},{"id":"93dafb67-6662-4b21-a2bc-43ca1697717c","scriptId":"6715f20f-e16e-4242-8a5c-f0a12c73e6b1","name":"网络玩家3","rating":0,"content":"这本谜题集包含了所有线索和解答，提供了多样化的体验。","source":"network","createdAt":1794216693136},{"id":"0bcdbf0a-ed92-4dd0-887f-9392b7bc9b26","scriptId":"6715f20f-e16e-4242-8a5c-f0a12c73e6b1","name":"网络玩家2","rating":0,"content":"它就像是一封写给推理爱好者的情书，也是解题爱好者的最爱。","source":"network","createdAt":1794216633136},{"id":"d92fac0d-f01f-42cb-b80d-db245e112823","scriptId":"6715f20f-e16e-4242-8a5c-f0a12c73e6b1","name":"网络玩家1","rating":0,"content":"通常在评价一本作品时，我会分析其优缺点，但这次我很难从逻辑和诡计的角度找出这本作品的不足。","source":"network","createdAt":1794216573136}],"rating":{"avg":0,"count":0,"total":6}},{"id":"e4ade945-27d7-49db-8c61-48610ea6e57a","title":"诡计甜美的死去","cover":"uploads/1794216896993-95793dbc.jpg","genre":["架空","日式","推理"],"type":"城限","playersMin":6,"playersMax":6,"male":3,"female":3,"duration":6,"difficulty":"进阶","price":58,"memberPrice":0,"author":"","publisher":"","intro":"无风之境的花园中，\n为证明阿基里斯悖论而存在的落星馆仍遥遥矗立。\n无冕侦探手持裁定之枪，目光熠熠地指着面前最后的诡计狂想者。\n侦探会亲手杀死诡计，就如同众人期望的一般。\n那包含甜美的子弹终是射向面前之人的头颅。\n脸上绽放着甜美的笑意，直至眉心被锐利的子弹贯穿，身躯向后方倾去。\n诡计终于迎来了甜美的死亡。\n鲜血染红了花园中的白色铃兰，天空中亮起了繁杂神秘的符文。\n设定规则之下的审判裁定\n逝者携手共赴死亡的果决\n击穿宿命遗忘的甜美子弹\n构建铭记的第四种可能性\n名为「诡计甜美死去」的赌约，此刻正式开始","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794216896994,"updatedAt":1794216896994,"reviews":[{"id":"07a3bb95-4571-4e59-aad7-d85f758e8ce2","scriptId":"e4ade945-27d7-49db-8c61-48610ea6e57a","name":"网络玩家6","rating":0,"content":"全程公共视角，没有故事分享。硬核推理玩家狂喜的盛宴。","source":"network","createdAt":1794216836995},{"id":"4e55e2b2-12cd-4f1f-8a15-e316e2ed2f36","scriptId":"e4ade945-27d7-49db-8c61-48610ea6e57a","name":"网络玩家5","rating":0,"content":"六位侦探又带着何种甜蜜的诡计去挑战呢？","source":"network","createdAt":1794216776995},{"id":"0b8ee1c0-33c5-4983-9212-bfe9204d31d6","scriptId":"e4ade945-27d7-49db-8c61-48610ea6e57a","name":"网络玩家4","rating":0,"content":"这一次我们又要挑战神明了，这次是蓓尔嘉女神！","source":"network","createdAt":1794216716995},{"id":"4391e755-f992-4037-bb93-eb567820e733","scriptId":"e4ade945-27d7-49db-8c61-48610ea6e57a","name":"网络玩家3","rating":0,"content":"一开始喊口号还不明所以，后来发现这句口号是打破第四堵墙在对店家说，我们还喊得这么起劲。","source":"network","createdAt":1794216656995},{"id":"d00dc466-8afa-48fd-a2bc-5326fc20cf87","scriptId":"e4ade945-27d7-49db-8c61-48610ea6e57a","name":"网络玩家2","rating":0,"content":"在西安展最后一天又来看看我心心念念的诡计甜美了！","source":"network","createdAt":1794216596995},{"id":"be6baf0d-fb99-4e4f-b399-c63d5c971055","scriptId":"e4ade945-27d7-49db-8c61-48610ea6e57a","name":"网络玩家1","rating":0,"content":"“找到子弹，才能吃饭！！！”","source":"network","createdAt":1794216536995}],"rating":{"avg":0,"count":0,"total":6}},{"id":"2c4f04e8-ea6c-4242-94f0-fc72ffd2945d","title":"白色乡愁","cover":"uploads/1794216831365-4a5e7dcc.jpg","genre":[],"type":"独家","playersMin":6,"playersMax":6,"male":0,"female":0,"duration":9,"difficulty":"进阶","price":78,"memberPrice":0,"author":"","publisher":"","intro":"我的爷爷曾是一名走遍大江南北的民俗学者，可他如今患上了阿兹海默，最后的愿望竟是想要落叶归根。\n神秘的复活仪式、恐怖的蝉母信仰、离奇的密室杀人……爷爷发病前留下的这本名为《纯白色的故乡》的小说，详实记录了他1979年回老家时，在深山村落经历的一场连环血案。\n从那之后，爷爷再也没回过故乡。\n为此，在小说的指引下，我踏上了寻找爷爷故乡的旅程。\n窗外的风景中埋葬的，究竟是爷爷留下的解谜游戏，还是游子的救赎?\n当破碎的拼图被拼接完整，我才发现，那抹白色的乡愁，仍在这个时代萦绕\n就如那年的蝉鸣，始终回荡不休……","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794216831368,"updatedAt":1794216831368,"reviews":[{"id":"461a0ee4-29c9-4e9f-811e-a7cadbceb6ce","scriptId":"2c4f04e8-ea6c-4242-94f0-fc72ffd2945d","name":"网络玩家4","rating":0,"content":"爷爷的故事也在推理中被抽丝剥茧，情感的融入随还原而递进，破解完全部也达到了高潮!民族的热血也在此刻沸腾!正如苏轼所说“此心安处是吾乡”，而对于脚下这片土地是属于爷爷“白色的乡愁”。","source":"network","createdAt":1794216771370},{"id":"74c73205-ab90-42a1-95c5-4821e88768af","scriptId":"2c4f04e8-ea6c-4242-94f0-fc72ffd2945d","name":"网络玩家3","rating":0,"content":"随时剧情的逐步深入，重点来了!!!这部分我先声明没有切实的体验到(因为某些原因『密室卿』老师给我们开的口嗨版)，但是这个部分我听着就觉得已经起鸡皮疙瘩了，完美的闭环逻辑，层层递进的还原过程，让整个的游戏过程变得愈发有趣!并且也结合了中式民俗独特的魅力，再融入民族时代的破败感，真的很精彩!破解环环相扣的谜题，将谜题碎片一片片批凑出来，会发现那“神之一手”就是真相，一切的一切也都因为这片真相的碎片而发生质变!","source":"network","createdAt":1794216711370},{"id":"236e242e-c446-45cd-8234-504c4eeeb26d","scriptId":"2c4f04e8-ea6c-4242-94f0-fc72ffd2945d","name":"网络玩家2","rating":0,"content":"乡愁可以说受众面很广，而且有完整的逻辑链可以盘，并且逻辑极为严密，手法的设计没有以往的本那么难，但是所有的诡计都是为剧情服务的，真的对灰烬竖大拇哥了，永远可以跳出舒适圈，让玩家耳目一新。","source":"network","createdAt":1794216651370},{"id":"bfc1ee55-5ca5-4b9c-9cff-d90b9249bd09","scriptId":"2c4f04e8-ea6c-4242-94f0-fc72ffd2945d","name":"网络玩家1","rating":0,"content":"故事的背景以中式现代为背景，但是文笔以后很有灰烬的味道!这次的风格绝对是在推理本里是开了先河的!推理还原占比五五开，而且逻辑极为丝滑。","source":"network","createdAt":1794216591370}],"rating":{"avg":0,"count":0,"total":4}},{"id":"29e0bd2c-d2a4-4fa7-a5de-03de297aed51","title":"关于Y的奇迹","cover":"uploads/1794216793496-c8d0c4f5.jpg","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":3,"female":3,"duration":8,"difficulty":"进阶","price":78,"memberPrice":0,"author":"","publisher":"","intro":"在一个被迷雾笼罩、看似普通却暗藏玄机的小镇上，命运的红线将几位身份迥异的玩家紧紧缠绕🧵。这里有神秘的失踪案件，有古老家族的神秘传说，还有那些被岁月尘封的爱恨情仇。随着剧情的层层推进，每个人物背后隐藏的秘密如同抽丝剥茧般逐渐显露。你可能会发现，自己与身边的人有着跨越时空的羁绊，而每一个抉择，都可能改变整个故事的走向。像是在玩一场现实版的 “命运模拟器”，每一步都充满惊喜与未知。","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794216793503,"updatedAt":1794216793503,"reviews":[{"id":"c19679bc-1000-4c74-a53a-f3275384252d","scriptId":"29e0bd2c-d2a4-4fa7-a5de-03de297aed51","name":"网络玩家","rating":0,"content":"🧠推理体验：《关于Y的奇迹》的推理环节设计得相当巧妙。线索分布在各个角落，需要玩家们用心去发现、去分析。在推理过程中，你会不断遇到新的谜团，让你一刻都不敢放松。而且，它的推理并不是简单的线性推理，而是充满了各种反转和惊喜，每一次的推理突破都能给你带来极大的成就感。\n🎭情感沉浸：这绝对是该本的一大亮点！情感线丰富且细腻，无论是亲情、友情还是爱情，都刻画得入木三分。作者通过细腻的文字描述，让你很容易代入到角色中，感受角色的喜怒哀乐。有不少玩家在游戏过程中被深深打动，甚至留下了感动的泪水。在沉浸环节，配合上恰到好处的音乐和氛围营造，那种情感的共鸣会让你仿佛置身于角色的世界中，无法自拔。\n💡小提示：玩这个本的时候，一定要认真阅读剧本，注意每一个细节，包括人物的外貌描写、语言习惯等，这些都可能成为推理的关键。在讨论环节，要积极与其他玩家交流，分享自己的线索和想法，团队合作才能更快地揭开真相。","source":"network","createdAt":1794216733507}],"rating":{"avg":0,"count":0,"total":1}},{"id":"32c1d374-be98-4adf-b297-60d0b1db0c16","title":"漓川怪谈簿","cover":"uploads/1794216749864-9dbdfb60.jpg","genre":["日式","推理","本格"],"type":"盒装","playersMin":7,"playersMax":7,"male":0,"female":0,"duration":4.5,"difficulty":"新手","price":48,"memberPrice":0,"author":"","publisher":"","intro":"常世是这片土地的名字，也是土地中心那片诡异湖泊的名字。\n传说，这里的水土，不仅滋养了生活在这的百姓，也孕育出了无数怪谈故事中的精怪们。\n它们非人非鬼，是受到常世湖湖水影响而妖异化的产物。它们也不像话本里传的那样天生邪恶，大多只是生活的方式与对世界的认知与人类不同而已。\n但只要它们出现，就一定离不开各种“光怪陆离”。\n在这片湖泊的中心还有着一个叫做蜃气楼的建筑，像一艘大船，彻彻底底地悬于湖上。渔夫们曾潜入水中查看，却找不到任何一根用以支撑的柱子。\n不管水位因为天气如何变化，它都始终都会和水面保持着固定的距离。大家都对它感到好奇，却没人能够真的进去。\n所有人都知道蜃气楼是平将门大人的居所，早就下令，禁止任何人的通行。\n但今天，睁开双眼后，你们忽然发现自己居然正身处在这栋神秘的建筑里。平将门大人则惨死在了他紧锁的房间当中……","note":"","featured":false,"pinned":false,"heat":5,"createdAt":1794216749866,"updatedAt":1794216749866,"reviews":[],"rating":{"avg":0,"count":0,"total":0}},{"id":"ad961e25-6ba5-4ba2-b1a1-ac629d86bd7e","title":"X的迴旋","cover":"uploads/1794214919897-b519d951.jpg","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":0,"female":0,"duration":8.5,"difficulty":"进阶","price":78,"memberPrice":0,"author":"","publisher":"","intro":"一个个身怀守护意志的人以身作门，堵住裂隙，将黑雾与城市隔绝。他们立在那里，将自己与虚无关在一起。\n但数个日夜，饱受黑雾的折磨，即使是英雄也会疲倦迷失。必须要有人走进那扇门，赢下对决，然后告诉他们,那些已被岁月磨损、连他们自己都快要遗忘的——站在这里的理由。\n英雄拯救世界，我们拯救英雄。","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794214919898,"updatedAt":1794214919898,"reviews":[{"id":"14fcee82-5ca7-4555-89fa-d0748be0dc6d","scriptId":"ad961e25-6ba5-4ba2-b1a1-ac629d86bd7e","name":"网络玩家6","rating":0,"content":"这一段反转要打破两个不可能，逻辑有点绕，装来装去的，很难让玩家自主盘到这里，展会d也是扶了一点，必须打破前面的逻辑，顺着之前的不可能，再去圆回来。","source":"network","createdAt":1794214859899},{"id":"86a0078a-912f-4432-b59e-96aea998b53e","scriptId":"ad961e25-6ba5-4ba2-b1a1-ac629d86bd7e","name":"网络玩家5","rating":0,"content":"我认为的不足之处在于最后一案的反转逻辑，那一段dm挺难带的，基本上是顺着逻辑走走到最后，发现走不通，为什么狼必赢，因为这个点，有重新盘第一天反转，很红鲱鱼的一段。","source":"network","createdAt":1794214799899},{"id":"e15f2860-3ca7-4628-b220-2b1a55bae935","scriptId":"ad961e25-6ba5-4ba2-b1a1-ac629d86bd7e","name":"网络玩家4","rating":0,"content":"整个推理，围绕着做任务，投票票型，最后的结果进行，存在着大量果推因，但是逻辑还是挺硬的，喜欢果推因和信息差推理的可以玩。","source":"network","createdAt":1794214739899},{"id":"0e0e2bb8-0814-4a25-90ab-e8c0b1f4070a","scriptId":"ad961e25-6ba5-4ba2-b1a1-ac629d86bd7e","name":"网络玩家3","rating":0,"content":"最后一案将狼人杀的投票系统放大，平民思考量比王不见王多，王不见王里，除了冬野大我，其他npc的思考量几乎没有，完全就是人设机器，X的回旋里，每个人都有思考量，为什么这么投票，他的想法是什么。","source":"network","createdAt":1794214679899},{"id":"684bf340-265d-49ef-b00c-9e2f928b99bc","scriptId":"ad961e25-6ba5-4ba2-b1a1-ac629d86bd7e","name":"网络玩家2","rating":0,"content":"整个本的体验好坏，完全就是看最后一案能不能在线跟上，最后一案又更像是王不见王那种类型，但是，从某种程度来说，比王不见王更像狼人杀。","source":"network","createdAt":1794214619899},{"id":"f7188b23-c698-4f62-8a71-078e59d484fa","scriptId":"ad961e25-6ba5-4ba2-b1a1-ac629d86bd7e","name":"网络玩家1","rating":0,"content":"本的结构是三个破冰+一个超长案件，破冰案基本给这个案的玩法定调，依然是信息差智斗，偏向于鬼河那种模式。","source":"network","createdAt":1794214559899}],"rating":{"avg":0,"count":0,"total":6}},{"id":"3dfe52ca-cd40-4dac-a299-0957bbfdd14f","title":"鬼河怒放","cover":"uploads/1794214886141-0c984203.jpg","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":3,"female":3,"duration":9.5,"difficulty":"硬核","price":78,"memberPrice":0,"author":"","publisher":"","intro":"《鬼河怒放》以灵异存在“鬼河”溢出异界、诅咒红花镇为舞台，调查员小队为寻找失踪的第一小队深入禁区，遭遇会杀人的厉鬼与诡异的“死律”。玩家扮演六名高智谋的调查员，在无限流大逃杀中唯一信念是“活下去”。核心任务为：放弃上帝视角，完全代入局中人的思维，从NPC的对话、动作和行为逻辑中推理出真相，破解四个环环相扣的案件，在智斗与博弈中揭露鬼河背后的秘密，最终理解“怒放者”的意义。全程需8小时以上专注协作。","note":"","featured":true,"pinned":false,"heat":0,"createdAt":1794214886142,"updatedAt":1794214886142,"reviews":[{"id":"8252af21-0751-4181-8004-25f85011823e","scriptId":"3dfe52ca-cd40-4dac-a299-0957bbfdd14f","name":"网络玩家3","rating":0,"content":"纯硬核玩家的爽本，8小时全程无尿点。没有冗长的故事还原，只有纯粹的推理博弈。喜欢啃行为逻辑和细节的推土机必冲，2026年推理本的第一梯队。","source":"network","createdAt":1794214826143},{"id":"39f9d216-30b1-42e3-8ab4-af269e760454","scriptId":"3dfe52ca-cd40-4dac-a299-0957bbfdd14f","name":"网络玩家2","rating":0,"content":"到了灯塔案，脑子彻底烧干。多重假想层叠，差点以为要挂机了，结果队友一句“如果从TA的视角看”突然打通任督二脉。反转那一下全身发麻，前面埋的伏笔全都收回来了。虽然删掉了一些大核诡，但整体依然丝滑。","source":"network","createdAt":1794214766143},{"id":"5a0a4d1e-d398-44fb-aeab-7d75bdea120d","scriptId":"3dfe52ca-cd40-4dac-a299-0957bbfdd14f","name":"网络玩家1","rating":0,"content":"开局以为自己是边缘人，结果全员高智商，没人挂机。规则怪谈加大逃杀，对话里全是刀，每一句都要琢磨对方是不是在骗你。盘第一个视频案件时，我们盯着NPC抖烟灰的细节看了十分钟，结果真藏在里面。这种智斗太新鲜了，不是传统的密室和建筑诡计，而是活生生的人与人之间的博弈。","source":"network","createdAt":1794214706143}],"rating":{"avg":0,"count":0,"total":3}},{"id":"30781c9c-fed1-4bb8-8575-207bf10e257f","title":"死者在幻夜中醒来","cover":"uploads/1794214805619-7aecd131.jpg","genre":[],"type":"盒装","playersMin":7,"playersMax":7,"male":0,"female":0,"duration":6,"difficulty":"进阶","price":58,"memberPrice":0,"author":"","publisher":"","intro":"河流上，漂浮着许多载着烛光的纸船，在一片波浪中，摇曳成一片星星点点。这条看不到尽头的河流，将会流向彼岸。\n人们相信，如果烛光与船只一起到达了河流的尽头，两个世界的人就可能在幻夜之中再次相见。\n可是，扁舟一叶在浪花浮沉，许多纸船都随着波涛淹没在了河流之中。烛光熄灭，而折纸船的人，还等待着企盼之人的归来。\n我们曾无数次想要从河流溯洄，只乞求到达那一个虚无缥缈的彼岸。\n——《未见村民间故事》","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794214805620,"updatedAt":1794214805620,"reviews":[{"id":"20dbd667-d828-45dd-95d5-4f3205509b9c","scriptId":"30781c9c-fed1-4bb8-8575-207bf10e257f","name":"网络玩家2","rating":0,"content":"虽然说这个本是6-7人可开，但第七人完全可以被DM替代，体验感相对没有别的几位玩家热情高涨，最容易挂机的角色就是这个G了，不过还是更推荐7人开本，第7人让新手玩家上，对于剧情还原还是有很大作用的。","source":"network","createdAt":1794214745621},{"id":"8e257e3e-f3e8-40e4-8ff9-bb00ce357c86","scriptId":"30781c9c-fed1-4bb8-8575-207bf10e257f","name":"网络玩家1","rating":0,"content":"盒装的价格，城限的品质，诡计很硬，对叙诡有兴趣的硬核玩家冲，非常上头，开完这车队友立马吵着要组队去玩713。尽管有争议，但火是有道理的，论叙诡的应用，罗老师真的有两把刷子，这个逻辑思维和语言组织能力太厉害了，推理部分虽然比较简单，但是还原全部真相很难，从简到难，推理还原的难度层层递进。","source":"network","createdAt":1794214685621}],"rating":{"avg":0,"count":0,"total":2}},{"id":"4a1e1f94-5edc-44b2-85a8-44884e93cbc6","title":"双羽馆解体妄想","cover":"uploads/1794214672137-ebbb058e.jpg","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":3,"female":3,"duration":7,"difficulty":"进阶","price":68,"memberPrice":0,"author":"","publisher":"","intro":"当飞鸟坠落的那一刻，眼里到底该是怎样的景象?\n命定的笺签伸出宿命的枷锁将四大家族相互绑定驱使着那惊弓山巅之上的双羽煽动着黑与白。\n霜鸥挥动着名为风雪的翅膀，带来凛冽的绝望之息。 蜂鸟闪烁的羽翼于瞬息万变之间将破碎全部定格。\n猫头鹰的注视之下，黑暗中正在上演的是那荒诞的鼠愚戏。\n终幕之日的黑鸦挥斥着尖喙利爪，将那循环往复的潘多拉之门毁坏殆尽。\n解体之后，仍存幻想。当飞鸟坠落的那一刻，眼里到底该是怎样的景象?命定的笺签伸出宿命的枷锁将四大家族相互绑定驱使着那惊弓山巅之上的双羽煽动着黑与白。霜鸥挥动着名为风雪的翅膀，带来凛冽的绝望之息。蜂鸟闪烁的羽翼于瞬息万变之间将破碎全部定格。猫头鹰的注视之下，黑暗中正在上演的是那荒诞的猫鼠愚戏。终幕之日的黑鸦挥斥着尖喙利爪，将那循环往复的潘多拉之门毁坏殆尽。纠葛的宿命之源，或许早已被解体在那逻辑无法拼凑的往昔之中。又或许，诡计版图的碎片如今只能在那妄想之中游荡。再或许，在那亡与希望之外，在那风尽烟去之时，不过都只是些于你我而言，从来都未曾料想过的尔尔罢了。","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794214672138,"updatedAt":1794214672138,"reviews":[{"id":"9ff97023-5d93-47c3-a96a-d1a2d159c2f8","scriptId":"4a1e1f94-5edc-44b2-85a8-44884e93cbc6","name":"网络玩家3","rating":0,"content":"总之非常佩服双羽馆团队，在一个成功的系列上还敢大胆尝试，玩一些不一样的东西。双羽馆无论类型，难度还是时长都和双炽岛不是一个量级。建议每一个像挑战自己的硬核脑袋，都准备好充足的精力冲一波!","source":"network","createdAt":1794214612138},{"id":"97a8d056-7a71-42dc-bf8a-c7779a5e0c03","scriptId":"4a1e1f94-5edc-44b2-85a8-44884e93cbc6","name":"网络玩家2","rating":0,"content":"虽然说没有还原，但是剧情还是很饱满。既登场了“獾”的老朋友八步龙一疯狂耍帅，同时新登场的角色鸢也迷人又神秘，还有搞笑角色五步蛇二就不提了，已经铺设了一个“獾”宇宙了，非常期待下一步的新角色。","source":"network","createdAt":1794214552138},{"id":"17af4dd0-9575-455e-bac8-a67ede01a1b1","scriptId":"4a1e1f94-5edc-44b2-85a8-44884e93cbc6","name":"网络玩家1","rating":0,"content":"这个本将解体的感念玩到了极致，既可以把整体作为一个设定推理看待，也可以将案件拆分为强设定推理的无肢生还和纯本格推理的有人生还两部分，让你一个本体验两种极度不同的感受。不光如此，最后的诡计谜面一出来就令人头皮发麻，而且可以多角度推理，无论你走哪条路径都只会通往唯一的解答，就是一个字-爽!","source":"network","createdAt":1794214492138}],"rating":{"avg":0,"count":0,"total":3}},{"id":"754b5ad0-c3be-4d5d-b2ee-63bc7405e6b5","title":"双炽岛斩首诸因","cover":"uploads/1794214656349-ccf89265.jpg","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":0,"female":0,"duration":7,"difficulty":"进阶","price":68,"memberPrice":0,"author":"","publisher":"","intro":"名为獾的神秘组织发出了一封特别邀请，寻求能够破解【孤于悬崖的地藏】谜题之人。\n层层筛选后，六位侦探将共同角逐与推理。\n以及，拥有觐见并加入獾组织一席之地的资格。\n绯红色的达摩头颅在秋季凋零，却将谜题指向了双炽岛狐神降罪的业火始末。\n寂夜中的狐神娶亲，罪与罚将会被悄然叩响双生魂的瞬移魔法，荆棘在黑夜中肆意生长惊叫夜的两颗头颅，\n将生命奉献给逆位幻象人偶复活杀戮始末，汹涌灵魂永远无法平息当业火绽放的那一刻，真相之花却悄然收拢了花瓣。\n即使要逆于时代的洪流与眼泪，也要燃烧推理之火殆尽出真相。诸位，你们正是被寄托希望理解斩首诸因的那团萤火。","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1794214656354,"updatedAt":1794214656354,"reviews":[{"id":"345dac7c-e3bd-471e-ab03-9b3557dbd874","scriptId":"754b5ad0-c3be-4d5d-b2ee-63bc7405e6b5","name":"网络玩家6","rating":0,"content":"故事从藤井大我的神秘死亡开始，引领我们进入双炽岛上发生的三起密室斩首案件。","source":"network","createdAt":1794214596373},{"id":"8a5af810-9921-4c27-98ca-985ab043212d","scriptId":"754b5ad0-c3be-4d5d-b2ee-63bc7405e6b5","name":"网络玩家5","rating":0,"content":"这个剧本不仅聚焦于复杂的逻辑链，还在不断的逻辑反转中推动故事发展，直至揭示出惊人的真相。","source":"network","createdAt":1794214536373},{"id":"926d0596-30a8-422d-b3a9-94eb7b856897","scriptId":"754b5ad0-c3be-4d5d-b2ee-63bc7405e6b5","name":"网络玩家4","rating":0,"content":"六位小侦探在成员“烟”的引导下展开推理。","source":"network","createdAt":1794214476373},{"id":"3a1ff70e-7f0d-4249-9ea7-123d9fd05195","scriptId":"754b5ad0-c3be-4d5d-b2ee-63bc7405e6b5","name":"网络玩家3","rating":0,"content":"全剧以“獾”组织的神秘邀请信开始，逐渐揭开连串精心设计的案件。","source":"network","createdAt":1794214416373},{"id":"b2fe5113-eb1f-41b5-8aa7-07672b40159d","scriptId":"754b5ad0-c3be-4d5d-b2ee-63bc7405e6b5","name":"网络玩家2","rating":0,"content":"本剧中展现了密室推理的精彩细节，特别是凶手如何利用复杂的诡计，一步步引导读者至谜题的深处。","source":"network","createdAt":1794214356373},{"id":"33b3d52d-d826-4bd9-ad1e-dab05e96ea10","scriptId":"754b5ad0-c3be-4d5d-b2ee-63bc7405e6b5","name":"网络玩家1","rating":0,"content":"双炽岛斩首诸因》紧张而刺激的推理盛宴。","source":"network","createdAt":1794214296360}],"rating":{"avg":0,"count":0,"total":6}},{"id":"31dbf1a5-4b43-4bc4-b43d-67ab0e1ea9fc","title":"零的幻想","cover":"uploads/1793891220575-1475dfbc.jpg","genre":[],"type":"城限","playersMin":6,"playersMax":6,"male":4,"female":2,"duration":4,"difficulty":"硬核","price":78,"memberPrice":0,"author":"","publisher":"","intro":"《零的幻想》以架空的魔法世界为背景，围绕零塔内的诡异规则展开，玩家化身拥有特殊技能的六大角色，在封闭空间中遭遇连环离奇事件。核心任务为：吃透技能机制与建筑规则，通过层层递进的诡计推理，破解多重解答下的案件手法，梳理超长逻辑链还原真相。全程无需纠结复杂人物关系，专注设定运用与手法拆解，在8小时以上的沉浸式推演中，揭开所有谜题背后那层温暖而悲壮的底色。","note":"","featured":false,"pinned":false,"heat":0,"createdAt":1793891220576,"updatedAt":1794214577890,"reviews":[{"id":"a9d2b49c-5e32-4a4a-bf26-edb4b7ef3672","scriptId":"31dbf1a5-4b43-4bc4-b43d-67ab0e1ea9fc","name":"网络玩家3","rating":0,"content":"整体来说是近期难得的纯设定推理佳作，几乎没有冗余还原，全程都在抠诡计。前期学习成本高，但换来的是后期推理的丝滑。结局收束得很稳，把前面那些冷冰冰的技能名都赋予了意义，后劲比想象中大。推荐给能坐得住、爱啃硬骨头的推土机，新手慎入。","source":"network","createdAt":1793891160578},{"id":"48b29e7b-8d4c-4880-911c-1ea4bc3f221c","scriptId":"31dbf1a5-4b43-4bc4-b43d-67ab0e1ea9fc","name":"网络玩家2","rating":0,"content":"动线这块DM帮着梳理了大半，我们只需要盯着技能组合和手法可行性。最后那个长逻辑链推完，看着汇总的时间线大卡，确实有种豁然开朗的感觉。虽然中间有些小杠点，比如电梯和复制的配合细节没完全搞懂，但不影响整体爽感。","source":"network","createdAt":1793891100578},{"id":"a7a7ba90-0231-45e0-9920-7394ce6c15d3","scriptId":"31dbf1a5-4b43-4bc4-b43d-67ab0e1ea9fc","name":"网络玩家1","rating":0,"content":"开局就被按头学设定，两个本啃下来两小时起步，脑子嗡嗡的。好在设定讲人话，不像某些本学完就忘。3×3那块确实顶，尤其是第二个案子的平行解，车友们站起来拍黑板，那股兴奋劲儿现在还记得。盘到后期逻辑链拉得老长，有时候刚觉得顺了，DM一句话又把思路打回原形，只能闷头重新翻规则书。","source":"network","createdAt":1793891040578}],"rating":{"avg":0,"count":0,"total":3}}],"generatedAt":1794224730625};

const toast = (m) => { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(t._t); t._t = setTimeout(() => t.hidden = true, 2400); };
function hashCode(str){let h=0;for(const c of String(str))h=(h*31+c.codePointAt(0))>>>0;return h}
const GRADS=[['#392b5e','#7b4fa2'],['#173a5e','#2e7d8e'],['#5a2333','#a04a5e'],['#1f4030','#4c8a5a'],['#57431c','#9a7d3a'],['#3d1f1f','#8a4438'],['#252a4a','#5a5f9e'],['#20303a','#3e6a6a']];
const fmtPlayers=(s)=>s.playersMin===s.playersMax?s.playersMin+'人':s.playersMin+'-'+s.playersMax+'人';
const fmtGender=(s)=>(s.male==null&&s.female==null)?'':((s.male??'?')+'男'+(s.female??'?')+'女');
const fmtDuration=(s)=>'约'+(Number.isInteger(+s.duration)?+s.duration:(+s.duration).toFixed(1))+'小时';
const fmtDate=(ts)=>{const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const badge=(t)=>'<span class="badge '+({盒装:'box',城限:'city',独家:'excl'}[t]||'box')+'">'+esc(t)+'</span>';
const fmtPrice=(s)=>(s.memberPrice!=null&&s.memberPrice>0&&s.memberPrice<s.price)
  ?'<span class="price">¥'+esc(s.price)+'<small>/人</small></span><span class="member-price">会员¥'+esc(s.memberPrice)+'</span>'
  :'<span class="price">¥'+esc(s.price)+'<small>/人</small></span>';
function starsHtml(val,count){const pct=Math.max(0,Math.min(100,val/5*100));
  return '<span class="stars"><span class="stars-bg">★★★★★</span><span class="stars-fill" style="width:'+pct+'%">★★★★★</span></span>'+(count!=null?'<span class="stars-num">'+(val>0?val.toFixed(1):'—')+' · '+count+'条</span>':'')}
const coverPh=(s,big)=>{const g=GRADS[hashCode(s.id||s.title)%GRADS.length];
  return '<div class="cover-ph" style="background:linear-gradient(150deg,'+g[0]+','+g[1]+')"><div class="ph-title"'+(big?' style="font-size:22px"':'')+'>'+esc(s.title)+'</div><div class="ph-tag">'+esc((s.genre&&s.genre[0])||'剧本')+'</div></div>'};
const coverHtml=(s,big)=>s.cover?'<img src="'+esc(s.cover)+'" alt="'+esc(s.title)+'封面" loading="lazy" data-ph-title="'+esc(s.title)+'" data-ph-genre="'+esc((s.genre&&s.genre[0])||'剧本')+'">':coverPh(s,big);
document.addEventListener('error',(e)=>{const img=e.target;if(!(img instanceof HTMLImageElement)||!img.dataset.phTitle)return;
  const g=GRADS[hashCode(img.dataset.phTitle)%GRADS.length];const ph=document.createElement('div');ph.className='cover-ph';
  ph.style.background='linear-gradient(150deg,'+g[0]+','+g[1]+')';
  ph.innerHTML='<div class="ph-title">'+esc(img.dataset.phTitle)+'</div><div class="ph-tag">'+esc(img.dataset.phGenre||'剧本')+'</div>';img.replaceWith(ph);},true);

const state = { q:'', genre:'', type:'', players:'', sort:'new' };
const PF=[{key:'',label:'全部人数'},{key:'le5',label:'≤5人'},{key:'6',label:'6人'},{key:'7',label:'7人'},{key:'8',label:'8人'},{key:'ge8',label:'8人+'}];

function listScripts(){
  const kw=state.q.trim().toLowerCase();
  let l=SITE.scripts.filter(s=>{
    if(kw&&!(s.title+'\n'+(s.author||'')+'\n'+(s.publisher||'')+'\n'+(s.intro||'')).toLowerCase().includes(kw))return false;
    if(state.genre&&!s.genre.includes(state.genre))return false;
    if(state.type&&s.type!==state.type)return false;
    if(state.players==='le5'&&s.playersMax>5)return false;
    if(['6','7','8'].includes(state.players)&&!(s.playersMin<=+state.players&&s.playersMax>=+state.players))return false;
    if(state.players==='ge8'&&s.playersMin<8)return false;
    return true;});
  if(state.sort==='priceAsc')l.sort((a,b)=>a.price-b.price);
  else if(state.sort==='priceDesc')l.sort((a,b)=>b.price-a.price);
  else if(state.sort==='players')l.sort((a,b)=>b.playersMax-a.playersMax);
  else if(state.sort==='rating')l.sort((a,b)=>(b.rating.avg||0)-(a.rating.avg||0));
  else l.sort((a,b)=>(b.pinned-a.pinned)||(b.createdAt-a.createdAt));
  return l;
}
const chipRow=(items,cur)=>items.map(it=>'<button class="chip'+(cur===it.key?' on':'')+'" data-pick="'+esc(it.key)+'">'+esc(it.label)+'</button>').join('');

function renderHome(){
  const c=SITE.config, list=listScripts(), pinned=SITE.scripts.filter(s=>s.pinned);
  const cards=list.map(s=>'<a class="card'+(s.pinned?' is-pinned':'')+'" href="#/d/'+esc(s.id)+'"><div class="cover">'+coverHtml(s)+'</div><div class="info">'+
    '<div class="title-row"><span class="title">'+esc(s.title)+'</span>'+badge(s.type)+(s.pinned?'<span class="pin-flag">📌</span>':(s.featured?'<span class="fire">🔥</span>':''))+'</div>'+
    '<div class="tags">'+s.genre.map(g=>'<span class="tag">'+esc(g)+'</span>').join('')+'</div>'+
    '<div class="meta">'+fmtPlayers(s)+(fmtGender(s)?' · '+fmtGender(s):'')+' · '+fmtDuration(s)+' · '+esc(s.difficulty)+'</div>'+
    '<div class="bottom">'+fmtPrice(s)+'<span class="rate-wrap"><span class="rate">'+(s.rating.count?starsHtml(s.rating.avg,s.rating.count):'<span class="rate none">暂无评分</span>')+'</span></span></div></div></a>').join('');
  app.innerHTML='<div class="page">'+
   '<header class="topbar"><div class="brand"><div class="logo">🎭</div><div><h1>'+esc(c.storeName)+'</h1><div class="slogan">'+esc(c.slogan||'今晚，来一场好局')+'</div></div></div>'+
   '<div class="total"><span class="online-badge">线上版</span><br>共<b>'+SITE.scripts.length+'</b>本</div></header>'+
   (c.announcement?'<div class="notice"><span class="icon">📢</span><span class="txt">'+esc(c.announcement)+'</span></div>':'')+
   '<div class="search"><input id="q" type="search" placeholder="搜索剧本名 / 作者 / 发行" value="'+esc(state.q)+'"></div>'+
   '<div class="chip-row" data-group="type">'+chipRow([{key:'',label:'全部'}].concat(TYPES.map(t=>({key:t,label:t}))),state.type)+'</div>'+
   '<div class="chip-row" data-group="genre">'+chipRow([{key:'',label:'全部题材'}].concat(G.map(g=>({key:g,label:g}))),state.genre)+'</div>'+
   '<div class="chip-row" data-group="players">'+chipRow(PF,state.players)+'</div>'+
   '<div class="sort-row"><span>筛选结果：'+list.length+' 本</span><select id="sort">'+
     ['new|最新上架','rating|评分最高','priceAsc|价格从低到高','priceDesc|价格从高到低','players|人数最多'].map(o=>{const[v,n]=o.split('|');return '<option value="'+v+'"'+(state.sort===v?' selected':'')+'>'+n+'</option>'}).join('')+'</select></div>'+
   (pinned.length?'<section class="rec"><div class="sec-title">📌 店长推荐</div><div class="rec-scroll">'+pinned.map(s=>
     '<a class="rec-card" href="#/d/'+esc(s.id)+'"><div class="rec-cover">'+coverHtml(s)+'</div><div class="rec-name">'+esc(s.title)+'</div><div class="rec-sub">'+fmtPlayers(s)+' · '+esc(s.type)+'</div><div class="rec-price">¥'+esc(s.price)+'<small>/人</small></div></a>').join('')+'</div></section>':'')+
   '<div class="sec-title plain">📚 全部剧本</div><main class="list">'+(cards||'<div class="empty"><div class="big">🎭</div>没有找到符合条件的剧本</div>')+'</main>'+
   '<div class="site-foot">本页为线上浏览版 · 更新于 '+fmtDate(SITE.generatedAt)+'<br>写评价 / 组局预约请到店或 <a href="javascript:void(0)" id="foot-contact">联系店家</a></div></div>';
  $('#q').addEventListener('input',e=>{state.q=e.target.value;const p=e.target.selectionStart;renderHome();const q2=$('#q');q2.focus();q2.setSelectionRange(p,p);});
  $$('.chip').forEach(b=>b.addEventListener('click',()=>{state[b.closest('.chip-row').dataset.group]=b.dataset.pick;renderHome();}));
  $('#sort').addEventListener('change',e=>{state.sort=e.target.value;renderHome();});
  const fc=$('#foot-contact');if(fc)fc.addEventListener('click',()=>copyContact());
}

function copyContact(){
  const t=SITE.config.contact||'';
  if(!t)return toast('店家暂未填写联系方式');
  if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast('已复制：\n'+t),()=>toast(t));else toast(t);
}

function renderDetail(id){
  const s=SITE.scripts.find(x=>x.id===id);
  if(!s){location.hash='#/';return;}
  const gen=fmtGender(s);
  const cells=[{k:'人数',v:fmtPlayers(s)+(gen?'<div class="k" style="margin-top:2px">'+esc(gen)+'</div>':'')},{k:'时长',v:fmtDuration(s)},{k:'难度',v:esc(s.difficulty)},{k:'类型',v:esc(s.type)},{k:'发行',v:esc(s.publisher)||'—'},{k:'作者',v:esc(s.author)||'—'}];
  if(s.heat>0)cells.push({k:'网络热度',v:'★'.repeat(s.heat),gold:true});
  const revHtml=s.reviews.length?s.reviews.map(r=>'<div class="review"><div class="rv-avatar" style="background:'+GRADS[hashCode(r.name)%GRADS.length][1]+'">'+esc((r.name||'匿').trim()[0]||'匿')+'</div><div class="rv-main"><div class="rv-head"><span class="rv-name">'+esc(r.name)+'</span>'+(r.source==='network'?'<span class="rv-src net">网络</span>':'<span class="rv-src">玩家</span>')+(r.source==='local'?starsHtml(r.rating):'')+'<span class="rv-time">'+fmtDate(r.createdAt)+'</span></div><div class="rv-content">'+esc(r.content)+'</div></div></div>').join(''):'<div class="rv-empty">还没有评价，来店里体验后给个评价吧～</div>';
  app.innerHTML='<div class="page"><button class="back-btn" id="back">←</button>'+
   '<div class="d-hero">'+coverHtml(s,true)+'<div class="shade"></div></div>'+
   '<div class="d-head"><div class="title">'+esc(s.title)+' '+badge(s.type)+(s.pinned?'<span class="pin-flag">📌 店长推荐</span>':(s.featured?'<span class="fire">🔥 热本</span>':''))+'</div>'+
   '<div class="sub">'+s.genre.map(g=>'#'+esc(g)).join(' ')+'　·　上架于 '+fmtDate(s.createdAt)+'</div></div>'+
   '<div class="d-grid">'+cells.map(m=>'<div class="d-cell"><div class="k">'+esc(m.k)+'</div><div class="v'+(m.gold?' gold':'')+'">'+m.v+'</div></div>').join('')+'</div>'+
   '<div class="d-section"><h3>剧本简介</h3><div class="body">'+esc(s.intro||'简介暂未填写～')+(s.note?'<div class="d-note">📌 '+esc(s.note)+'</div>':'')+'</div></div>'+
   '<div class="d-section"><h3>玩家评价</h3>'+
   '<div class="rating-card"><div class="rc-left"><div class="rc-avg">'+(s.rating.count?s.rating.avg.toFixed(1):'—')+'</div><div class="rc-stars">'+starsHtml(s.rating.avg)+'</div><div class="rc-count">'+(s.rating.count?s.rating.count+' 位玩家评分':'还没有玩家评分')+(s.rating.total>s.rating.count?' · '+(s.rating.total-s.rating.count)+' 条网络评价':'')+'</div></div></div>'+
   '<div class="rv-note">线上版暂不支持写评价，到店体验后即可提交 ✍️</div>'+revHtml+'</div>'+
   '<div class="d-footer"></div>'+
   '<div class="price-bar"><div>'+fmtPrice(s)+'</div><button class="contact-btn" id="copy-contact">联系店家预约</button></div></div>';
  $('#back').addEventListener('click',()=>location.hash='#/');
  $('#copy-contact').addEventListener('click',copyContact);
}

window.addEventListener('hashchange',()=>{window.scrollTo(0,0);const h=location.hash||'#/';const m=h.match(/^#\/d\/([\w-]+)$/);m?renderDetail(m[1]):renderHome();});
renderHome();

/* ================= 线上版开屏（与店内核算一致：有图用图，无图雾气动效） ================= */
(function(){
  if(sessionStorage.getItem('splashSeen'))return;
  const c=SITE.config,ov=document.createElement('div');
  ov.className='splash'+(c.splashImage?' has-img':'');
  if(c.splashImage){const bg=document.createElement('div');bg.className='sp-bg';bg.style.backgroundImage="url('"+c.splashImage+"')";ov.appendChild(bg);}
  else ['a','b','c'].forEach(k=>{const f=document.createElement('div');f.className='sp-fog '+k;ov.appendChild(f);});
  const sh=document.createElement('div');sh.className='sp-shade';ov.appendChild(sh);
  const inner=document.createElement('div');inner.className='sp-inner';
  inner.innerHTML='<div class="sp-logo">🎭</div><h1 class="sp-title">'+esc(c.storeName)+'</h1><p class="sp-slogan">'+esc(c.slogan||'今晚，来一场好局')+'</p>';
  const en=document.createElement('div');en.className='sp-enter';en.textContent='轻触屏幕 · 进入本单';
  ov.append(inner,en);
  ov.addEventListener('click',()=>{sessionStorage.setItem('splashSeen','1');ov.classList.add('out');setTimeout(()=>ov.remove(),650);},{once:true});
  document.body.appendChild(ov);
})();
</script>
</body>
</html>
